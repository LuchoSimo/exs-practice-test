<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EXS Practice Assessment — Version 9 (38 new questions)</title><style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#fdf5f9;color:#42283c}
*{box-sizing:border-box}body{margin:0;padding:24px 16px}
main{max-width:860px;margin:auto;background:white;border:1px solid #f0d9e5;border-radius:18px;box-shadow:0 12px 36px #172c3d12;overflow:hidden}
header{background:linear-gradient(110deg,#542942,#b05482);color:white;padding:24px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header strong{font-size:20px;letter-spacing:-.03em}header small{display:block;color:#ffe1ed;margin-top:5px;font-size:12px}header .pill{background:#ffffff20;color:white;border:1px solid #ffffff40;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:750}
article{padding:28px 30px 34px;min-height:420px}h1{font-size:26px;line-height:1.22;margin:0 0 12px;letter-spacing:-.025em}h2{font-size:20px;margin:18px 0 12px}p{line-height:1.55;color:#334854}a{color:#97436e}button{font:inherit;cursor:pointer}
.muted{color:#60747b;font-size:14px}.label{text-transform:uppercase;letter-spacing:.10em;font-size:11px;color:#97436e;font-weight:800}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.stat{border:1px solid #d4e3e7;background:#f7fcfc;border-radius:12px;padding:18px}.stat b{display:block;font-size:23px;color:#97436e;margin-bottom:6px}.stat span{font-size:13px;color:#4e6570}
.note{padding:13px 15px;border-radius:10px;background:#f0f6f7;color:#40565c;font-size:14px;line-height:1.55}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:25px}
.btn{border:1px solid #97436e;background:#af5484;color:white;padding:12px 19px;font-weight:750;border-radius:10px}.btn:hover{background:#783253}.btn.secondary{background:#fff;color:#873b60;border-color:#bed2d7}.btn.secondary:hover{background:#ecf7f8}.btn:disabled{opacity:.42;cursor:default}button:focus-visible,summary:focus-visible{outline:3px solid #e6aa30;outline-offset:3px}
.toprow{display:flex;gap:10px;justify-content:space-between;align-items:start}.time{padding:10px 12px;border:1px solid #b4cbd0;background:#edf8f9;color:#175c65;font-variant-numeric:tabular-nums;font-size:18px;font-weight:850;border-radius:9px;white-space:nowrap}.time.warn{background:#fff1eb;border-color:#f4c3af;color:#a3391c}
.track{height:8px;border-radius:20px;background:#e4ecee;overflow:hidden;margin:20px 0 24px}.fill{height:100%;background:#bb6033;transition:width .14s ease}
.prompt{font-size:21px;white-space:pre-line;line-height:1.45;margin:15px 0 22px;font-weight:760;letter-spacing:-.01em}.answers{display:grid;gap:10px}.answer{width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:15px;border:1px solid #cfdde1;background:#fff;color:#153039;border-radius:11px;line-height:1.45}.answer:hover{background:#f4fcfd;border-color:#73aeb8}.answer.active{border:2px solid #a4542c;background:#e8f8fa;padding:14px}.key{flex:0 0 28px;border:1px solid #c4d4d9;background:#f4f8f9;color:#375860;border-radius:7px;height:28px;display:grid;place-items:center;font-size:13px;font-weight:800}.answer.active .key{background:#a4542c;color:#fff;border-color:#a4542c}.minor{font-size:13px;color:#698087;margin-top:16px}
.gridresult{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:22px 0}.scorebox{text-align:center;border:1px solid #dae5e8;border-radius:12px;padding:15px}.scorebox strong{font-size:25px;display:block;color:#97436e}.scorebox span{font-size:12px;color:#4a626d}.review{margin-top:27px}.review h2{border-bottom:1px solid #d9e5e9;padding-bottom:9px}.review details{border:1px solid #dce6e9;border-radius:10px;margin:9px 0;overflow:hidden}.review summary{padding:13px 15px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:14px;font-weight:650}.body{padding:0 16px 14px;font-size:14px}.body p{margin:8px 0}.ok{color:#087a54}.bad{color:#b33230}.skip{color:#647882}.outcome{font-weight:850;white-space:nowrap}.skiplink{font-size:13px;margin-top:10px}
@media(max-width:550px){body{padding:0;background:white}main{border:0;border-radius:0;box-shadow:none}header{padding:20px}article{padding:21px}.statgrid,.gridresult{grid-template-columns:1fr}.prompt{font-size:19px}.controls>.btn{flex:1}}
</style></head>
<body><main><header><div><strong>EXS Practice Assessment · Version 9</strong><small>Independent practice · Not an official TestGorilla assessment</small></div><div class="pill">38 new questions · 32 minutes</div></header>
<article id="app" aria-live="polite">Loading assessment…</article></main>
<script>
(()=>{'use strict';
const sections=[{"title":"Logic and Reasoning","seconds":1140,"questions":[{"q":"What is the next number?\n9, 14, 24, 39, 59, ?","o":["79","82","84","89"],"a":2,"e":"The differences are +5, +10, +15 and +20. The next difference is +25, so 59+25=84."},{"q":"Two numerical patterns are interleaved:\n2, 50, 6, 45, 18, 40, 54, ?","o":["30","35","36","38"],"a":1,"e":"The odd-positioned numbers triple: 2,6,18,54. The even-positioned numbers decrease by five: 50,45,40,35."},{"q":"Which letter completes the series?\nA, B, D, G, K, P, ?","o":["U","V","W","X"],"a":1,"e":"The number of positions moved forward rises by one: +1,+2,+3,+4,+5, then +6. P is the 16th letter; 16+6=22, or V."},{"q":"Use the same rule in every row:\n2 | 7 → 18\n4 | 3 → 20\n5 | 6 → ?","o":["35","40","45","50"],"a":1,"e":"Multiply the first number by two more than the second: 2×(7+2)=18 and 4×(3+2)=20. Thus 5×(6+2)=40."},{"q":"Some delivery drones use electric motors. Every electric delivery drone has GPS. What must be true?","o":["Some delivery drones have GPS.","All GPS devices are fitted to electric drones.","No fuel-powered drone has GPS.","Every delivery drone uses an electric motor."],"a":0,"e":"At least one delivery drone is electric, and every such drone has GPS. Consequently some delivery drones have GPS."},{"q":"A candidate can qualify ONLY if they pass both the safety test and the identity check. Marta has qualified. What must be true?","o":["Marta passed only the safety test.","Marta failed the identity check.","Marta passed both checks.","Everyone who passes both automatically qualifies."],"a":2,"e":"Both checks are necessary for qualification. Since Marta qualified, she must have passed both. The policy does not say passing them is sufficient for qualification."},{"q":"Five steps A, B, C, D and E must be completed once. A before B; C immediately after D; E last. Which sequence works?","o":["D – C – A – B – E","A – C – D – B – E","B – A – D – C – E","D – A – C – B – E"],"a":0,"e":"D–C are adjacent in that order, A precedes B, and E is last. Only D–C–A–B–E meets all three conditions."},{"q":"An equipment report is marked READY if and only if BOTH diagnostics have passed. The report is marked READY. What follows?","o":["At least one diagnostic failed.","Both diagnostics passed.","The report has not been checked.","Exactly one diagnostic passed."],"a":1,"e":"The 'if and only if' statement makes passing both diagnostics necessary and sufficient for READY status. READY therefore establishes both passed."},{"q":"Two departments have staff in the ratio 5:8. The larger has 39 more staff. How many people are in the two departments altogether?","o":["143","156","169","182"],"a":2,"e":"The ratio difference is 8−5=3 parts, worth 39 employees, so one part is 13. The 13 total parts therefore represent 13×13=169 people."},{"q":"After a 12% increase, a subscription costs €224. What was the original price?","o":["€196","€200","€205","€210"],"a":1,"e":"€224 is 112% of the original amount. Divide 224 by 1.12 to recover €200."},{"q":"A €1,800 budget is reduced by 22%. Then 25% of the REMAINING funds are reserved for travel. How much is reserved?","o":["€351","€360","€396","€450"],"a":0,"e":"After the reduction, €1,800×0.78=€1,404 remains. One quarter is €1,404×0.25=€351."},{"q":"Completed tasks increase from 75 to 90. What is the percentage increase?","o":["15%","18%","20%","25%"],"a":2,"e":"The increase is 90−75=15 tasks. Relative to the original 75, this is 15/75=20%."},{"q":"Three employees finish 20 cases each, while five employees finish 36 each. What is the overall average per employee?","o":["28","30","32","34"],"a":1,"e":"The total is 3×20+5×36=60+180=240 cases. Divide by eight employees for a weighted mean of 30."},{"q":"Two robots inspect 90 panels in five minutes. At the same per-robot rate, how many panels can four robots inspect in six minutes?","o":["180","198","216","240"],"a":2,"e":"One robot inspects 90÷(2×5)=9 panels per minute. Four robots for six minutes inspect 4×6×9=216 panels."},{"q":"A shuttle travels 150 km in 2 hours and 30 minutes at a constant speed. What is its speed?","o":["55 km/h","60 km/h","65 km/h","75 km/h"],"a":1,"e":"Two hours 30 minutes is 2.5 hours. Speed=150 km÷2.5 h=60 km/h."},{"q":"A motor consumes 15 litres of fuel over 120 km. At the same consumption rate, how much fuel is needed for 340 km?","o":["37.5 L","40 L","42.5 L","45 L"],"a":2,"e":"Consumption per kilometre=15÷120=0.125 L/km. Multiply by 340 km to obtain 42.5 L."},{"q":"Three training sessions start at 13:42. Each lasts 25 minutes, with a seven-minute break BETWEEN sessions. When does the last session finish?","o":["15:04","15:11","15:18","15:25"],"a":1,"e":"Three sessions take 3×25=75 minutes and two breaks add 2×7=14 minutes. Total 89 minutes after 13:42 is 15:11."},{"q":"All items containing lithium batteries must display a special label. Package X has no special label. What follows under the rule?","o":["Package X definitely contains lithium batteries.","Package X has already been shipped.","Package X does not contain lithium batteries.","Every labeled package contains batteries."],"a":2,"e":"If a lithium battery were present, the special label would be required. Since the label is absent, package X cannot contain a lithium battery if the rule is obeyed."},{"q":"A bag has six green and four orange chips. A chip is selected, replaced, and another is selected. What is the chance both are orange?","o":["2/15","4/25","1/5","1/4"],"a":1,"e":"Replacement makes the picks independent: (4/10)×(4/10)=16/100=4/25."},{"q":"A fair six-sided die is rolled twice. What is the probability of obtaining EXACTLY ONE six?","o":["1/6","5/18","1/3","11/36"],"a":1,"e":"There are two possible orders: six then not-six, or not-six then six. Probability=2×(1/6)×(5/6)=10/36=5/18."},{"q":"Find the MEDIAN of these eight readings:\n3, 19, 11, 5, 21, 9, 17, 15","o":["11","12","13","15"],"a":2,"e":"Sorted readings are 3,5,9,11,15,17,19,21. With eight values, average the 4th and 5th: (11+15)/2=13."},{"q":"A trapezoid has parallel sides of 10 m and 16 m, and a perpendicular height of 7 m. What is its area?","o":["84 m²","90 m²","91 m²","98 m²"],"a":2,"e":"Area of a trapezoid = (sum of parallel sides ÷ 2) × perpendicular height. Therefore (10+16)/2×7=13×7=91 m²."},{"q":"Three fifths of a stock are allocated. Of the stock REMAINING, 40% passes a quality check. What percentage of the ORIGINAL stock passes?","o":["16%","20%","24%","40%"],"a":0,"e":"After allocation, 2/5 or 40% remains. Forty percent of that remainder equals 0.40×0.40=0.16, or 16% of the original stock."},{"q":"Four regions increase output from last month to this month:\nEast: 48→60\nNorth: 100→120\nSouth: 70→84\nWest: 24→33\nWhich has the greatest percentage growth?","o":["East","North","South","West"],"a":3,"e":"East grows 12/48=25%; North grows 20%; South grows 20%; West grows 9/24=37.5%, the largest percentage."},{"q":"A code has two DIFFERENT letters chosen from A, B, C, followed by one digit chosen from 1, 2, 3, 4. Order matters. How many codes exist?","o":["12","18","24","36"],"a":2,"e":"There are three choices for the first letter, two remaining choices for the second, and four digit choices: 3×2×4=24."},{"q":"Service A charges €50 plus €6 per document. Service B charges €20 plus €9 per document. For how many documents do the charges match?","o":["8","9","10","12"],"a":2,"e":"Set 50+6n=20+9n, giving 30=3n. Thus the total costs match at n=10 documents."}]},{"title":"Attention to Detail","seconds":780,"questions":[{"q":"Master: QV-5O0-I7 (the middle character after 5 is CAPITAL O, and after the last hyphen is CAPITAL I). Which copy matches EXACTLY?","o":["QV-500-I7","QV-5O0-I7","QV-5O0-17","QV-5O0-I1"],"a":1,"e":"Only QV-5O0-I7 preserves the capital O between 5 and 0, the capital I, and the final digit 7."},{"q":"How many times does the EXACT code TN-84M appear?\nTN-84M · TN-8AM · TN-84M · TN-84m · TN-84M · NT-84M · TN-84M","o":["3","4","5","6"],"a":1,"e":"The exact code appears in positions 1, 3, 5 and 7, totaling four. The others differ in letter order, capitalization or digits."},{"q":"Original: Facility D, Aisle 14, Bin M7\nCopied: Facility D, Aisle 41, Bin M7\nWhich field changed?","o":["Facility","Bin","Aisle","No field"],"a":2,"e":"The aisle numbers 14 and 41 have the digits transposed. Facility D and Bin M7 match."},{"q":"Package IDs must run consecutively from KK-316 to KK-322. The scan lists KK-316, KK-317, KK-318, KK-320, KK-321, KK-322. Which ID is missing?","o":["KK-315","KK-319","KK-320","KK-323"],"a":1,"e":"The required sequence 316 through 322 includes 319 between 318 and 320. It is the only missing code."},{"q":"Times must be in strictly INCREASING order:\n1. 11:08\n2. 11:16\n3. 11:34\n4. 11:31\n5. 11:46\nWhich entry first violates the order?","o":["Entry 2","Entry 3","Entry 4","Entry 5"],"a":2,"e":"The sequence increases until 11:34, then moves backward to 11:31. Entry 4 is the first violation."},{"q":"Dates use DD/MM/YYYY. Which of these dates is INVALID?","o":["30/04/2026","29/02/2026","31/05/2026","28/02/2026"],"a":1,"e":"2026 is not a leap year, so February has only 28 days. Therefore 29/02/2026 is invalid."},{"q":"Which line contains a calculation error?\nA: 3 × €24 = €72\nB: 6 × €13 = €78\nC: 8 × €11 = €88\nD: 5 × €17 = €84","o":["A","B","C","D"],"a":3,"e":"Line D should be 5×€17=€85, not €84. All the other calculations are correct."},{"q":"An invoice lists 3 items at €18.75 each, 2 items at €7.40 each, plus €4.95 shipping. What is the EXACT total?","o":["€75.50","€76.00","€76.50","€77.00"],"a":1,"e":"3×€18.75=€56.25; 2×€7.40=€14.80; shipping is €4.95. Total=56.25+14.80+4.95=€76.00."},{"q":"A log begins at 08:47 and ends at 10:12 on the same day. What is the elapsed time?","o":["75 minutes","80 minutes","85 minutes","95 minutes"],"a":2,"e":"08:47 to 09:47 is 60 minutes, then 25 more minutes to 10:12. Total is 85 minutes."},{"q":"Master file: audit_pack_2026-Q3.xlsx\nWhich file name is identical, including punctuation and capitalization?","o":["audit_pack_2026-Q3.xlsx","audit-pack_2026-Q3.xlsx","audit_pack_2026-q3.xlsx","audit_pack_2026-Q3.xslx"],"a":0,"e":"Only the first option exactly matches both underscores, the hyphen, uppercase Q, number 3 and the .xlsx extension."},{"q":"Required code format: THREE uppercase letters, a slash, TWO digits, a hyphen, then ONE lowercase letter. Which code follows the format?","o":["MXQ/7-p","MxQ/07-p","MXQ/07-p","MXQ/07-P"],"a":2,"e":"MXQ/07-p has 3 uppercase letters, slash, 2 digits, hyphen, and one lowercase letter. Other options have a missing digit or incorrect capitalization."},{"q":"Approved: Batch QG-21, quantity 64, location L8. Which copied row has an error in QUANTITY (not batch or location)?","o":["QG-21 | 64 | L8","QG-21 | 46 | L8","QG-12 | 64 | L8","QG-21 | 64 | L9"],"a":1,"e":"Only the second row has an incorrect quantity, 46 instead of 64. The other incorrect rows alter the batch or location."}]}];
const app=document.getElementById('app');
let phase='intro',si=0,qi=0,deadline=0,interval=null;
let answers=sections.map(s=>Array(s.questions.length).fill(null)),completion=['',''];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clockFormat=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
const left=()=>Math.max(0,Math.ceil((deadline-Date.now())/1000));
function stop(){if(interval!==null){clearInterval(interval);interval=null}}
function start(index){stop();si=index;qi=0;deadline=Date.now()+sections[index].seconds*1000;phase='exam';render();interval=setInterval(tick,250)}
function tick(){if(phase!=='exam')return;const t=left();if(!t){complete(true);return;}const el=document.getElementById('timer');if(el){el.textContent=clockFormat(t);el.classList.toggle('warn',t<=120);}}
function complete(expired){if(phase!=='exam')return;stop();completion[si]=expired?'Timer expired':'Submitted';phase=si===0?'intermission':'results';render()}
const answered=i=>answers[i].filter(x=>x!==null).length;
const score=i=>answers[i].reduce((sum,a,n)=>sum+(a===sections[i].questions[n].a?1:0),0);
function intro(){return `<span class="label">New challenge · Medium difficulty</span><h1>38 completely new questions · Fourth edition</h1><p>Practice logic, quantitative reasoning, scheduling and precision checking with the same section sizes and time limits as previous versions.</p><div class="statgrid"><div class="stat"><b>26 questions</b><span>Logic and Reasoning · 19 minutes</span></div><div class="stat"><b>12 questions</b><span>Attention to Detail · 13 minutes</span></div></div><div class="note">One question at a time. You can revisit previous questions within the current section. Time runs continuously once a section starts, even if you switch tabs. Unanswered questions count as incorrect. Answers and explanations remain hidden until both sections finish. Reloading resets the attempt. You can pause between sections.</div><div class="controls"><span class="muted">Free practice. No login or score collection.</span><button class="btn" data-action="start">Begin Logic and Reasoning →</button></div><p class="skiplink"><a href="../">Version 1</a> · <a href="../version-2/">Version 2</a> · <a href="../version-3/">Version 3</a> · <a href="../version-4/">Version 4</a></p>`}
function exam(){const section=sections[si],question=section.questions[qi],choice=answers[si][qi];const options=question.o.map((option,i)=>`<button class="answer ${choice===i?'active':''}" aria-pressed="${choice===i}" data-choice="${i}"><span class="key">${'ABCD'[i]}</span><span>${esc(option)}</span></button>`).join('');return `<div class="toprow"><div><div class="label">Section ${si+1} of 2 · ${esc(section.title)}</div><h2>Question ${qi+1} / ${section.questions.length}</h2><div class="muted">${answered(si)} answered · ${section.questions.length-answered(si)} unanswered</div></div><div id="timer" role="timer" aria-label="Section time remaining" class="time ${left()<=120?'warn':''}">${clockFormat(left())}</div></div><div class="track"><div class="fill" style="width:${((qi+1)/section.questions.length)*100}%"></div></div><div class="prompt">${esc(question.q)}</div><div class="answers">${options}</div><div class="controls"><button class="btn secondary" data-action="prev" ${qi===0?'disabled':''}>← Previous</button><button class="btn" data-action="next">${qi===section.questions.length-1?(si===0?'Finish section 1 →':'See results →'):'Next question →'}</button></div><div class="minor">${choice===null?'No answer selected. You can skip and return.':'Your choice is saved for this attempt.'} The answer key is shown only after completion.</div>`}
function intermission(){return `<div class="label">Section 1 finished</div><h1>Attention to Detail comes next</h1><p>Logic and Reasoning is complete. Your answers are locked and your results stay hidden until the end.</p><div class="statgrid"><div class="stat"><b>12 questions</b><span>Attention to Detail</span></div><div class="stat"><b>13 minutes</b><span>Your timer begins when you start this section.</span></div></div><div class="note">Section 1 status: ${completion[0]}. Unanswered questions: ${sections[0].questions.length-answered(0)}.</div><div class="controls"><span class="muted">You may take a break now.</span><button class="btn" data-action="next-section">Start Attention to Detail →</button></div>`}
function resultItem(q,j,k){const answer=answers[j][k],ok=answer===q.a,state=answer===null?'Skipped':ok?'Correct':'Incorrect',clazz=answer===null?'skip':ok?'ok':'bad';return `<details><summary><span>Q${k+1}. ${esc(q.q.replace(/\n/g,' ').slice(0,80))}${q.q.length>80?'…':''}</span><span class="outcome ${clazz}">${state}</span></summary><div class="body"><p><b>Question:</b> ${esc(q.q).replace(/\n/g,'<br>')}</p><p><b>Your answer:</b> ${answer===null?'Unanswered':esc('ABCD'[answer]+'. '+q.o[answer])}</p><p><b>Correct answer:</b> ${esc('ABCD'[q.a]+'. '+q.o[q.a])}</p><p><b>Explanation:</b> ${esc(q.e)}</p></div></details>`}
function results(){const total=score(0)+score(1);return `<div class="label">Version 9 · Assessment finished</div><h1>Your results and explanations</h1><p class="muted">Each question is scored as correct, incorrect or skipped. Expand any item for a worked solution.</p><div class="gridresult"><div class="scorebox"><strong>${total}/38</strong><span>Overall (${Math.round(100*total/38)}%)</span></div><div class="scorebox"><strong>${score(0)}/26</strong><span>Logic and Reasoning</span></div><div class="scorebox"><strong>${score(1)}/12</strong><span>Attention to Detail</span></div></div><p class="muted">Section 1: ${completion[0]} · Section 2: ${completion[1]}</p><div class="controls"><button class="btn secondary" data-action="expand">Expand all explanations</button><button class="btn secondary" data-action="collapse">Collapse all</button><button class="btn" data-action="reset">Restart version 9 ↻</button></div>${sections.map((s,j)=>`<section class="review"><h2>${j+1}. ${esc(s.title)} — ${score(j)}/${s.questions.length}</h2>${s.questions.map((q,k)=>resultItem(q,j,k)).join('')}</section>`).join('')}<p class="skiplink"><a href="../">Version 1</a> · <a href="../version-2/">Version 2</a> · <a href="../version-3/">Version 3</a> · <a href="../version-4/">Version 4</a> · <a href="../version-5/">Version 5</a> · <a href="../version-6/">Version 6</a> · <a href="../version-7/">Version 7</a> · <a href="../version-8/">Version 8</a></p>`}
function render(){app.innerHTML=phase==='intro'?intro():phase==='exam'?exam():phase==='intermission'?intermission():results()}
app.addEventListener('click',ev=>{const button=ev.target.closest('button');if(!button||!app.contains(button)||button.disabled)return;if(button.hasAttribute('data-choice')){if(phase!=='exam')return;if(left()<=0){complete(true);return;}answers[si][qi]=Number(button.dataset.choice);render();return;}switch(button.dataset.action){case 'start':if(phase==='intro')start(0);break;case 'prev':if(phase==='exam'&&qi>0){qi--;render()}break;case 'next':if(phase==='exam'){if(left()<=0){complete(true);break}if(qi===sections[si].questions.length-1)complete(false);else{qi++;render()}}break;case 'next-section':if(phase==='intermission')start(1);break;case 'expand':app.querySelectorAll('details').forEach(d=>d.open=true);break;case 'collapse':app.querySelectorAll('details').forEach(d=>d.open=false);break;case 'reset':stop();phase='intro';si=0;qi=0;completion=['',''];answers=sections.map(s=>Array(s.questions.length).fill(null));render();break}});
render();
})();
</script></body></html>
