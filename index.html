<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EXS-style Practice Assessment | 38 Questions</title>
<style>
:root { color-scheme: light; font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; background: #f7f8fc; color: #172238; }
* { box-sizing: border-box; }
body { margin: 0; padding: 18px; }
.quiz { width: min(790px, 100%); margin: 0 auto; border: 1px solid #e2e7ef; border-radius: 17px; background: #fff; box-shadow: 0 5px 24px #1722380d; overflow: hidden; }
.head { padding: 22px 27px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: space-between; align-items: center; background: #101d38; color: #fff; }
.brand { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
.kicker { color: #c5d4f9; font-size: 12px; margin-top: 5px; }
.pill { display: inline-block; border-radius: 999px; padding: 6px 11px; background: #273b65; font-size: 12px; font-weight: 700; }
.content { padding: 25px 27px 29px; min-height: 390px; }
h1 { font-size: 25px; letter-spacing: -.025em; line-height: 1.2; margin: 4px 0 13px; }
h2 { font-size: 18px; margin: 0 0 8px; }
p { line-height: 1.55; margin: 9px 0; }
.muted { color: #5c6b80; font-size: 14px; }
.boxgrid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; margin: 22px 0; }
.stat { border: 1px solid #e0e7f1; border-radius: 12px; padding: 16px; background: #fafcff; }
.stat b { display: block; font-size: 24px; margin-bottom: 5px; color: #204898; }
.stat span { font-size: 13px; color: #4d5d70; }
.actions { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; margin-top: 24px; }
button { font: inherit; cursor: pointer; transition: background-color .12s, border-color .12s; }
.btn { border: 1px solid #2050ad; border-radius: 10px; background: #2353ae; color: white; font-weight: 700; padding: 12px 19px; }
.btn:hover { background: #153c89; }
.btn:focus-visible, .answer:focus-visible, summary:focus-visible { outline: 3px solid #ffbb40; outline-offset: 2px; }
.btn.subtle { color: #264470; border-color: #d5ddeb; background: #fff; }
.btn.subtle:hover { background: #f1f5fb; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.rule { height: 1px; background: #e7ebf2; margin: 22px 0; }
.note { font-size: 13px; color: #62738a; padding: 12px 14px; background: #f5f7fc; border-radius: 9px; }
.topline { display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.sect { text-transform: uppercase; color: #4d68a5; font-size: 11px; font-weight: 800; letter-spacing: .08em; }
.clock { border: 1px solid #d5e0f3; border-radius: 9px; background: #eff5ff; color: #173d82; padding: 8px 11px; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.clock.warning { color: #a42f12; background: #fff3eb; border-color: #efc6b3; }
.progress { height: 7px; border-radius: 20px; background: #e5ebf5; overflow: hidden; margin: 17px 0 22px; }
.progress > div { height: 100%; background: #3265d5; transition: width .15s; }
.question { font-size: 21px; font-weight: 750; line-height: 1.45; margin: 12px 0 21px; white-space: pre-line; }
.answerlist { display: grid; gap: 11px; }
.answer { width: 100%; text-align: left; border: 1px solid #d8dfec; background: white; color: #20314a; border-radius: 11px; padding: 14px 15px; display: flex; align-items: center; gap: 14px; line-height: 1.4; }
.answer:hover { border-color: #7199e0; background: #f8fbff; }
.answer.selected { border-color: #2353ae; background: #eaf1ff; box-shadow: inset 0 0 0 1px #2353ae; }
.letter { min-width: 26px; height: 26px; border: 1px solid #c6d2e8; border-radius: 7px; font-size: 13px; font-weight: 700; display: grid; place-items: center; background: #f3f6fb; }
.answer.selected .letter { background: #2353ae; color: #fff; border-color: #2353ae; }
.footerline { color: #68778c; font-size: 13px; }
.scores { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; margin: 20px 0; }
.score { padding: 14px; border: 1px solid #e1e6ee; border-radius: 12px; text-align: center; }
.score strong { display: block; font-size: 26px; color: #1c488f; }
.score span { font-size: 12px; color: #52647e; }
.reviewsection { margin-top: 24px; }
.reviewsection h2 { padding-bottom: 9px; border-bottom: 1px solid #dce3ec; }
details { border: 1px solid #dee5ef; margin: 8px 0; border-radius: 9px; background: #fff; overflow: hidden; }
summary { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 12px 14px; cursor: pointer; font-size: 14px; font-weight: 650; }
summary::-webkit-details-marker { display:none; }
.detailbody { padding: 0 14px 13px; font-size: 14px; line-height: 1.55; }
.detailbody p { margin: 7px 0; }
.ok { color: #187348; font-weight: 800; }
.bad { color: #b3332b; font-weight: 800; }
.skip { color: #6a7484; font-weight: 800; }
@media (max-width:540px) { body{padding:0;background:#fff}.quiz{border:none;box-shadow:none;border-radius:0}.head{padding:20px}.content{padding:20px}.boxgrid{grid-template-columns:1fr}.scores{grid-template-columns:1fr}.question{font-size:19px}.actions{align-items:stretch}.actions .btn{flex:1} }
</style>
</head>
<body>
<main class="quiz" id="exs-quiz">
  <div class="head"><div><div class="brand">EXS-style Practice Assessment</div><div class="kicker">Original questions · Not an official TestGorilla exam</div></div><span class="pill">38 questions · 32 minutes</span></div>
  <div id="exs-content" class="content">Loading interactive quiz…</div>
</main>
<script>
(() => {
'use strict';
const logic = [
  {q:'What number comes next?\n7, 11, 19, 31, 47, ?', o:['59','63','67','71'], a:2, e:'The gaps grow by 4 each time: +4, +8, +12, +16, so the next gap is +20. Thus 47 + 20 = 67.'},
  {q:'A box contains red and blue parts in a ratio of 3:5. If there are 64 parts in total, how many are blue?', o:['24','32','40','48'], a:2, e:'The ratio has 3 + 5 = 8 equal parts. Each part is 64 ÷ 8 = 8. Blue represents five parts, so 5 × 8 = 40.'},
  {q:'After a 25% price increase, a component costs €150. What was the original price?', o:['€112.50','€120','€125','€130'], a:1, e:'The new price is 125% of the old price. Original = 150 ÷ 1.25 = €120. Multiplying 150 by 0.75 would incorrectly apply a discount to the new price.'},
  {q:'All analysts are trained in data security. Some analysts work night shifts. Which statement must be true?', o:['Some night-shift workers have data-security training.','All night-shift workers are analysts.','All trained employees work night shifts.','No analysts work night shifts.'], a:0, e:'The analysts who work night shifts are among the analysts trained in data security. Therefore at least some night-shift workers have that training; the broader claims do not follow.'},
  {q:'No R-items are S-items. All T-items are R-items. Which conclusion necessarily follows?', o:['Some T-items are S-items.','No T-items are S-items.','All S-items are T-items.','All R-items are T-items.'], a:1, e:'Every T-item is inside the R group, and the R and S groups never overlap. So a T-item cannot be an S-item.'},
  {q:'Five workers assemble five identical devices in five hours. At the same rate, how long would ten workers take to assemble ten devices?', o:['2.5 hours','5 hours','10 hours','20 hours'], a:1, e:'Each worker effectively assembles one device in five hours. With ten workers working in parallel, ten devices still take five hours.'},
  {q:'Quarterly sales were Q1: 120, Q2: 150, Q3: 135 and Q4: 195 units. Which consecutive quarters show the largest percentage increase?', o:['Q1 to Q2','Q2 to Q3','Q3 to Q4','The increases are equal'], a:2, e:'Q1→Q2 rises 30/120 = 25%. Q2→Q3 falls 15/150 = 10%. Q3→Q4 rises 60/135 ≈ 44.4%, which is largest.'},
  {q:'Find the missing output.\n4 → 19\n6 → 39\n8 → ?', o:['65','67','69','71'], a:1, e:'Square the input and add three: 4² + 3 = 19; 6² + 3 = 39; 8² + 3 = 67.'},
  {q:'Four tasks A, B, C and D must be completed. D comes before A, A before C, and C before B. Which order is valid?', o:['A – D – C – B','D – C – A – B','B – D – A – C','D – A – C – B'], a:3, e:'The constraints form a single chain: D < A < C < B. Only D–A–C–B respects all three.'},
  {q:'Each letter in a word is moved two positions forward in the alphabet (A→C). How is BIRD encoded?', o:['DKTF','CJSE','DKUE','BKTG'], a:0, e:'Move each letter two places: B→D, I→K, R→T and D→F. The encoded word is DKTF.'},
  {q:'Which number is the odd one out?', o:['16','25','49','63'], a:3, e:'16 = 4², 25 = 5² and 49 = 7² are perfect squares. 63 is not a perfect square.'},
  {q:'Of 240 applicants, 15% are screened out. Of the remaining applicants, 25% are invited to an interview. How many are invited?', o:['36','51','60','204'], a:1, e:'After screening, 240 × 0.85 = 204 remain. A quarter of 204 is 51.'},
  {q:'A meeting starts at 14:35. The journey takes 1 hour and 45 minutes. What is the latest departure time to arrive exactly at the start?', o:['12:35','12:45','12:50','13:10'], a:2, e:'Subtract one hour from 14:35 to get 13:35; subtract another 45 minutes to get 12:50.'},
  {q:'An arrow turns 90° clockwise at each step: ↑, →, ↓, ←, ?. Which symbol follows?', o:['←','↓','↑','→'], a:2, e:'A clockwise quarter-turn cycles up, right, down, left, and back to up.'},
  {q:'Rule: If a sensor fails, a warning light switches on. The warning light is OFF. What follows logically?', o:['The sensor must have failed.','The light is broken.','A failure may have triggered the light.','The sensor did not fail.'], a:3, e:'This is the valid contrapositive: if failure implies light on, light off implies no failure (assuming the stated rule holds).'},
  {q:'Four readings have an average of 16. Three of them are 12, 18 and 14. What is the fourth?', o:['18','20','22','24'], a:1, e:'Four readings totaling an average of 16 must sum to 4 × 16 = 64. The known readings sum to 44. Missing reading = 64 − 44 = 20.'},
  {q:'Eight identical packs cost €52. How much do five packs cost at the same unit price?', o:['€32.50','€31.25','€35.00','€41.60'], a:0, e:'Unit price = 52 ÷ 8 = €6.50. Five packs cost 5 × €6.50 = €32.50.'},
  {q:'A bag holds 5 red, 3 blue and 2 green chips. One chip is drawn at random. What is the chance of blue?', o:['1/5','1/4','3/10','1/2'], a:2, e:'There are 10 chips total, of which 3 are blue. Probability = 3/10 = 30%.'},
  {q:'What number comes next?\n2, 6, 12, 20, 30, ?', o:['40','42','44','46'], a:1, e:'The gaps are +4, +6, +8, +10. The next gap is +12, giving 30 + 12 = 42. Equivalently, the terms are n(n+1).'},
  {q:'At a company of 50 employees, 28 speak English, 22 speak German, and 10 speak both. How many speak neither language?', o:['0','8','12','10'], a:3, e:'Speaking at least one = 28 + 22 − 10 = 40. Speaking neither = 50 − 40 = 10. Subtract the overlap only once.'},
  {q:'At least one of technicians A and B must be on duty. A is confirmed not to be on duty. What must be true?', o:['B is on duty.','Neither is on duty.','Both are on duty.','There is insufficient information.'], a:0, e:'The requirement is A OR B. If A is false, B must be true to satisfy it.'},
  {q:'Three quarters of a batch pass inspection. Two thirds of those passing are shipped. What fraction of the original batch is shipped?', o:['2/7','5/12','1/2','3/8'], a:2, e:'Multiply sequential fractions: (3/4) × (2/3) = 6/12 = 1/2 of the original batch.'},
  {q:'Offer A gives 20% off €90. Offer B gives 15% off €80. Which final price is lower?', o:['A, €72','B, €68','Both, €72','B, €72'], a:1, e:'A costs 90 × 0.80 = €72. B costs 80 × 0.85 = €68. Thus B is cheaper by €4.'},
  {q:'Mira ranks above Owen. Owen ranks above Priya. Priya ranks above Luis. Who is second-highest?', o:['Mira','Priya','Luis','Owen'], a:3, e:'The descending order is Mira > Owen > Priya > Luis, so Owen is second.'},
  {q:'A team compares output this year versus last year: North 120→144, South 90→117, East 80→96. Which region has the highest growth RATE?', o:['South','North','East','All equal'], a:0, e:'North grew 24/120 = 20%; South grew 27/90 = 30%; East grew 16/80 = 20%. South had the highest percentage growth.'},
  {q:'One machine processes 48 items in 6 minutes. If five identical machines work at the same rate for 15 minutes, how many items do they process?', o:['240','400','600','720'], a:2, e:'One machine processes 48 ÷ 6 = 8 items/minute. Five machines process 40/minute, so in 15 minutes they process 600 items.'}
];
const attention = [
  {q:'The master identifier is AX7-4B9-Q2. Which option is an EXACT match?', o:['AX7-4B9-O2','AX7-4B8-Q2','AX7-4B9-Q2','AX7-4B9-QZ'], a:2, e:'Only AX7-4B9-Q2 matches every character. Check the B9 block and the final Q2, where O/0 and 2/Z can look similar.'},
  {q:'Original: RQ-57381-ML\nCopied:   RQ-57318-ML\nWhat changed?', o:['Two digits were transposed.','The prefix changed.','The letter suffix changed.','Nothing changed.'], a:0, e:'The original numeric block ends in 81, whereas the copy ends in 18. The two digits have swapped positions.'},
  {q:'Find the identifier appearing TWICE.\nINV-02291 · INV-02219 · INV-02921 · INV-02291', o:['INV-02219','INV-02291','INV-02921','All appear twice'], a:1, e:'INV-02291 is the first and fourth identifier. Each of the others occurs once.'},
  {q:'Original: E. Mendez | ID 348016 | ERF1\nCopy: E. Mendez | ID 348061 | ERF1\nWhich field contains an error?', o:['Name','Site code','All three fields','Employee ID'], a:3, e:'The name E. Mendez and site ERF1 match. The employee ID differs: 348016 versus 348061.'},
  {q:'Appointments are at 08:10, 08:24, 08:41, 09:11 and 09:28. Between which consecutive appointments is the interval longest?', o:['08:10 to 08:24','08:24 to 08:41','08:41 to 09:11','09:11 to 09:28'], a:2, e:'The intervals are 14, 17, 30 and 17 minutes. The 08:41–09:11 interval is longest.'},
  {q:'How many times does the EXACT code LM-108 occur?\nLM-108 · LN-108 · LM-180 · LM-108 · ML-108', o:['1','3','4','2'], a:3, e:'LM-108 appears in positions 1 and 4. LN-108, LM-180 and ML-108 each differ in at least one character or its order.'},
  {q:'The approved reference is AB-50C-8174. Which entry is identical?', o:['AB-5OC-8174','AB-50C-8714','AB-50C-8174','AB-50G-8174'], a:2, e:'AB-50C-8174 matches exactly. Other entries change zero to letter O, transpose digits in 8174, or replace C with G.'},
  {q:'Which invoice row has the WRONG stated total?\nA: 6 × €12 = €72\nB: 4 × €15 = €65\nC: 5 × €7 = €35\nD: 3 × €18 = €54', o:['A','B','C','D'], a:1, e:'Row B should be 4 × €15 = €60, not €65. All other row totals are correct.'},
  {q:'A report says a truck departed at 09:40 and reached the destination at 09:22 on the SAME day. Which issue should be flagged?', o:['The destination was too far.','The date format is invalid.','The departure time occurs after arrival.','No issue can be identified.'], a:2, e:'For the same trip on the same date, an arrival time of 09:22 precedes a recorded departure of 09:40. The timestamp sequence needs investigation.'},
  {q:'Roster name: Mariana López\nTransferred name: Marina López\nWhich statement is accurate?', o:['The first names differ; surnames match.','The surnames differ; first names match.','Both first and last names match exactly.','Both first and last names differ.'], a:0, e:'Mariana and Marina are different first names (Mariana includes another a). Both surnames are López.'},
  {q:'Original amount: 4,809.60\nCopied amount:   4,890.60\nWhat is the difference in the transcription?', o:['The decimal digits differ.','The thousands digit differs.','The two amounts are identical.','Two digits before the decimal are transposed.'], a:3, e:'The original whole-number part ends in 09 (4,809); the copy ends in 90 (4,890). The 0 and 9 before the decimal have been transposed.'},
  {q:'Verify the total: Item A is 2 × €19.90, Item B is 3 × €8.50, and shipping is €5.00. What should the invoice total be?', o:['€65.30','€69.30','€70.30','€73.80'], a:2, e:'Item A = €39.80, item B = €25.50, and shipping = €5.00. Total = 39.80 + 25.50 + 5.00 = €70.30.'}
];
const sections=[{name:'Logic and Reasoning',secs:19*60,questions:logic},{name:'Attention to Detail',secs:13*60,questions:attention}];
const content=document.getElementById('exs-content');
let phase='intro',secIndex=0,qIndex=0,deadline=0,timer=null;
let answers=sections.map(s=>s.questions.map(()=>null));
let completion=['',''];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
function remaining(){return Math.max(0,Math.ceil((deadline-Date.now())/1000));}
function stopTimer(){if(timer!==null){clearInterval(timer);timer=null;}}
function reset(){stopTimer();answers=sections.map(s=>s.questions.map(()=>null));completion=['',''];phase='intro';secIndex=0;qIndex=0;render();}
function startSection(i){stopTimer();secIndex=i;qIndex=0;phase='test';deadline=Date.now()+sections[i].secs*1000;render();timer=setInterval(tick,250);}
function tick(){if(phase!=='test')return;const t=remaining();if(t<=0){finishSection(true);return;}const clock=document.getElementById('exs-clock');if(clock){clock.textContent=fmt(t);clock.classList.toggle('warning',t<=120);}}
function finishSection(timedOut){if(phase!=='test')return;stopTimer();completion[secIndex]=timedOut?'Time expired':'Submitted';phase=secIndex===0?'between':'results';render();}
function score(i){return answers[i].reduce((sum,choice,j)=>sum+(choice===sections[i].questions[j].a?1:0),0);}
function unanswered(i){return answers[i].filter(x=>x===null).length;}
function intro(){return `<h1>Practice under real assessment timing</h1><p class="muted">38 original multiple-choice questions, one at a time. Your section timer begins when you press Start. This is independent practice, not the live employer assessment.</p><div class="boxgrid"><div class="stat"><b>26 questions</b><span>Logic and Reasoning · 19 min · ~44 sec/question</span></div><div class="stat"><b>12 questions</b><span>Attention to Detail · 13 min · 65 sec/question</span></div></div><div class="note">You can change answers and return to earlier questions within a section. Unanswered questions count as incorrect. The test automatically moves on when a section's time expires. Correct answers and detailed explanations are shown only at the end. Progress resets if you reload.</div><div class="actions"><span class="muted">Keep pen, paper and a calculator handy if you like.</span><button class="btn" data-act="start">Start section 1 →</button></div>`;}
function test(){const sec=sections[secIndex],q=sec.questions[qIndex],chosen=answers[secIndex][qIndex],n=sec.questions.length;
const items=q.o.map((opt,i)=>`<button class="answer ${chosen===i?'selected':''}" data-pick="${i}" aria-pressed="${chosen===i?'true':'false'}"><span class="letter">${'ABCD'[i]}</span><span>${esc(opt)}</span></button>`).join('');
const answered=answers[secIndex].filter(x=>x!==null).length;
return `<div class="topline"><div><div class="sect">Section ${secIndex+1} of 2 · ${esc(sec.name)}</div><div class="muted">Question ${qIndex+1} of ${n} · ${answered} answered</div></div><div id="exs-clock" class="clock ${remaining()<=120?'warning':''}" role="timer" aria-label="Time remaining">${fmt(remaining())}</div></div><div class="progress"><div style="width:${(qIndex+1)/n*100}%"></div></div><div class="question">${esc(q.q)}</div><div class="answerlist">${items}</div><div class="actions"><button class="btn subtle" data-act="back" ${qIndex===0?'disabled':''}>← Previous</button><button class="btn" data-act="next">${qIndex===n-1?(secIndex===0?'Finish section 1 →':'Submit and score →'):'Next question →'}</button></div><p class="footerline">${chosen===null?'No answer selected; you can skip and return.':'Answer saved. You may change it until this section ends.'} Answers and explanations remain hidden until both sections are complete.</p>`;
}
function between(){return `<div class="sect">Section 1 complete</div><h1>Next: Attention to Detail</h1><p>You have completed the 26-question Logic and Reasoning section.</p><div class="stat"><b>12 questions · 13 min</b><span>Watch closely for transposed digits, identical-looking characters, discrepancies and incorrect totals.</span></div><p class="muted">Status: ${completion[0]}. Unanswered in section 1: ${unanswered(0)}. Results stay hidden until both sections end.</p><div class="actions"><span class="muted">Your 13-minute timer starts only when you continue.</span><button class="btn" data-act="continue">Start section 2 →</button></div>`;}
function reviewItem(q,i,j){const chosen=answers[i][j];const right=chosen===q.a;const status=chosen===null?'Unanswered':right?'Correct':'Incorrect';const cls=chosen===null?'skip':right?'ok':'bad';return `<details><summary><span>Q${j+1}. ${esc(q.q.replace(/\n/g,' ').slice(0,76))}${q.q.length>76?'…':''}</span><span class="${cls}">${status}</span></summary><div class="detailbody"><p><strong>Question:</strong> ${esc(q.q).replace(/\n/g,'<br>')}</p><p><strong>Your answer:</strong> ${chosen===null?'— Not answered':esc('ABCD'[chosen]+'. '+q.o[chosen])}</p><p><strong>Correct answer:</strong> ${esc('ABCD'[q.a]+'. '+q.o[q.a])}</p><p><strong>Explanation:</strong> ${esc(q.e)}</p></div></details>`;}
function results(){const s0=score(0),s1=score(1),total=s0+s1,pct=Math.round(total/38*100);return `<div class="sect">Assessment complete</div><h1>Your practice results</h1><p class="muted">Scored against the original answer key. Open each question to see your response, the correct answer and a worked explanation.</p><div class="scores"><div class="score"><strong>${total}/38</strong><span>Overall · ${pct}%</span></div><div class="score"><strong>${s0}/26</strong><span>Logic and Reasoning</span></div><div class="score"><strong>${s1}/12</strong><span>Attention to Detail</span></div></div><p class="muted">Section 1: ${completion[0]}, ${unanswered(0)} unanswered. Section 2: ${completion[1]}, ${unanswered(1)} unanswered.</p><div class="actions"><button class="btn subtle" data-act="expand">Expand all explanations</button><button class="btn subtle" data-act="collapse">Collapse all</button><button class="btn" data-act="restart">Try again ↻</button></div>${sections.map((sec,i)=>`<div class="reviewsection"><h2>${i+1}. ${esc(sec.name)} (${score(i)}/${sec.questions.length})</h2>${sec.questions.map((q,j)=>reviewItem(q,i,j)).join('')}</div>`).join('')}`;}
function render(){content.innerHTML=phase==='intro'?intro():phase==='test'?test():phase==='between'?between():results();}
content.addEventListener('click',event=>{
const btn=event.target.closest('button');if(!btn||!content.contains(btn)||btn.disabled)return;
if(btn.hasAttribute('data-pick')){if(phase!=='test')return;if(remaining()===0){finishSection(true);return;}answers[secIndex][qIndex]=Number(btn.dataset.pick);render();return;}
switch(btn.dataset.act){
case 'start': if(phase==='intro')startSection(0);break;
case 'continue':if(phase==='between')startSection(1);break;
case 'back':if(phase==='test'&&qIndex>0){qIndex--;render();}break;
case 'next':if(phase==='test'){if(remaining()===0){finishSection(true);break;}if(qIndex===sections[secIndex].questions.length-1)finishSection(false);else {qIndex++;render();}}break;
case 'restart':reset();break;
case 'expand':content.querySelectorAll('details').forEach(d=>d.open=true);break;
case 'collapse':content.querySelectorAll('details').forEach(d=>d.open=false);break;
}
});
render();
})();
</script>
</body>
</html>
