<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EXS Practice Assessment — Version 8 (38 new questions)</title><style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f2f9fa;color:#16334b}
*{box-sizing:border-box}body{margin:0;padding:24px 16px}
main{max-width:860px;margin:auto;background:white;border:1px solid #d4e7eb;border-radius:18px;box-shadow:0 12px 36px #172c3d12;overflow:hidden}
header{background:linear-gradient(110deg,#163c60,#2b7da3);color:white;padding:24px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header strong{font-size:20px;letter-spacing:-.03em}header small{display:block;color:#daf4fd;margin-top:5px;font-size:12px}header .pill{background:#ffffff20;color:white;border:1px solid #ffffff40;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:750}
article{padding:28px 30px 34px;min-height:420px}h1{font-size:26px;line-height:1.22;margin:0 0 12px;letter-spacing:-.025em}h2{font-size:20px;margin:18px 0 12px}p{line-height:1.55;color:#334854}a{color:#24769a}button{font:inherit;cursor:pointer}
.muted{color:#60747b;font-size:14px}.label{text-transform:uppercase;letter-spacing:.10em;font-size:11px;color:#24769a;font-weight:800}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.stat{border:1px solid #d4e3e7;background:#f7fcfc;border-radius:12px;padding:18px}.stat b{display:block;font-size:23px;color:#24769a;margin-bottom:6px}.stat span{font-size:13px;color:#4e6570}
.note{padding:13px 15px;border-radius:10px;background:#f0f6f7;color:#40565c;font-size:14px;line-height:1.55}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:25px}
.btn{border:1px solid #24769a;background:#247faf;color:white;padding:12px 19px;font-weight:750;border-radius:10px}.btn:hover{background:#115b82}.btn.secondary{background:#fff;color:#1d6685;border-color:#bed2d7}.btn.secondary:hover{background:#ecf7f8}.btn:disabled{opacity:.42;cursor:default}button:focus-visible,summary:focus-visible{outline:3px solid #e6aa30;outline-offset:3px}
.toprow{display:flex;gap:10px;justify-content:space-between;align-items:start}.time{padding:10px 12px;border:1px solid #b4cbd0;background:#edf8f9;color:#175c65;font-variant-numeric:tabular-nums;font-size:18px;font-weight:850;border-radius:9px;white-space:nowrap}.time.warn{background:#fff1eb;border-color:#f4c3af;color:#a3391c}
.track{height:8px;border-radius:20px;background:#e4ecee;overflow:hidden;margin:20px 0 24px}.fill{height:100%;background:#bb6033;transition:width .14s ease}
.prompt{font-size:21px;white-space:pre-line;line-height:1.45;margin:15px 0 22px;font-weight:760;letter-spacing:-.01em}.answers{display:grid;gap:10px}.answer{width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:15px;border:1px solid #cfdde1;background:#fff;color:#153039;border-radius:11px;line-height:1.45}.answer:hover{background:#f4fcfd;border-color:#73aeb8}.answer.active{border:2px solid #a4542c;background:#e8f8fa;padding:14px}.key{flex:0 0 28px;border:1px solid #c4d4d9;background:#f4f8f9;color:#375860;border-radius:7px;height:28px;display:grid;place-items:center;font-size:13px;font-weight:800}.answer.active .key{background:#a4542c;color:#fff;border-color:#a4542c}.minor{font-size:13px;color:#698087;margin-top:16px}
.gridresult{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:22px 0}.scorebox{text-align:center;border:1px solid #dae5e8;border-radius:12px;padding:15px}.scorebox strong{font-size:25px;display:block;color:#24769a}.scorebox span{font-size:12px;color:#4a626d}.review{margin-top:27px}.review h2{border-bottom:1px solid #d9e5e9;padding-bottom:9px}.review details{border:1px solid #dce6e9;border-radius:10px;margin:9px 0;overflow:hidden}.review summary{padding:13px 15px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:14px;font-weight:650}.body{padding:0 16px 14px;font-size:14px}.body p{margin:8px 0}.ok{color:#087a54}.bad{color:#b33230}.skip{color:#647882}.outcome{font-weight:850;white-space:nowrap}.skiplink{font-size:13px;margin-top:10px}
@media(max-width:550px){body{padding:0;background:white}main{border:0;border-radius:0;box-shadow:none}header{padding:20px}article{padding:21px}.statgrid,.gridresult{grid-template-columns:1fr}.prompt{font-size:19px}.controls>.btn{flex:1}}
</style></head>
<body><main><header><div><strong>EXS Practice Assessment · Version 8</strong><small>Independent practice · Not an official TestGorilla assessment</small></div><div class="pill">38 new questions · 32 minutes</div></header>
<article id="app" aria-live="polite">Loading assessment…</article></main>
<script>
(()=>{'use strict';
const sections=[{"title":"Logic and Reasoning","seconds":1140,"questions":[{"q":"What number comes next?\n2, 3, 5, 9, 17, ?","o":["25","31","33","35"],"a":2,"e":"The differences double each time: +1, +2, +4, +8, so the next increase is +16. Therefore 17+16=33."},{"q":"Two sequences are interleaved. What is the next number?\n80, 4, 40, 7, 20, 10, 10, ?","o":["11","12","13","14"],"a":2,"e":"The odd-positioned terms halve: 80,40,20,10. The even-positioned terms increase by 3: 4,7,10,13."},{"q":"Which letter follows the pattern?\nB, E, J, Q, ?","o":["W","X","Y","Z"],"a":3,"e":"The letter positions are 2,5,10,17: one more than the squares 1,4,9,16. The next is 25+1=26, corresponding to Z."},{"q":"The same rule applies to each input:\n3 → 14\n5 → 32\n7 → 58\n9 → ?","o":["88","90","92","94"],"a":2,"e":"Square the number, then add the number and 2. For 9: 9²+9+2=81+11=92."},{"q":"Some dispatchers are technicians. Every technician has completed first-aid training. What must be true?","o":["All dispatchers have first-aid training.","Some dispatchers have first-aid training.","No technicians are dispatchers.","Everyone with first-aid training is a technician."],"a":1,"e":"Those dispatchers who are technicians have first-aid training because all technicians have completed it. Hence at least some dispatchers are trained."},{"q":"Only inspected components may be exported. Component X has been exported. Which conclusion is justified?","o":["Component X was inspected.","Every inspected component is exported.","Component X was inspected twice.","Component X passed every possible test."],"a":0,"e":"The policy says exporting requires inspection. If X was exported, it must have been inspected. The rule says nothing about repeated inspections or other tests."},{"q":"A siren sounds whenever Sensor A OR Sensor B detects smoke. The siren is silent. What follows, assuming the rule holds?","o":["Both sensors detected smoke.","At least one sensor detected smoke.","Neither sensor detected smoke.","Exactly one sensor detected smoke."],"a":2,"e":"If either sensor detecting smoke would activate the siren, a silent siren implies A did not detect smoke AND B did not detect smoke."},{"q":"Five jobs F, G, H, J and K must be scheduled. F is before H; H is immediately before G; J comes after G; K is last. Which order works?","o":["F – H – G – J – K","F – G – H – J – K","H – G – F – J – K","F – H – J – G – K"],"a":0,"e":"H and G must be adjacent in that order, with F earlier, J later, and K in the final position. Only F–H–G–J–K meets all constraints."},{"q":"A shipment is divided across three destinations in the ratio 4:7:9. The total contains 300 items. How many are sent to the SECOND destination?","o":["60","90","105","135"],"a":2,"e":"The ratio has 4+7+9=20 parts, with each part worth 300÷20=15 items. The second destination receives 7×15=105."},{"q":"A group has 45 specialists. Eighteen work on satellites, 21 on ground systems, and 7 work on BOTH. How many work on NEITHER?","o":["6","9","13","20"],"a":2,"e":"Working on at least one area: 18+21−7=32. Neither: 45−32=13. The overlap must be subtracted once."},{"q":"An item costs €240. Its price rises 25%, then the increased price is discounted by 12%. What is the final price?","o":["€252","€259.20","€264","€268.80"],"a":2,"e":"First increase €240×1.25=€300; then discount €300×0.88=€264. The final price is 10% above the original."},{"q":"Eighteen percent of a budget equals €63,000. What is the full budget?","o":["€320,000","€340,000","€350,000","€360,000"],"a":2,"e":"The budget is €63,000÷0.18=€350,000. Divide by 18% rather than subtracting 18% from €63,000."},{"q":"Four analysts average 27 completed tasks each. Six other analysts average 32 each. What is the combined average per analyst?","o":["29","30","30.5","31"],"a":1,"e":"The total is 4×27+6×32=108+192=300 tasks. Ten analysts average 300÷10=30."},{"q":"Machine A assembles 24 units per hour. Machine B assembles 36 per hour. If both run for three hours, how many units are assembled?","o":["144","168","180","216"],"a":2,"e":"The combined rate is 24+36=60 units/hour. In three hours, 60×3=180 units."},{"q":"Three workers pack 12 boxes in two hours. At the same constant per-worker rate, how many boxes can five workers pack in five hours?","o":["30","40","45","50"],"a":3,"e":"Three workers working for two hours provide 6 worker-hours to pack 12 boxes, or 2 boxes per worker-hour. Five workers for five hours provide 25 worker-hours, yielding 50 boxes."},{"q":"A motor uses 9 litres of fuel per hour. How much fuel is needed for 2 hours 40 minutes at the same consumption rate?","o":["21 L","22.5 L","24 L","27 L"],"a":2,"e":"2 hours 40 minutes is 2⅔ hours. At 9 litres/hour, fuel needed is 9×(8/3)=24 litres."},{"q":"A monitoring session begins at 22:50 and lasts 2 hours 45 minutes. When does it end?","o":["23:35 the same day","00:35 the next day","01:25 the next day","01:35 the next day"],"a":3,"e":"22:50+2 hours=00:50 the following day, then +45 minutes = 01:35 the following day."},{"q":"Six people each shake hands ONCE with every other person. How many handshakes occur?","o":["12","15","18","30"],"a":1,"e":"Each of 6 people has 5 potential partners, but 6×5 counts every handshake twice. So 6×5÷2=15."},{"q":"A box has 3 blue, 2 yellow and 5 white tokens. Two are drawn without replacement. What is the probability of getting one blue and one yellow, in either order?","o":["1/15","2/15","1/6","1/5"],"a":1,"e":"Blue then yellow has probability (3/10)×(2/9)=1/15. Yellow then blue also has probability 1/15. Together they total 2/15."},{"q":"A fair coin is flipped three times. What is the probability of obtaining EXACTLY one head?","o":["1/8","1/4","3/8","1/2"],"a":2,"e":"There are 2³=8 equally likely sequences. Exactly one head appears in HTT, THT, or TTH: 3 of 8, or 3/8."},{"q":"What is the MEDIAN of the seven readings?\n13, 8, 15, 21, 11, 17, 9","o":["11","12","13","15"],"a":2,"e":"Sorted values are 8,9,11,13,15,17,21. With seven readings, the fourth value is the median: 13."},{"q":"A parallelogram has a base of 14 metres and a perpendicular height of 6 metres. What is its area?","o":["42 m²","72 m²","84 m²","96 m²"],"a":2,"e":"A parallelogram's area is base × perpendicular height, so 14×6=84 square metres."},{"q":"A tank is 30% full. After adding 24 litres, it is 70% full. What is the tank's total capacity?","o":["48 L","54 L","60 L","80 L"],"a":2,"e":"The added 24 litres represent 70%−30%=40% of the tank. Full capacity is 24÷0.40=60 litres."},{"q":"Seven tasks take 16 minutes each, and there is a 4-minute break after every task EXCEPT the last. How much total time is required?","o":["124 minutes","132 minutes","136 minutes","140 minutes"],"a":2,"e":"Work time is 7×16=112 minutes. Six gaps of 4 minutes add 24, giving 136 minutes in total."},{"q":"Four teams report last month → this month:\nNorth: 100 → 118\nEast: 80 → 104\nWest: 150 → 180\nSouth: 60 → 75\nWhich had the greatest PERCENTAGE increase?","o":["North","East","West","South"],"a":1,"e":"North grows 18%, East 24/80=30%, West 20%, and South 25%. East has the highest percentage increase at 30%."},{"q":"Service A charges €48 plus €2.40 per file. Service B charges €18 plus €3.40 per file. At how many files are total charges EQUAL?","o":["20","25","30","35"],"a":2,"e":"Set 48+2.40n=18+3.40n. Then 30=1.00n, giving 30 files. Both services cost €120 for 30 files."}]},{"title":"Attention to Detail","seconds":780,"questions":[{"q":"Master serial: IX-0O7-I1 (middle pair is numeral 0 then capital O; suffix is capital I then numeral 1). Which option matches EXACTLY?","o":["IX-OO7-I1","IX-0O7-I1","IX-0O7-11","IX-O07-I1"],"a":1,"e":"Only IX-0O7-I1 preserves the numeral zero followed by capital O and the capital I followed by numeral one."},{"q":"Original: Order GT-43816 | Bay C4\nCopied:   Order GT-48316 | Bay C4\nWhat changed?","o":["The order prefix","The bay","Two digits inside the order number","Nothing"],"a":2,"e":"The numeric blocks differ: 43816 becomes 48316; the digits 3 and 8 have exchanged places. The prefix and bay match."},{"q":"How many times does the EXACT string RD-601T occur?\nRD-601T · RD-6O1T · RD-601T · RD-610T · RD-601T · RD-601t · RD-601T","o":["2","3","4","5"],"a":2,"e":"The exact code occurs in positions 1, 3, 5, and 7, for four matches. The other variants change a digit, use O instead of zero, or lowercase t."},{"q":"A sequence must include every package ID from HH-024 to HH-030 inclusive. The scan lists HH-024, HH-025, HH-026, HH-028, HH-029, HH-030. Which is missing?","o":["HH-023","HH-027","HH-028","HH-031"],"a":1,"e":"The complete sequence is 024,025,026,027,028,029,030. The missing package is HH-027."},{"q":"Entries must be in chronological order:\n1. 09:13\n2. 09:27\n3. 09:36\n4. 09:33\n5. 09:45\nWhich entry FIRST breaks the rule?","o":["Entry 2","Entry 3","Entry 4","Entry 5"],"a":2,"e":"The entries rise until 09:36, then fall to 09:33. Entry 4 is the first out-of-order timestamp."},{"q":"Dates are written DD/MM/YYYY. Which date is INVALID?","o":["29/02/2028","30/06/2028","31/06/2028","31/08/2028"],"a":2,"e":"June has only 30 days, so June 31 is invalid. 2028 is a leap year, so February 29 is valid."},{"q":"Which invoice line has the WRONG total?\nA: 7 × €12 = €84\nB: 4 × €21 = €84\nC: 5 × €13 = €65\nD: 6 × €11 = €65","o":["A","B","C","D"],"a":3,"e":"Line D should be 6×€11=€66, not €65. A, B and C are correct."},{"q":"An invoice lists two items at €23.45 each, three at €7.80 each, and a €6.25 delivery fee. What is the EXACT total?","o":["€74.55","€75.55","€76.55","€77.55"],"a":2,"e":"Two items cost 2×€23.45=€46.90, and three cost 3×€7.80=€23.40. Adding €6.25 gives €76.55."},{"q":"An overnight process begins at 23:28 and ends at 00:14 the next day. What is its duration?","o":["36 minutes","42 minutes","46 minutes","54 minutes"],"a":2,"e":"From 23:28 to midnight is 32 minutes; from midnight to 00:14 is 14 minutes. Total 46 minutes."},{"q":"Master filename: risk_assess_Q4-26.csv\nWhich copy matches EXACTLY, including case and separators?","o":["risk_assess_Q4-26.csv","risk-assess_Q4-26.csv","risk_assess_q4-26.csv","risk_assess_Q4-26.cvs"],"a":0,"e":"Only the first option exactly reproduces both underscores, uppercase Q, hyphen, number, and .csv extension."},{"q":"Master location: Zone B | Row 16 | Slot H9. Which copied row has an error in ROW NUMBER, not in zone or slot?","o":["Zone B | Row 16 | Slot H9","Zone C | Row 16 | Slot H9","Zone B | Row 16 | Slot H8","Zone B | Row 61 | Slot H9"],"a":3,"e":"The fourth line transposes the row digits, changing Row 16 to Row 61. Other variants change the zone or slot."},{"q":"The required code format is two CAPITAL letters, two DIGITS, a hyphen, then three lowercase letters. Which entry meets the format exactly?","o":["AB12-abc","Ab12-abc","AB1C-abc","AB12-aBc"],"a":0,"e":"AB12-abc has exactly two uppercase letters, two digits, one hyphen and three lowercase letters. The others change letter case or substitute a letter for a digit."}]}];
const app=document.getElementById('app');
let phase='intro',si=0,qi=0,deadline=0,interval=null;
let answers=sections.map(s=>Array(s.questions.length).fill(null)),completion=['',''];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clockFormat=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
const left=()=>Math.max(0,Math.ceil((deadline-Date.now())/1000));
function stop(){if(interval!==null){clearInterval(interval);interval=null}}
function start(index){stop();si=index;qi=0;deadline=Date.now()+sections[index].seconds*1000;phase='exam';render();interval=setInterval(tick,250)}
function tick(){if(phase!=='exam')return;const t=left();if(!t){complete(true);return;}const el=document.getElementById('timer');if(el){el.textContent=clockFormat(t);el.classList.toggle('warn',t<=120);}}
function complete(expired){if(phase!=='exam')return;stop();completion[si]=expired?'Timer expired':'Submitted';phase=si===0?'intermission':'results';render()}
const answered=i=>answers[i].filter(x=>x!==null).length;
const score=i=>answers[i].reduce((sum,a,n)=>sum+(a===sections[i].questions[n].a?1:0),0);
function intro(){return `<span class="label">New challenge · Medium difficulty</span><h1>38 completely new questions · Fourth edition</h1><p>Practice logic, quantitative reasoning, scheduling and precision checking with the same section sizes and time limits as previous versions.</p><div class="statgrid"><div class="stat"><b>26 questions</b><span>Logic and Reasoning · 19 minutes</span></div><div class="stat"><b>12 questions</b><span>Attention to Detail · 13 minutes</span></div></div><div class="note">One question at a time. You can revisit previous questions within the current section. Time runs continuously once a section starts, even if you switch tabs. Unanswered questions count as incorrect. Answers and explanations remain hidden until both sections finish. Reloading resets the attempt. You can pause between sections.</div><div class="controls"><span class="muted">Free practice. No login or score collection.</span><button class="btn" data-action="start">Begin Logic and Reasoning →</button></div><p class="skiplink"><a href="../">Version 1</a> · <a href="../version-2/">Version 2</a> · <a href="../version-3/">Version 3</a> · <a href="../version-4/">Version 4</a></p>`}
function exam(){const section=sections[si],question=section.questions[qi],choice=answers[si][qi];const options=question.o.map((option,i)=>`<button class="answer ${choice===i?'active':''}" aria-pressed="${choice===i}" data-choice="${i}"><span class="key">${'ABCD'[i]}</span><span>${esc(option)}</span></button>`).join('');return `<div class="toprow"><div><div class="label">Section ${si+1} of 2 · ${esc(section.title)}</div><h2>Question ${qi+1} / ${section.questions.length}</h2><div class="muted">${answered(si)} answered · ${section.questions.length-answered(si)} unanswered</div></div><div id="timer" role="timer" aria-label="Section time remaining" class="time ${left()<=120?'warn':''}">${clockFormat(left())}</div></div><div class="track"><div class="fill" style="width:${((qi+1)/section.questions.length)*100}%"></div></div><div class="prompt">${esc(question.q)}</div><div class="answers">${options}</div><div class="controls"><button class="btn secondary" data-action="prev" ${qi===0?'disabled':''}>← Previous</button><button class="btn" data-action="next">${qi===section.questions.length-1?(si===0?'Finish section 1 →':'See results →'):'Next question →'}</button></div><div class="minor">${choice===null?'No answer selected. You can skip and return.':'Your choice is saved for this attempt.'} The answer key is shown only after completion.</div>`}
function intermission(){return `<div class="label">Section 1 finished</div><h1>Attention to Detail comes next</h1><p>Logic and Reasoning is complete. Your answers are locked and your results stay hidden until the end.</p><div class="statgrid"><div class="stat"><b>12 questions</b><span>Attention to Detail</span></div><div class="stat"><b>13 minutes</b><span>Your timer begins when you start this section.</span></div></div><div class="note">Section 1 status: ${completion[0]}. Unanswered questions: ${sections[0].questions.length-answered(0)}.</div><div class="controls"><span class="muted">You may take a break now.</span><button class="btn" data-action="next-section">Start Attention to Detail →</button></div>`}
function resultItem(q,j,k){const answer=answers[j][k],ok=answer===q.a,state=answer===null?'Skipped':ok?'Correct':'Incorrect',clazz=answer===null?'skip':ok?'ok':'bad';return `<details><summary><span>Q${k+1}. ${esc(q.q.replace(/\n/g,' ').slice(0,80))}${q.q.length>80?'…':''}</span><span class="outcome ${clazz}">${state}</span></summary><div class="body"><p><b>Question:</b> ${esc(q.q).replace(/\n/g,'<br>')}</p><p><b>Your answer:</b> ${answer===null?'Unanswered':esc('ABCD'[answer]+'. '+q.o[answer])}</p><p><b>Correct answer:</b> ${esc('ABCD'[q.a]+'. '+q.o[q.a])}</p><p><b>Explanation:</b> ${esc(q.e)}</p></div></details>`}
function results(){const total=score(0)+score(1);return `<div class="label">Version 8 · Assessment finished</div><h1>Your results and explanations</h1><p class="muted">Each question is scored as correct, incorrect or skipped. Expand any item for a worked solution.</p><div class="gridresult"><div class="scorebox"><strong>${total}/38</strong><span>Overall (${Math.round(100*total/38)}%)</span></div><div class="scorebox"><strong>${score(0)}/26</strong><span>Logic and Reasoning</span></div><div class="scorebox"><strong>${score(1)}/12</strong><span>Attention to Detail</span></div></div><p class="muted">Section 1: ${completion[0]} · Section 2: ${completion[1]}</p><div class="controls"><button class="btn secondary" data-action="expand">Expand all explanations</button><button class="btn secondary" data-action="collapse">Collapse all</button><button class="btn" data-action="reset">Restart version 8 ↻</button></div>${sections.map((s,j)=>`<section class="review"><h2>${j+1}. ${esc(s.title)} — ${score(j)}/${s.questions.length}</h2>${s.questions.map((q,k)=>resultItem(q,j,k)).join('')}</section>`).join('')}<p class="skiplink"><a href="../">Version 1</a> · <a href="../version-2/">Version 2</a> · <a href="../version-3/">Version 3</a> · <a href="../version-4/">Version 4</a> · <a href="../version-5/">Version 5</a> · <a href="../version-6/">Version 6</a> · <a href="../version-7/">Version 7</a></p>`}
function render(){app.innerHTML=phase==='intro'?intro():phase==='exam'?exam():phase==='intermission'?intermission():results()}
app.addEventListener('click',ev=>{const button=ev.target.closest('button');if(!button||!app.contains(button)||button.disabled)return;if(button.hasAttribute('data-choice')){if(phase!=='exam')return;if(left()<=0){complete(true);return;}answers[si][qi]=Number(button.dataset.choice);render();return;}switch(button.dataset.action){case 'start':if(phase==='intro')start(0);break;case 'prev':if(phase==='exam'&&qi>0){qi--;render()}break;case 'next':if(phase==='exam'){if(left()<=0){complete(true);break}if(qi===sections[si].questions.length-1)complete(false);else{qi++;render()}}break;case 'next-section':if(phase==='intermission')start(1);break;case 'expand':app.querySelectorAll('details').forEach(d=>d.open=true);break;case 'collapse':app.querySelectorAll('details').forEach(d=>d.open=false);break;case 'reset':stop();phase='intro';si=0;qi=0;completion=['',''];answers=sections.map(s=>Array(s.questions.length).fill(null));render();break}});
render();
})();
</script></body></html>
