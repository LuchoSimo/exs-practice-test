<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EXS Practice Assessment — Version 5 (38 new questions)</title><style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f1f5fc;color:#182846}
*{box-sizing:border-box}body{margin:0;padding:24px 16px}
main{max-width:860px;margin:auto;background:white;border:1px solid #d7e3f4;border-radius:18px;box-shadow:0 12px 36px #172c3d12;overflow:hidden}
header{background:linear-gradient(110deg,#122d59,#366bb5);color:white;padding:24px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header strong{font-size:20px;letter-spacing:-.03em}header small{display:block;color:#e1ecff;margin-top:5px;font-size:12px}header .pill{background:#ffffff20;color:white;border:1px solid #ffffff40;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:750}
article{padding:28px 30px 34px;min-height:420px}h1{font-size:26px;line-height:1.22;margin:0 0 12px;letter-spacing:-.025em}h2{font-size:20px;margin:18px 0 12px}p{line-height:1.55;color:#334854}a{color:#3367b7}button{font:inherit;cursor:pointer}
.muted{color:#60747b;font-size:14px}.label{text-transform:uppercase;letter-spacing:.10em;font-size:11px;color:#315f9d;font-weight:800}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.stat{border:1px solid #d4e3e7;background:#f7fcfc;border-radius:12px;padding:18px}.stat b{display:block;font-size:23px;color:#315f9d;margin-bottom:6px}.stat span{font-size:13px;color:#4e6570}
.note{padding:13px 15px;border-radius:10px;background:#f0f6f7;color:#40565c;font-size:14px;line-height:1.55}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:25px}
.btn{border:1px solid #315f9d;background:#346cb8;color:white;padding:12px 19px;font-weight:750;border-radius:10px}.btn:hover{background:#234c89}.btn.secondary{background:#fff;color:#28518c;border-color:#bed2d7}.btn.secondary:hover{background:#ecf7f8}.btn:disabled{opacity:.42;cursor:default}button:focus-visible,summary:focus-visible{outline:3px solid #e6aa30;outline-offset:3px}
.toprow{display:flex;gap:10px;justify-content:space-between;align-items:start}.time{padding:10px 12px;border:1px solid #b4cbd0;background:#edf8f9;color:#175c65;font-variant-numeric:tabular-nums;font-size:18px;font-weight:850;border-radius:9px;white-space:nowrap}.time.warn{background:#fff1eb;border-color:#f4c3af;color:#a3391c}
.track{height:8px;border-radius:20px;background:#e4ecee;overflow:hidden;margin:20px 0 24px}.fill{height:100%;background:#bb6033;transition:width .14s ease}
.prompt{font-size:21px;white-space:pre-line;line-height:1.45;margin:15px 0 22px;font-weight:760;letter-spacing:-.01em}.answers{display:grid;gap:10px}.answer{width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:15px;border:1px solid #cfdde1;background:#fff;color:#153039;border-radius:11px;line-height:1.45}.answer:hover{background:#f4fcfd;border-color:#73aeb8}.answer.active{border:2px solid #a4542c;background:#e8f8fa;padding:14px}.key{flex:0 0 28px;border:1px solid #c4d4d9;background:#f4f8f9;color:#375860;border-radius:7px;height:28px;display:grid;place-items:center;font-size:13px;font-weight:800}.answer.active .key{background:#a4542c;color:#fff;border-color:#a4542c}.minor{font-size:13px;color:#698087;margin-top:16px}
.gridresult{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:22px 0}.scorebox{text-align:center;border:1px solid #dae5e8;border-radius:12px;padding:15px}.scorebox strong{font-size:25px;display:block;color:#315f9d}.scorebox span{font-size:12px;color:#4a626d}.review{margin-top:27px}.review h2{border-bottom:1px solid #d9e5e9;padding-bottom:9px}.review details{border:1px solid #dce6e9;border-radius:10px;margin:9px 0;overflow:hidden}.review summary{padding:13px 15px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:14px;font-weight:650}.body{padding:0 16px 14px;font-size:14px}.body p{margin:8px 0}.ok{color:#087a54}.bad{color:#b33230}.skip{color:#647882}.outcome{font-weight:850;white-space:nowrap}.skiplink{font-size:13px;margin-top:10px}
@media(max-width:550px){body{padding:0;background:white}main{border:0;border-radius:0;box-shadow:none}header{padding:20px}article{padding:21px}.statgrid,.gridresult{grid-template-columns:1fr}.prompt{font-size:19px}.controls>.btn{flex:1}}
</style></head>
<body><main><header><div><strong>EXS Practice Assessment · Version 5</strong><small>Independent practice · Not an official TestGorilla assessment</small></div><div class="pill">38 new questions · 32 minutes</div></header>
<article id="app" aria-live="polite">Loading assessment…</article></main>
<script>
(()=>{'use strict';
const sections=[{"title":"Logic and Reasoning","seconds":1140,"questions":[{"q":"What comes next in the sequence?\n4, 10, 22, 46, 94, ?","o":["186","188","190","192"],"a":2,"e":"Each term is the previous term multiplied by 2, then increased by 2. Thus 94 × 2 + 2 = 190."},{"q":"The rule alternates: divide by 2, then add 5.\n72, 36, 41, 20.5, 25.5, 12.75, ?","o":["16.75","17.75","18.75","20.75"],"a":1,"e":"After dividing 25.5 by 2 to obtain 12.75, the next operation is +5, giving 17.75."},{"q":"Which letter comes next?\nD, F, I, M, R, ?","o":["W","X","Y","Z"],"a":1,"e":"Positions move forward by +2, +3, +4, +5, then +6. R is 18th, so the next letter is X, the 24th."},{"q":"The same rule applies to all rows:\n2 → 10\n3 → 18\n4 → 28\n5 → ?","o":["38","40","42","45"],"a":1,"e":"The rule is n × (n + 3): 2×5=10, 3×6=18, 4×7=28. For 5, calculate 5×8 = 40."},{"q":"Some quality auditors work remotely. Every remote quality auditor is bilingual. Which claim must be true?","o":["All bilingual workers are auditors.","Some quality auditors are bilingual.","No on-site auditors are bilingual.","All quality auditors work remotely."],"a":1,"e":"Because at least one quality auditor is remote and every remote quality auditor is bilingual, some quality auditors must be bilingual."},{"q":"Company policy says: Every approved expense claim has a purchase-order number. Claim 472 has no purchase-order number. What follows?","o":["Claim 472 must be approved.","Claim 472 was rejected yesterday.","Claim 472 is not approved.","All unapproved claims lack a number."],"a":2,"e":"Approved implies having a purchase-order number. A missing number means claim 472 cannot be approved under the stated policy; its exact status or date is not known."},{"q":"Five tasks must follow these rules: U comes before T; T before P; P immediately before R; S after R. Which order is valid?","o":["U – T – P – R – S","T – U – P – R – S","U – P – T – R – S","U – T – R – P – S"],"a":0,"e":"Only U–T–P–R–S satisfies the earlier/later constraints and keeps P immediately ahead of R."},{"q":"A code replaces every vowel with the NEXT vowel in the cycle A→E→I→O→U→A; consonants stay unchanged. How is CODE coded?","o":["CO DI","CUDI","CADU","CODO"],"a":1,"e":"O becomes U and E becomes I while C and D do not change, so CODE becomes CUDI."},{"q":"An allocation is split between Teams A, B and C in the ratio 5:3:2. The total is 2,500 units. How many go to Team B?","o":["500","650","750","1,000"],"a":2,"e":"The ratio has 10 equal parts; one part is 2,500 ÷ 10 = 250. Team B receives 3 × 250 = 750 units."},{"q":"A department increases its weekly output from 36 reports to 45. What is the percentage increase?","o":["20%","22.5%","25%","30%"],"a":2,"e":"The increase is 45 − 36 = 9 reports. Divide by the original 36: 9/36 = 25%."},{"q":"A €200 order receives a 15% discount, followed by a 10% service surcharge on the discounted price. What is the final amount?","o":["€185","€187","€190","€195"],"a":1,"e":"After the discount, €200 × 0.85 = €170. The surcharge makes it €170 × 1.10 = €187."},{"q":"Eight fifteenths of the items in a batch pass a test. Three quarters of the passing items are approved. What fraction of the ORIGINAL batch is approved?","o":["2/5","3/8","1/2","7/15"],"a":0,"e":"Multiply the successive proportions: (8/15) × (3/4) = 24/60 = 2/5."},{"q":"A vehicle travels 60 km at 30 km/h, then another 60 km at 60 km/h without stopping. What is its average speed for the full journey?","o":["40 km/h","42 km/h","45 km/h","50 km/h"],"a":0,"e":"The first leg takes 2 hours and the second takes 1 hour. Total distance 120 km ÷ total time 3 hours = 40 km/h. The simple average of speeds is not correct."},{"q":"Machine A processes 14 items per hour; Machine B processes 11 per hour. They run together for four hours. How many items are processed?","o":["88","96","100","104"],"a":2,"e":"Their combined rate is 14 + 11 = 25 items per hour. Over four hours they process 25 × 4 = 100."},{"q":"Two cyclists start 150 km apart and ride directly toward each other at constant speeds of 20 km/h and 30 km/h. How long before they meet?","o":["2 hours","2.5 hours","3 hours","5 hours"],"a":2,"e":"Their closing speed is 20 + 30 = 50 km/h. Meeting time is 150 ÷ 50 = 3 hours."},{"q":"If 48 is 30% of a certain quantity, what is 12.5% of that same quantity?","o":["18","20","22","24"],"a":1,"e":"The full quantity equals 48 ÷ 0.30 = 160. One eighth, or 12.5%, of 160 equals 20."},{"q":"Four consecutive interviews begin at 09:20. Each lasts 35 minutes, with a 5-minute gap BETWEEN interviews. When does the fourth finish?","o":["11:45","11:50","11:55","12:00"],"a":2,"e":"Four interviews take 4×35 = 140 minutes; three gaps add 15 minutes. Total 155 minutes after 09:20 is 11:55."},{"q":"Six employees complete an average of 8 cases each; four other employees average 13 cases each. What is the overall average per employee?","o":["9.5","10","10.5","11"],"a":1,"e":"The combined number of cases is 6×8 + 4×13 = 48 + 52 = 100. Ten employees average 100 ÷ 10 = 10 cases."},{"q":"Six readings are sorted: 6, 9, 13, 18, 20, 21. A seventh reading, 14, is added. What is the new median?","o":["13","13.5","14","16"],"a":2,"e":"The ordered seven readings are 6, 9, 13, 14, 18, 20, 21. The fourth (middle) reading is 14."},{"q":"The number of Type A units to Type B units is 7:4. There are 21 more Type A units than Type B. How many units are there in total?","o":["63","70","77","84"],"a":2,"e":"The difference is 7 − 4 = 3 ratio parts, representing 21. Each part is 7, so all 11 parts total 77."},{"q":"A bag has 3 blue tokens and 5 gold tokens. Two tokens are drawn WITHOUT replacement. What is the probability that both are blue?","o":["3/28","1/8","3/16","9/64"],"a":0,"e":"Probability = (3/8) × (2/7) = 6/56 = 3/28. The second draw has seven tokens remaining, only two blue."},{"q":"A record is marked FINAL if and only if both reviewers have signed. A record is NOT marked FINAL. Which statement must be true?","o":["Neither reviewer signed.","At least one reviewer has not signed.","Both reviewers signed.","The record was deleted."],"a":1,"e":"FINAL is equivalent to both signatures being present. Not FINAL means the condition 'both signed' is false: at least one signature is missing. It does not identify which."},{"q":"A rectangular floor is 10 m long and 8 m wide. Length rises by 25% while width falls by 20%. How does the floor area change?","o":["It falls by 5%.","It stays the same.","It rises by 5%.","It rises by 10%."],"a":1,"e":"The new dimensions are 12.5 m and 6.4 m, so the new area is 12.5×6.4 = 80 m², equal to the original 10×8 = 80 m²."},{"q":"A fair six-sided die and a fair coin are used independently. What is the probability of rolling a number ABOVE 4 and getting tails?","o":["1/12","1/6","1/4","1/3"],"a":1,"e":"Numbers above 4 are 5 and 6, so their probability is 2/6 = 1/3. Multiply by the independent 1/2 chance of tails: 1/6."},{"q":"A shift needs exactly 24 operators. Thirty are scheduled, but 20% are absent. How does attendance compare with the requirement?","o":["2 below","Exactly meets the requirement","2 above","6 above"],"a":1,"e":"20% of 30 is 6 absent, leaving 24 present. That exactly equals the staffing requirement."},{"q":"Service A charges a fixed €140 setup fee plus €5 per report. Service B charges €40 setup plus €9 per report. For how many reports do their total costs match?","o":["20","25","30","35"],"a":1,"e":"Set 140 + 5n = 40 + 9n. Rearranging gives 100 = 4n, so n = 25 reports."}]},{"title":"Attention to Detail","seconds":780,"questions":[{"q":"Master code: WQ-80I-5O2 (the characters after 80 and 5 are CAPITAL I and CAPITAL O). Which is an EXACT match?","o":["WQ-801-5O2","WQ-80I-502","WQ-80I-5O2","WQ-8OI-5O2"],"a":2,"e":"The exact string is WQ-80I-5O2. The correct copy preserves capital I after 80 and capital O after 5, not the digits 1 or 0."},{"q":"Reference email: operations.team+eu@orbitmail.org. Which address is copied EXACTLY?","o":["operations.team+eu@orbitmail.org","operations-team+eu@orbitmail.org","operations.team+eu@orbitmail.com","operations.team.eu@orbitmail.org"],"a":0,"e":"The first option retains the dot, plus sign, full domain and .org suffix exactly as written."},{"q":"How many times does the EXACT identifier NX-407B appear?\nNX-407B · NX-470B · NX-4078 · NX-407B · NX-407B","o":["2","3","4","5"],"a":1,"e":"The exact match occurs in positions 1, 4 and 5, for three occurrences. One option transposes 0 and 7, and another ends with 8 rather than B."},{"q":"A manifest must list each integer serial from DH-118 through DH-123. The entries are DH-118, DH-119, DH-121, DH-122, DH-123. Which one is missing?","o":["DH-117","DH-120","DH-121","DH-124"],"a":1,"e":"The expected series is 118, 119, 120, 121, 122 and 123. The only skipped identifier is DH-120."},{"q":"Dates use DD/MM/YYYY and must be sorted in ASCENDING order:\n1. 07/12/2026\n2. 05/12/2026\n3. 09/12/2026\n4. 11/12/2026\nWhich entry is the first ordering error?","o":["Entry 1","Entry 2","Entry 3","Entry 4"],"a":1,"e":"Entry 2 (5 December) appears after entry 1 (7 December), so the dates stop being ascending at entry 2."},{"q":"Original: Building F, Level 3, Bay 17\nCopied:   Building F, Level 8, Bay 17\nWhich field differs?","o":["Building","Level","Bay","No difference"],"a":1,"e":"The building and bay both match. The level was changed from 3 to 8."},{"q":"Invoice: 3 units at €14.20 each, 2 units at €8.75 each, and handling of €3.90. What is the EXACT total?","o":["€63.00","€64.00","€64.10","€65.00"],"a":1,"e":"3×14.20 = €42.60 and 2×8.75 = €17.50. Adding €3.90 yields €42.60 + €17.50 + €3.90 = €64.00."},{"q":"Which row contains the ONLY calculation error?\nA: 9 × 6 = 54\nB: 8 × 7 = 56\nC: 7 × 8 = 54\nD: 6 × 9 = 54","o":["A","B","C","D"],"a":2,"e":"Row C should read 7 × 8 = 56, not 54. The other three calculations are correct."},{"q":"An activity starts at 15:48 and ends at 17:13 on the same day. What is the duration?","o":["75 minutes","80 minutes","85 minutes","95 minutes"],"a":2,"e":"From 15:48 to 16:48 is 60 minutes, then 25 more minutes to 17:13. Total = 85 minutes."},{"q":"Master text (case and punctuation must match): Ref. A-72/b\nWhich transcription is EXACT?","o":["Ref. A-72/B","Ref. A-72/b","REF. A-72/b","Ref A-72/b"],"a":1,"e":"The second option matches the period after Ref, the uppercase A, the hyphen, the numbers, the slash and the lowercase b exactly."},{"q":"Original filename: run_2026-11-15_v3.csv\nWhich filename matches EXACTLY?","o":["run_2026-11-15_v3.csv","run_2026-15-11_v3.csv","run_2026-11-15_v3.xls","run-2026-11-15_v3.csv"],"a":0,"e":"The first option is identical in date order, underscores, version number and .csv extension."},{"q":"Ignore differences in LETTER CASE only; preserve hyphens and character order. How many entries match AZ-09x?\naz-09X · AZ09x · AZ-09x · aZ-09X · AZ-90x","o":["2","3","4","5"],"a":1,"e":"Ignoring case, matches occur at positions 1, 3 and 4. AZ09x lacks a hyphen; AZ-90x has the digits reversed."}]}];
const app=document.getElementById('app');
let phase='intro',si=0,qi=0,deadline=0,interval=null;
let answers=sections.map(s=>Array(s.questions.length).fill(null)),completion=['',''];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clockFormat=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
const left=()=>Math.max(0,Math.ceil((deadline-Date.now())/1000));
function stop(){if(interval!==null){clearInterval(interval);interval=null}}
function start(index){stop();si=index;qi=0;deadline=Date.now()+sections[index].seconds*1000;phase='exam';render();interval=setInterval(tick,250)}
function tick(){if(phase!=='exam')return;const t=left();if(!t){complete(true);return;}const el=document.getElementById('timer');if(el){el.textContent=clockFormat(t);el.classList.toggle('warn',t<=120);}}
function complete(expired){if(phase!=='exam')return;stop();completion[si]=expired?'Timer expired':'Submitted';phase=si===0?'intermission':'results';render()}
const answered=i=>answers[i].filter(x=>x!==null).length;
const score=i=>answers[i].reduce((sum,a,n)=>sum+(a===sections[i].questions[n].a?1:0),0);
function intro(){return `<span class="label">New challenge · Medium difficulty</span><h1>38 completely new questions · Fourth edition</h1><p>Practice logic, quantitative reasoning, scheduling and precision checking with the same section sizes and time limits as previous versions.</p><div class="statgrid"><div class="stat"><b>26 questions</b><span>Logic and Reasoning · 19 minutes</span></div><div class="stat"><b>12 questions</b><span>Attention to Detail · 13 minutes</span></div></div><div class="note">One question at a time. You can revisit previous questions within the current section. Time runs continuously once a section starts, even if you switch tabs. Unanswered questions count as incorrect. Answers and explanations remain hidden until both sections finish. Reloading resets the attempt. You can pause between sections.</div><div class="controls"><span class="muted">Free practice. No login or score collection.</span><button class="btn" data-action="start">Begin Logic and Reasoning →</button></div><p class="skiplink"><a href="../">Version 1</a> · <a href="../version-2/">Version 2</a> · <a href="../version-3/">Version 3</a> · <a href="../version-4/">Version 4</a></p>`}
function exam(){const section=sections[si],question=section.questions[qi],choice=answers[si][qi];const options=question.o.map((option,i)=>`<button class="answer ${choice===i?'active':''}" aria-pressed="${choice===i}" data-choice="${i}"><span class="key">${'ABCD'[i]}</span><span>${esc(option)}</span></button>`).join('');return `<div class="toprow"><div><div class="label">Section ${si+1} of 2 · ${esc(section.title)}</div><h2>Question ${qi+1} / ${section.questions.length}</h2><div class="muted">${answered(si)} answered · ${section.questions.length-answered(si)} unanswered</div></div><div id="timer" role="timer" aria-label="Section time remaining" class="time ${left()<=120?'warn':''}">${clockFormat(left())}</div></div><div class="track"><div class="fill" style="width:${((qi+1)/section.questions.length)*100}%"></div></div><div class="prompt">${esc(question.q)}</div><div class="answers">${options}</div><div class="controls"><button class="btn secondary" data-action="prev" ${qi===0?'disabled':''}>← Previous</button><button class="btn" data-action="next">${qi===section.questions.length-1?(si===0?'Finish section 1 →':'See results →'):'Next question →'}</button></div><div class="minor">${choice===null?'No answer selected. You can skip and return.':'Your choice is saved for this attempt.'} The answer key is shown only after completion.</div>`}
function intermission(){return `<div class="label">Section 1 finished</div><h1>Attention to Detail comes next</h1><p>Logic and Reasoning is complete. Your answers are locked and your results stay hidden until the end.</p><div class="statgrid"><div class="stat"><b>12 questions</b><span>Attention to Detail</span></div><div class="stat"><b>13 minutes</b><span>Your timer begins when you start this section.</span></div></div><div class="note">Section 1 status: ${completion[0]}. Unanswered questions: ${sections[0].questions.length-answered(0)}.</div><div class="controls"><span class="muted">You may take a break now.</span><button class="btn" data-action="next-section">Start Attention to Detail →</button></div>`}
function resultItem(q,j,k){const answer=answers[j][k],ok=answer===q.a,state=answer===null?'Skipped':ok?'Correct':'Incorrect',clazz=answer===null?'skip':ok?'ok':'bad';return `<details><summary><span>Q${k+1}. ${esc(q.q.replace(/\n/g,' ').slice(0,80))}${q.q.length>80?'…':''}</span><span class="outcome ${clazz}">${state}</span></summary><div class="body"><p><b>Question:</b> ${esc(q.q).replace(/\n/g,'<br>')}</p><p><b>Your answer:</b> ${answer===null?'Unanswered':esc('ABCD'[answer]+'. '+q.o[answer])}</p><p><b>Correct answer:</b> ${esc('ABCD'[q.a]+'. '+q.o[q.a])}</p><p><b>Explanation:</b> ${esc(q.e)}</p></div></details>`}
function results(){const total=score(0)+score(1);return `<div class="label">Version 5 · Assessment finished</div><h1>Your results and explanations</h1><p class="muted">Each question is scored as correct, incorrect or skipped. Expand any item for a worked solution.</p><div class="gridresult"><div class="scorebox"><strong>${total}/38</strong><span>Overall (${Math.round(100*total/38)}%)</span></div><div class="scorebox"><strong>${score(0)}/26</strong><span>Logic and Reasoning</span></div><div class="scorebox"><strong>${score(1)}/12</strong><span>Attention to Detail</span></div></div><p class="muted">Section 1: ${completion[0]} · Section 2: ${completion[1]}</p><div class="controls"><button class="btn secondary" data-action="expand">Expand all explanations</button><button class="btn secondary" data-action="collapse">Collapse all</button><button class="btn" data-action="reset">Restart version 5 ↻</button></div>${sections.map((s,j)=>`<section class="review"><h2>${j+1}. ${esc(s.title)} — ${score(j)}/${s.questions.length}</h2>${s.questions.map((q,k)=>resultItem(q,j,k)).join('')}</section>`).join('')}<p class="skiplink"><a href="../">Version 1</a> · <a href="../version-2/">Version 2</a> · <a href="../version-3/">Version 3</a></p>`}
function render(){app.innerHTML=phase==='intro'?intro():phase==='exam'?exam():phase==='intermission'?intermission():results()}
app.addEventListener('click',ev=>{const button=ev.target.closest('button');if(!button||!app.contains(button)||button.disabled)return;if(button.hasAttribute('data-choice')){if(phase!=='exam')return;if(left()<=0){complete(true);return;}answers[si][qi]=Number(button.dataset.choice);render();return;}switch(button.dataset.action){case 'start':if(phase==='intro')start(0);break;case 'prev':if(phase==='exam'&&qi>0){qi--;render()}break;case 'next':if(phase==='exam'){if(left()<=0){complete(true);break}if(qi===sections[si].questions.length-1)complete(false);else{qi++;render()}}break;case 'next-section':if(phase==='intermission')start(1);break;case 'expand':app.querySelectorAll('details').forEach(d=>d.open=true);break;case 'collapse':app.querySelectorAll('details').forEach(d=>d.open=false);break;case 'reset':stop();phase='intro';si=0;qi=0;completion=['',''];answers=sections.map(s=>Array(s.questions.length).fill(null));render();break}});
render();
})();
</script></body></html>
