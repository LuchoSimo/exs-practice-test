<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EXS Practice Assessment — Version 7 (38 new questions)</title><style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f7f3fc;color:#2b2048}
*{box-sizing:border-box}body{margin:0;padding:24px 16px}
main{max-width:860px;margin:auto;background:white;border:1px solid #e1d8ee;border-radius:18px;box-shadow:0 12px 36px #172c3d12;overflow:hidden}
header{background:linear-gradient(110deg,#382755,#6b4d9b);color:white;padding:24px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header strong{font-size:20px;letter-spacing:-.03em}header small{display:block;color:#f2e9ff;margin-top:5px;font-size:12px}header .pill{background:#ffffff20;color:white;border:1px solid #ffffff40;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:750}
article{padding:28px 30px 34px;min-height:420px}h1{font-size:26px;line-height:1.22;margin:0 0 12px;letter-spacing:-.025em}h2{font-size:20px;margin:18px 0 12px}p{line-height:1.55;color:#334854}a{color:#6e47a1}button{font:inherit;cursor:pointer}
.muted{color:#60747b;font-size:14px}.label{text-transform:uppercase;letter-spacing:.10em;font-size:11px;color:#6e47a1;font-weight:800}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.stat{border:1px solid #d4e3e7;background:#f7fcfc;border-radius:12px;padding:18px}.stat b{display:block;font-size:23px;color:#6e47a1;margin-bottom:6px}.stat span{font-size:13px;color:#4e6570}
.note{padding:13px 15px;border-radius:10px;background:#f0f6f7;color:#40565c;font-size:14px;line-height:1.55}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:25px}
.btn{border:1px solid #6e47a1;background:#7250a7;color:white;padding:12px 19px;font-weight:750;border-radius:10px}.btn:hover{background:#50307d}.btn.secondary{background:#fff;color:#5d3c8d;border-color:#bed2d7}.btn.secondary:hover{background:#ecf7f8}.btn:disabled{opacity:.42;cursor:default}button:focus-visible,summary:focus-visible{outline:3px solid #e6aa30;outline-offset:3px}
.toprow{display:flex;gap:10px;justify-content:space-between;align-items:start}.time{padding:10px 12px;border:1px solid #b4cbd0;background:#edf8f9;color:#175c65;font-variant-numeric:tabular-nums;font-size:18px;font-weight:850;border-radius:9px;white-space:nowrap}.time.warn{background:#fff1eb;border-color:#f4c3af;color:#a3391c}
.track{height:8px;border-radius:20px;background:#e4ecee;overflow:hidden;margin:20px 0 24px}.fill{height:100%;background:#bb6033;transition:width .14s ease}
.prompt{font-size:21px;white-space:pre-line;line-height:1.45;margin:15px 0 22px;font-weight:760;letter-spacing:-.01em}.answers{display:grid;gap:10px}.answer{width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:15px;border:1px solid #cfdde1;background:#fff;color:#153039;border-radius:11px;line-height:1.45}.answer:hover{background:#f4fcfd;border-color:#73aeb8}.answer.active{border:2px solid #a4542c;background:#e8f8fa;padding:14px}.key{flex:0 0 28px;border:1px solid #c4d4d9;background:#f4f8f9;color:#375860;border-radius:7px;height:28px;display:grid;place-items:center;font-size:13px;font-weight:800}.answer.active .key{background:#a4542c;color:#fff;border-color:#a4542c}.minor{font-size:13px;color:#698087;margin-top:16px}
.gridresult{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:22px 0}.scorebox{text-align:center;border:1px solid #dae5e8;border-radius:12px;padding:15px}.scorebox strong{font-size:25px;display:block;color:#6e47a1}.scorebox span{font-size:12px;color:#4a626d}.review{margin-top:27px}.review h2{border-bottom:1px solid #d9e5e9;padding-bottom:9px}.review details{border:1px solid #dce6e9;border-radius:10px;margin:9px 0;overflow:hidden}.review summary{padding:13px 15px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:14px;font-weight:650}.body{padding:0 16px 14px;font-size:14px}.body p{margin:8px 0}.ok{color:#087a54}.bad{color:#b33230}.skip{color:#647882}.outcome{font-weight:850;white-space:nowrap}.skiplink{font-size:13px;margin-top:10px}
@media(max-width:550px){body{padding:0;background:white}main{border:0;border-radius:0;box-shadow:none}header{padding:20px}article{padding:21px}.statgrid,.gridresult{grid-template-columns:1fr}.prompt{font-size:19px}.controls>.btn{flex:1}}
</style></head>
<body><main><header><div><strong>EXS Practice Assessment · Version 7</strong><small>Independent practice · Not an official TestGorilla assessment</small></div><div class="pill">38 new questions · 32 minutes</div></header>
<article id="app" aria-live="polite">Loading assessment…</article></main>
<script>
(()=>{'use strict';
const sections=[{"title":"Logic and Reasoning","seconds":1140,"questions":[{"q":"An alternating rule multiplies by 3, then adds 4. What comes next?\n2, 6, 10, 30, 34, 102, 106, ?","o":["314","316","318","322"],"a":2,"e":"The cycle is ×3, then +4. After 102+4=106, multiply by 3 to obtain 318."},{"q":"Find the missing number.\n1, 4, 10, 19, 31, ?","o":["43","45","46","49"],"a":2,"e":"The differences are 3, 6, 9 and 12. They rise by 3, so the next difference is 15. Thus 31+15=46."},{"q":"Which letter follows?\nC, E, H, L, Q, ?","o":["U","V","W","X"],"a":2,"e":"The letter positions are 3,5,8,12,17. Differences are +2,+3,+4,+5; next is +6, giving 23=W."},{"q":"All three rows follow the same rule:\n3 | 4 → 9\n5 | 6 → 25\n4 | 7 → ?","o":["21","23","24","28"],"a":2,"e":"Multiply the two numbers and subtract the first: 3×4−3=9, 5×6−5=25, and 4×7−4=24."},{"q":"Every orbital engineer on the project has security clearance. No person with security clearance is an external visitor. Which must be true?","o":["Some external visitors are orbital engineers.","No orbital engineer on the project is an external visitor.","Every cleared person is an engineer.","Every engineer in the country has clearance."],"a":1,"e":"All project orbital engineers are within the cleared group, and the cleared group has no overlap with external visitors. Therefore none of those engineers can be external visitors."},{"q":"Only employees with an access badge may enter Lab Q. Riley has an access badge. What can you conclude?","o":["Riley definitely entered Lab Q.","Riley is not allowed into Lab Q.","Riley might be allowed to enter Lab Q, but entry is not guaranteed.","Everyone entering Lab Q is Riley."],"a":2,"e":"An access badge is a necessary condition for entry, not proof that Riley has entered or satisfies every other possible entry condition."},{"q":"A sensor is in exactly one of two states: ACTIVE or STANDBY. It is not ACTIVE. Which conclusion follows?","o":["It must be in STANDBY.","It is malfunctioning.","It is both states.","The information is contradictory."],"a":0,"e":"The two states are exhaustive and mutually exclusive. If ACTIVE is ruled out, STANDBY must be true."},{"q":"Orders A, B, C, D and E must be handled once each. E is first, D immediately follows B, and A is after D but before C. Which order is valid?","o":["E – D – B – A – C","E – B – D – C – A","E – B – D – A – C","B – D – E – A – C"],"a":2,"e":"E must be first, B–D must remain adjacent in that order, and A must fall after D but before C. Only E–B–D–A–C meets all conditions."},{"q":"Two departments have staff numbers in the ratio 9:5. The larger department has 32 more employees. How many employees work in both departments combined?","o":["96","104","112","128"],"a":2,"e":"The difference is 4 ratio units=32, so one unit=8. Total staff=14 units×8=112."},{"q":"An agency completed 144 checks, representing 80% of its planned workload. How many checks were planned?","o":["170","175","180","185"],"a":2,"e":"The completed checks are 0.80 of the plan, so the plan is 144÷0.80=180."},{"q":"A product price increases by 15%, then decreases by 10% of the NEW price. Compared with the original price, what is the net change?","o":["A 1.5% decrease","A 3.5% increase","A 5% increase","A 5% decrease"],"a":1,"e":"Multiply the factors 1.15×0.90=1.035. The new price is 103.5% of the original, an increase of 3.5%."},{"q":"Five technicians complete 64 inspections each, while three others complete 88 each. What is the average number of inspections per technician across all eight?","o":["70","72","73","76"],"a":2,"e":"Total inspections=5×64+3×88=320+264=584. Divide by 8 people to get 73."},{"q":"Three identical printers produce 72 labels in four minutes. At the same constant rate, how many labels will five printers produce in seven minutes?","o":["180","196","210","225"],"a":2,"e":"One printer's rate is 72÷(3×4)=6 labels/minute. Five printers working seven minutes make 5×7×6=210 labels."},{"q":"A driver covers 24 km at 12 km/h, then 36 km at 18 km/h. With no stops, what is the average speed?","o":["14 km/h","15 km/h","16 km/h","17 km/h"],"a":1,"e":"The two legs take 24÷12=2 hours and 36÷18=2 hours. Total 60 km over four hours gives 15 km/h."},{"q":"A faster vehicle leaves the same starting point one hour after a slower vehicle. The slower travels at 50 km/h and the faster at 70 km/h. How long AFTER its own departure does the faster one catch up?","o":["2 hours","2.5 hours","3 hours","3.5 hours"],"a":1,"e":"The slower vehicle has a 50 km head start. The closing speed is 70−50=20 km/h, so catch-up requires 50÷20=2.5 hours after the faster vehicle leaves."},{"q":"A pipe fills a tank in four hours, while an open outlet would empty a full tank in eight hours. If both run together and the tank starts empty, how long until it fills?","o":["4 hours","6 hours","8 hours","12 hours"],"a":2,"e":"The fill rate is 1/4 tank/hour and the drain rate is 1/8. The net rate is 1/8, so filling takes 8 hours."},{"q":"Six consecutive interviews begin at 09:10. Each lasts 25 minutes, with a 10-minute gap BETWEEN interviews. At what time does the last interview finish?","o":["12:10","12:20","12:30","12:40"],"a":2,"e":"Six interviews take 6×25=150 minutes, and five gaps take 5×10=50 minutes. A total of 200 minutes after 09:10 is 12:30."},{"q":"A code uses three DIFFERENT digits chosen from {1,2,3,4,5}, and order matters. How many three-digit codes can be made?","o":["15","20","30","60"],"a":3,"e":"There are 5 choices for the first position, 4 for the second and 3 for the third: 5×4×3=60."},{"q":"A bag contains six red and four blue chips. Two are chosen without replacement. What is the probability that AT LEAST ONE is blue?","o":["1/3","1/2","2/3","3/4"],"a":2,"e":"Use the complement: both red=(6/10)×(5/9)=1/3. At least one blue=1−1/3=2/3."},{"q":"Five of eight devices work correctly. Two devices are selected without replacement. What is the probability BOTH work correctly?","o":["5/14","5/16","1/2","25/64"],"a":0,"e":"Choose a working device with probability 5/8, then another with probability 4/7. Their product=20/56=5/14."},{"q":"A triangular plot has a base of 18 metres and a perpendicular height of 9 metres. What is its area?","o":["72 m²","81 m²","108 m²","162 m²"],"a":1,"e":"The area of a triangle equals half × base × perpendicular height, giving (18×9)/2=81 m²."},{"q":"A drone starts at coordinate (−3,1), travels five units north, four east, then two south. What is its final coordinate?","o":["(−1,4)","(1,4)","(1,6)","(−1,6)"],"a":1,"e":"Start (−3,1). North 5 gives (−3,6), east 4 gives (1,6), and south 2 gives (1,4)."},{"q":"An item costs €375 to make and sells for €450. What is the profit MARGIN as a percentage of the selling price?","o":["16.7%","18.5%","20%","25%"],"a":0,"e":"Profit=€450−€375=€75. Margin uses the selling price as the denominator: €75÷€450≈16.7%. A 20% markup uses cost instead."},{"q":"Among 70 employees, 40 use System A, 35 use System B, and 15 use BOTH. How many employees use NEITHER system?","o":["5","10","15","20"],"a":1,"e":"Using at least one =40+35−15=60. Neither=70−60=10 employees."},{"q":"A mixture combines 12 litres containing 25% concentrate with 8 litres containing 50% concentrate. What percentage concentrate is in the combined mixture?","o":["30%","32.5%","35%","37.5%"],"a":2,"e":"Concentrate=12×0.25+8×0.50=3+4=7 litres. Total is 20 litres; concentration=7/20=35%."},{"q":"Supplier A charges €6 per unit plus €40 shipping. Supplier B charges €8 per unit plus €10 shipping. For 20 units, which supplier is cheaper, and by how much?","o":["A by €10","A by €20","B by €10","They cost the same"],"a":0,"e":"A costs 20×€6+€40=€160; B costs 20×€8+€10=€170. A is cheaper by €10."}]},{"title":"Attention to Detail","seconds":780,"questions":[{"q":"Master reference: XG-7O1-I04 (the characters immediately after 7 and after the second hyphen are capital O and capital I). Which is an exact match?","o":["XG-701-I04","XG-7O1-104","XG-7O1-I04","XG-7O1-I0A"],"a":2,"e":"Only XG-7O1-I04 matches every character; the other options substitute numeral 0 or 1 for a letter or change the suffix."},{"q":"Original record: Sector H | Dock 12 | Shift C\nCopied record: Sector H | Dock 21 | Shift C\nWhich field contains the discrepancy?","o":["Sector","Dock","Shift","All fields"],"a":1,"e":"Sector H and Shift C match. The dock digits are reversed, 12 versus 21."},{"q":"Count appearances of the EXACT code TR-09V:\nTR-09V · TR-0 9V · TR-09V · TR-09Y · TR-09v · TR-09V","o":["2","3","4","5"],"a":1,"e":"The matching code appears three times, at positions 1, 3 and 6. Embedded whitespace, final Y and lowercase v are different."},{"q":"Inventory must include every serial from ZM-451 to ZM-456 inclusive. These were scanned: ZM-451, ZM-452, ZM-453, ZM-455, ZM-456. What is missing?","o":["ZM-450","ZM-454","ZM-455","ZM-457"],"a":1,"e":"The consecutive required serial numbers are 451 through 456. The absent entry is ZM-454."},{"q":"Which invoice line is INCORRECT?\nA: 4 × €13 = €52\nB: 7 × €8 = €56\nC: 6 × €15 = €95\nD: 5 × €12 = €60","o":["A","B","C","D"],"a":2,"e":"C should be 6×€15=€90 rather than €95. A, B and D have correct totals."},{"q":"A log states 'Start 14:25; Finish 15:07; Duration 37 minutes.' Which field is inconsistent?","o":["Start time","Finish time","Recorded duration","No inconsistency"],"a":2,"e":"From 14:25 to 15:07 is 42 minutes, not the recorded 37 minutes. The duration field does not match the timestamps."},{"q":"The name must match exactly: Daria N. Holt\nWhich copy is exact, including punctuation and spacing?","o":["Daria N Holt","Daria N. Holt","Daria M. Holt","Daria N. Holtt"],"a":1,"e":"The second option is identical to Daria N. Holt, including the period after the middle initial and the exact spelling."},{"q":"Required identifier format: TWO uppercase letters, hyphen, THREE digits, hyphen, ONE lowercase letter. Which identifier follows the format?","o":["AB-123-Z","Ab-123-z","AB-123-z","AB-12B-z"],"a":2,"e":"AB-123-z has two uppercase letters, a hyphen, three digits, a hyphen and one lowercase letter. Every other choice violates at least one requirement."},{"q":"Dates are in DD/MM/YYYY format. Which date is NOT a valid calendar date?","o":["28/02/2027","29/02/2027","30/04/2027","31/12/2027"],"a":1,"e":"The year 2027 is not a leap year, so February has only 28 days; 29/02/2027 is invalid."},{"q":"A receipt lists €15.65, €7.90 and €9.45. What is the EXACT total?","o":["€32.50","€32.90","€33.00","€33.10"],"a":2,"e":"€15.65+€7.90=€23.55; adding €9.45 gives €33.00."},{"q":"Record numbers must be strictly ASCENDING:\n1: 0061\n2: 0067\n3: 0070\n4: 0069\n5: 0075\nWhich entry first violates this order?","o":["Entry 2","Entry 3","Entry 4","Entry 5"],"a":2,"e":"The order rises to 0070 and then drops to 0069. Entry 4 is the first ordering violation."},{"q":"Approved record: Site K4 | Batch RD-91 | Quantity 48. Which copied row has an incorrect SITE (not batch or quantity)?","o":["K4 | RD-91 | 48","K7 | RD-91 | 48","K4 | RD-19 | 48","K4 | RD-91 | 84"],"a":1,"e":"The second row changes the site from K4 to K7. The third changes the batch number and the fourth changes quantity, but neither changes the site."}]}];
const app=document.getElementById('app');
let phase='intro',si=0,qi=0,deadline=0,interval=null;
let answers=sections.map(s=>Array(s.questions.length).fill(null)),completion=['',''];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clockFormat=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
const left=()=>Math.max(0,Math.ceil((deadline-Date.now())/1000));
function stop(){if(interval!==null){clearInterval(interval);interval=null}}
function start(index){stop();si=index;qi=0;deadline=Date.now()+sections[index].seconds*1000;phase='exam';render();interval=setInterval(tick,250)}
function tick(){if(phase!=='exam')return;const t=left();if(!t){complete(true);return;}const el=document.getElementById('timer');if(el){el.textContent=clockFormat(t);el.classList.toggle('warn',t<=120);}}
function complete(expired){if(phase!=='exam')return;stop();completion[si]=expired?'Timer expired':'Submitted';phase=si===0?'intermission':'results';render()}
const answered=i=>answers[i].filter(x=>x!==null).length;
const score=i=>answers[i].reduce((sum,a,n)=>sum+(a===sections[i].questions[n].a?1:0),0);
function intro(){return `<span class="label">New challenge · Medium difficulty</span><h1>38 completely new questions · Fourth edition</h1><p>Practice logic, quantitative reasoning, scheduling and precision checking with the same section sizes and time limits as previous versions.</p><div class="statgrid"><div class="stat"><b>26 questions</b><span>Logic and Reasoning · 19 minutes</span></div><div class="stat"><b>12 questions</b><span>Attention to Detail · 13 minutes</span></div></div><div class="note">One question at a time. You can revisit previous questions within the current section. Time runs continuously once a section starts, even if you switch tabs. Unanswered questions count as incorrect. Answers and explanations remain hidden until both sections finish. Reloading resets the attempt. You can pause between sections.</div><div class="controls"><span class="muted">Free practice. No login or score collection.</span><button class="btn" data-action="start">Begin Logic and Reasoning →</button></div><p class="skiplink"><a href="../">Version 1</a> · <a href="../version-2/">Version 2</a> · <a href="../version-3/">Version 3</a> · <a href="../version-4/">Version 4</a></p>`}
function exam(){const section=sections[si],question=section.questions[qi],choice=answers[si][qi];const options=question.o.map((option,i)=>`<button class="answer ${choice===i?'active':''}" aria-pressed="${choice===i}" data-choice="${i}"><span class="key">${'ABCD'[i]}</span><span>${esc(option)}</span></button>`).join('');return `<div class="toprow"><div><div class="label">Section ${si+1} of 2 · ${esc(section.title)}</div><h2>Question ${qi+1} / ${section.questions.length}</h2><div class="muted">${answered(si)} answered · ${section.questions.length-answered(si)} unanswered</div></div><div id="timer" role="timer" aria-label="Section time remaining" class="time ${left()<=120?'warn':''}">${clockFormat(left())}</div></div><div class="track"><div class="fill" style="width:${((qi+1)/section.questions.length)*100}%"></div></div><div class="prompt">${esc(question.q)}</div><div class="answers">${options}</div><div class="controls"><button class="btn secondary" data-action="prev" ${qi===0?'disabled':''}>← Previous</button><button class="btn" data-action="next">${qi===section.questions.length-1?(si===0?'Finish section 1 →':'See results →'):'Next question →'}</button></div><div class="minor">${choice===null?'No answer selected. You can skip and return.':'Your choice is saved for this attempt.'} The answer key is shown only after completion.</div>`}
function intermission(){return `<div class="label">Section 1 finished</div><h1>Attention to Detail comes next</h1><p>Logic and Reasoning is complete. Your answers are locked and your results stay hidden until the end.</p><div class="statgrid"><div class="stat"><b>12 questions</b><span>Attention to Detail</span></div><div class="stat"><b>13 minutes</b><span>Your timer begins when you start this section.</span></div></div><div class="note">Section 1 status: ${completion[0]}. Unanswered questions: ${sections[0].questions.length-answered(0)}.</div><div class="controls"><span class="muted">You may take a break now.</span><button class="btn" data-action="next-section">Start Attention to Detail →</button></div>`}
function resultItem(q,j,k){const answer=answers[j][k],ok=answer===q.a,state=answer===null?'Skipped':ok?'Correct':'Incorrect',clazz=answer===null?'skip':ok?'ok':'bad';return `<details><summary><span>Q${k+1}. ${esc(q.q.replace(/\n/g,' ').slice(0,80))}${q.q.length>80?'…':''}</span><span class="outcome ${clazz}">${state}</span></summary><div class="body"><p><b>Question:</b> ${esc(q.q).replace(/\n/g,'<br>')}</p><p><b>Your answer:</b> ${answer===null?'Unanswered':esc('ABCD'[answer]+'. '+q.o[answer])}</p><p><b>Correct answer:</b> ${esc('ABCD'[q.a]+'. '+q.o[q.a])}</p><p><b>Explanation:</b> ${esc(q.e)}</p></div></details>`}
function results(){const total=score(0)+score(1);return `<div class="label">Version 7 · Assessment finished</div><h1>Your results and explanations</h1><p class="muted">Each question is scored as correct, incorrect or skipped. Expand any item for a worked solution.</p><div class="gridresult"><div class="scorebox"><strong>${total}/38</strong><span>Overall (${Math.round(100*total/38)}%)</span></div><div class="scorebox"><strong>${score(0)}/26</strong><span>Logic and Reasoning</span></div><div class="scorebox"><strong>${score(1)}/12</strong><span>Attention to Detail</span></div></div><p class="muted">Section 1: ${completion[0]} · Section 2: ${completion[1]}</p><div class="controls"><button class="btn secondary" data-action="expand">Expand all explanations</button><button class="btn secondary" data-action="collapse">Collapse all</button><button class="btn" data-action="reset">Restart version 7 ↻</button></div>${sections.map((s,j)=>`<section class="review"><h2>${j+1}. ${esc(s.title)} — ${score(j)}/${s.questions.length}</h2>${s.questions.map((q,k)=>resultItem(q,j,k)).join('')}</section>`).join('')}<p class="skiplink"><a href="../">Version 1</a> · <a href="../version-2/">Version 2</a> · <a href="../version-3/">Version 3</a> · <a href="../version-4/">Version 4</a> · <a href="../version-5/">Version 5</a> · <a href="../version-6/">Version 6</a></p>`}
function render(){app.innerHTML=phase==='intro'?intro():phase==='exam'?exam():phase==='intermission'?intermission():results()}
app.addEventListener('click',ev=>{const button=ev.target.closest('button');if(!button||!app.contains(button)||button.disabled)return;if(button.hasAttribute('data-choice')){if(phase!=='exam')return;if(left()<=0){complete(true);return;}answers[si][qi]=Number(button.dataset.choice);render();return;}switch(button.dataset.action){case 'start':if(phase==='intro')start(0);break;case 'prev':if(phase==='exam'&&qi>0){qi--;render()}break;case 'next':if(phase==='exam'){if(left()<=0){complete(true);break}if(qi===sections[si].questions.length-1)complete(false);else{qi++;render()}}break;case 'next-section':if(phase==='intermission')start(1);break;case 'expand':app.querySelectorAll('details').forEach(d=>d.open=true);break;case 'collapse':app.querySelectorAll('details').forEach(d=>d.open=false);break;case 'reset':stop();phase='intro';si=0;qi=0;completion=['',''];answers=sections.map(s=>Array(s.questions.length).fill(null));render();break}});
render();
})();
</script></body></html>
