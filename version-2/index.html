<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EXS Practice Assessment — Version 2 (38 new questions)</title><style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f0f4f6;color:#152c35}
*{box-sizing:border-box}body{margin:0;padding:24px 16px}
main{max-width:860px;margin:auto;background:white;border:1px solid #d8e2e6;border-radius:18px;box-shadow:0 12px 36px #172c3d12;overflow:hidden}
header{background:linear-gradient(110deg,#173d4c,#18535d);color:white;padding:24px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header strong{font-size:20px;letter-spacing:-.03em}header small{display:block;color:#cbe8e7;margin-top:5px;font-size:12px}header .pill{background:#ffffff20;color:white;border:1px solid #ffffff40;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:750}
article{padding:28px 30px 34px;min-height:420px}h1{font-size:26px;line-height:1.22;margin:0 0 12px;letter-spacing:-.025em}h2{font-size:20px;margin:18px 0 12px}p{line-height:1.55;color:#334854}a{color:#087d8c}button{font:inherit;cursor:pointer}
.muted{color:#60747b;font-size:14px}.label{text-transform:uppercase;letter-spacing:.10em;font-size:11px;color:#127483;font-weight:800}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.stat{border:1px solid #d4e3e7;background:#f7fcfc;border-radius:12px;padding:18px}.stat b{display:block;font-size:23px;color:#116b75;margin-bottom:6px}.stat span{font-size:13px;color:#4e6570}
.note{padding:13px 15px;border-radius:10px;background:#f0f6f7;color:#40565c;font-size:14px;line-height:1.55}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:25px}
.btn{border:1px solid #116e7b;background:#127481;color:white;padding:12px 19px;font-weight:750;border-radius:10px}.btn:hover{background:#0d5964}.btn.secondary{background:#fff;color:#24545d;border-color:#bed2d7}.btn.secondary:hover{background:#ecf7f8}.btn:disabled{opacity:.42;cursor:default}button:focus-visible,summary:focus-visible{outline:3px solid #e6aa30;outline-offset:3px}
.toprow{display:flex;gap:10px;justify-content:space-between;align-items:start}.time{padding:10px 12px;border:1px solid #b4cbd0;background:#edf8f9;color:#175c65;font-variant-numeric:tabular-nums;font-size:18px;font-weight:850;border-radius:9px;white-space:nowrap}.time.warn{background:#fff1eb;border-color:#f4c3af;color:#a3391c}
.track{height:8px;border-radius:20px;background:#e4ecee;overflow:hidden;margin:20px 0 24px}.fill{height:100%;background:#1390a0;transition:width .14s ease}
.prompt{font-size:21px;white-space:pre-line;line-height:1.45;margin:15px 0 22px;font-weight:760;letter-spacing:-.01em}.answers{display:grid;gap:10px}.answer{width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:15px;border:1px solid #cfdde1;background:#fff;color:#153039;border-radius:11px;line-height:1.45}.answer:hover{background:#f4fcfd;border-color:#73aeb8}.answer.active{border:2px solid #0c8292;background:#e8f8fa;padding:14px}.key{flex:0 0 28px;border:1px solid #c4d4d9;background:#f4f8f9;color:#375860;border-radius:7px;height:28px;display:grid;place-items:center;font-size:13px;font-weight:800}.answer.active .key{background:#137b89;color:#fff;border-color:#137b89}.minor{font-size:13px;color:#698087;margin-top:16px}
.gridresult{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:22px 0}.scorebox{text-align:center;border:1px solid #dae5e8;border-radius:12px;padding:15px}.scorebox strong{font-size:25px;display:block;color:#116977}.scorebox span{font-size:12px;color:#4a626d}.review{margin-top:27px}.review h2{border-bottom:1px solid #d9e5e9;padding-bottom:9px}.review details{border:1px solid #dce6e9;border-radius:10px;margin:9px 0;overflow:hidden}.review summary{padding:13px 15px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:14px;font-weight:650}.body{padding:0 16px 14px;font-size:14px}.body p{margin:8px 0}.ok{color:#087a54}.bad{color:#b33230}.skip{color:#647882}.outcome{font-weight:850;white-space:nowrap}.skiplink{font-size:13px;margin-top:10px}
@media(max-width:550px){body{padding:0;background:white}main{border:0;border-radius:0;box-shadow:none}header{padding:20px}article{padding:21px}.statgrid,.gridresult{grid-template-columns:1fr}.prompt{font-size:19px}.controls>.btn{flex:1}}
</style></head>
<body><main><header><div><strong>EXS Practice Assessment · Version 2</strong><small>Independent practice · Not an official TestGorilla assessment</small></div><div class="pill">38 new questions · 32 minutes</div></header>
<article id="app" aria-live="polite">Loading assessment…</article></main>
<script>
(()=>{'use strict';
const sections=[{title:'Logic and Reasoning',seconds:1140,questions:[{"q":"Which number replaces the question mark?\n5, 9, 17, 33, 65, ?","o":["113","125","129","131"],"a":2,"e":"Each term doubles, then subtracts 1: 5×2−1=9, 9×2−1=17, and so on. Therefore 65×2−1=129. The differences also double: 4, 8, 16, 32, 64."},{"q":"Equipment accounts for 40% of a project budget. If the equipment costs €48,000, what is the total budget?","o":["€108,000","€120,000","€128,000","€192,000"],"a":1,"e":"€48,000 is 0.40 of the total, so total = 48,000 ÷ 0.40 = €120,000."},{"q":"A vehicle travels 180 km in 2 hours 15 minutes at a constant speed. What is its average speed?","o":["72 km/h","75 km/h","80 km/h","90 km/h"],"a":2,"e":"2 hours 15 minutes equals 2.25 hours. Speed = distance ÷ time = 180 ÷ 2.25 = 80 km/h."},{"q":"All approved samples are labeled. No labeled samples are stored in Room X. What must be true?","o":["No approved sample is in Room X.","Every labeled sample is approved.","Some samples in Room X are approved.","All samples outside Room X are approved."],"a":0,"e":"Approved implies labeled, and labeled implies not stored in Room X. Chaining the rules means approved samples cannot be in Room X."},{"q":"Machine A runs a diagnostic every 12 minutes and Machine B every 18 minutes. Both run a diagnostic at 09:00. When will they next run together?","o":["09:24","09:30","09:42","09:36"],"a":3,"e":"Find the least common multiple of 12 and 18, which is 36. Both next coincide 36 minutes after 09:00, at 09:36."},{"q":"An item is reduced by 20%, then by another 10% of the reduced price. What is the total percentage reduction from the original price?","o":["28%","30%","26%","32%"],"a":0,"e":"Take an original price of 100: after the first discount it is 80, and after the second it is 80×0.90=72. The reduction is 28%, not 30%."},{"q":"Five notebooks and three pens cost €31. Each notebook costs €5. How much does one pen cost?","o":["€1","€2","€3","€4"],"a":1,"e":"The notebooks cost 5×€5=€25, leaving €6 for three pens. Each pen costs €6÷3=€2."},{"q":"Rule: If a report is submitted, the supervisor receives an email. The supervisor received an email. Which conclusion is justified?","o":["The report was definitely submitted.","The report was definitely rejected.","We cannot determine whether the report was submitted.","No other emails could have been sent."],"a":2,"e":"Receiving an email does not prove the report was submitted: an email could have another cause. This is the invalid inference known as affirming the consequent."},{"q":"Four colleagues sit in one row. Luis sits at the far left. Zara sits immediately to the left of Omar, and Priya sits to the right of Omar. Which seating order is possible?","o":["Luis – Zara – Omar – Priya","Luis – Omar – Zara – Priya","Luis – Zara – Priya – Omar","Zara – Omar – Luis – Priya"],"a":0,"e":"Luis must be first. Zara and Omar must be adjacent in that order, with Priya to Omar’s right. Only Luis–Zara–Omar–Priya meets every condition."},{"q":"Of 200 deliveries, 45% go to the East depot and 35% to the West depot. The remainder go to Central. How many deliveries go to Central?","o":["20","30","50","40"],"a":3,"e":"East and West account for 45%+35%=80%. Central receives 20% of 200, which is 40 deliveries."},{"q":"A fair six-sided die is rolled twice. What is the probability that both results are even?","o":["1/9","1/4","1/3","1/2"],"a":1,"e":"Each roll has three even values out of six, so P(even)=1/2. Independent rolls give (1/2)×(1/2)=1/4."},{"q":"A code moves each letter one position forward (Z wraps to A). Under this rule, MISSION becomes NJTTJPO. How is PLAN encoded?","o":["QMBP","PKZM","RNCQ","QMBO"],"a":3,"e":"Shift each letter once: P→Q, L→M, A→B, N→O, giving QMBO."},{"q":"Three teams report productivity. Red completes 32 jobs in 4 hours; Blue completes 54 jobs in 6 hours; Green completes 48 jobs in 8 hours. Which has the highest hourly rate?","o":["Red","Green","Blue","All three are equal"],"a":2,"e":"Red: 32÷4=8 jobs/hour; Blue: 54÷6=9; Green: 48÷8=6. Blue has the highest rate."},{"q":"A four-step process repeats every five minutes: INSPECT, CLEAN, SEAL, LOG. INSPECT occurs at 10:00. Which step occurs at 10:35?","o":["Inspect","Log","Clean","Seal"],"a":1,"e":"10:35 is seven five-minute intervals after 10:00. Advancing seven steps around a four-step cycle is equivalent to advancing three: INSPECT→CLEAN→SEAL→LOG."},{"q":"Department A has twice as many employees as Department B. Together they have 72 employees. How many work in Department B?","o":["24","36","48","18"],"a":0,"e":"Let B=x and A=2x. Then 3x=72, so B has x=24 employees."},{"q":"At dawn, a temperature is −3°C. It rises 8°C, then falls 11°C. What is the final temperature?","o":["+6°C","0°C","−2°C","−6°C"],"a":3,"e":"Start at −3. After rising 8 it is +5. Falling 11 takes it to −6°C."},{"q":"A train has 16 rows of 4 seats. In the first 6 rows, 3 seats per row are occupied. In the remaining 10 rows, 2 seats per row are occupied. How many seats are empty?","o":["22","24","26","28"],"a":2,"e":"There are 16×4=64 seats. Occupied seats total (6×3)+(10×2)=38. Empty seats =64−38=26."},{"q":"Six measurements have an average of 14. Two more measurements, 20 and 24, are added. What is the new average?","o":["16","15","17","18"],"a":0,"e":"The first six sum to 6×14=84. Add 20+24 to get 128 across eight measurements. Average = 128÷8=16."},{"q":"Every device operates in exactly one of two modes: R or S. Device X is not in R. What follows?","o":["X is in both modes.","X is not operating.","X may be in either mode.","X is in S."],"a":3,"e":"Exactly one of R or S must apply. If R does not apply, S must apply; the two modes are exhaustive and mutually exclusive."},{"q":"A contractor writes five reports. Each takes 35 minutes, and there is a 10-minute break after report 2 and after report 4. How much elapsed time is needed?","o":["2 h 55 min","3 h 05 min","3 h 15 min","3 h 25 min"],"a":2,"e":"Writing takes 5×35=175 minutes; the two breaks add 20 minutes. Total 195 minutes = 3 hours 15 minutes."},{"q":"If tomorrow will be Thursday, what day was three days ago?","o":["Monday","Sunday","Saturday","Tuesday"],"a":1,"e":"If tomorrow is Thursday, today is Wednesday. Counting back three days: Tuesday (1), Monday (2), Sunday (3)."},{"q":"On a coordinate grid, a robot starts at (2, 3), moves 3 units east, then 2 south, then 1 west. Where does it finish?","o":["(4, 1)","(6, 1)","(4, 5)","(0, 1)"],"a":0,"e":"East increases x: (2,3)→(5,3). South decreases y: (5,1). West decreases x: (4,1)."},{"q":"Pipe A fills a tank in 6 hours; Pipe B fills it in 3 hours. If both operate together at constant rates, how long will they take?","o":["1 hour","3 hours","4 hours","2 hours"],"a":3,"e":"In one hour A fills 1/6 of the tank and B fills 1/3. Together their rate is 1/6+1/3=1/2 tank per hour, so they take 2 hours."},{"q":"Alpha has more documents than Beta. Gamma has fewer than Beta. Delta has more than Alpha. Which folder has the most documents?","o":["Alpha","Beta","Delta","Gamma"],"a":2,"e":"The relationships give Delta>Alpha>Beta>Gamma, so Delta has the largest count."},{"q":"Which letter comes next in the sequence?\nC, F, J, O, U, ?","o":["A","B","D","Z"],"a":1,"e":"Letter positions are 3, 6, 10, 15 and 21, increasing by +3, +4, +5, +6. Add 7 to reach 28; wrapping after Z (26) gives position 2, B."},{"q":"Three identical X-crates weigh the same as two identical Y-crates. Each Y-crate weighs 9 kg. How much do five X-crates weigh?","o":["30 kg","27 kg","36 kg","45 kg"],"a":0,"e":"Two Y-crates weigh 2×9=18 kg, equal to three X-crates. Each X weighs 18÷3=6 kg, so five X-crates weigh 30 kg."}]},{title:'Attention to Detail',seconds:780,questions:[{"q":"Approved serial: KD9-0Q6-I2. Which entry matches it exactly?","o":["KD9-OQ6-I2","KD9-0Q6-I2","KD9-0Q6-12","KD9-0O6-I2"],"a":1,"e":"Only the second string matches all characters. Pay special attention to zero versus O and the letter I versus the digit 1."},{"q":"The reference address is: helpdesk@north-ops.eu. Which copied address contains an error?","o":["helpdesk@north-ops.eu","helpdesk@north-ops.com","helpdesk@north_ops.eu","helpdsek@north-ops.eu"],"a":2,"e":"The third entry uses an underscore instead of the hyphen in north-ops. The others reproduce the exact address."},{"q":"Which identifier appears exactly twice?\nCQ-7316 · CQ-7136 · CQ-7361 · CQ-7136","o":["CQ-7136","CQ-7316","CQ-7361","All four are unique"],"a":0,"e":"CQ-7136 is the second and fourth identifier; the others occur only once."},{"q":"A shipment includes 7 units at €18, 4 units at €9, and a €6 delivery fee. What is the correct grand total?","o":["€162","€164","€174","€168"],"a":3,"e":"7×18=126 and 4×9=36. Adding shipping gives 126+36+6=€168."},{"q":"A log states: Started 14:05; finished 14:32; elapsed time 22 minutes. Which field is inconsistent?","o":["Start time","Elapsed time","Finish time","All fields are consistent"],"a":1,"e":"From 14:05 to 14:32 is 27 minutes, not 22 minutes. The reported elapsed time needs correction."},{"q":"How many times does the exact code VC-208 appear?\nVC-208  ·  VC-280  ·  VC-208  ·  CV-208  ·  VC-208","o":["2","4","3","5"],"a":2,"e":"VC-208 appears in the first, third and fifth positions. VC-280 and CV-208 differ in digit or letter order."},{"q":"These dated entries are meant to appear in ascending chronological order. Which adjacent pair is out of order?\n12 Nov 2026 · 20 Dec 2026 · 04 Dec 2026 · 16 Jan 2027","o":["20 Dec and 04 Dec","12 Nov and 20 Dec","04 Dec and 16 Jan","No pair"],"a":0,"e":"4 December 2026 occurs before 20 December 2026, but those two entries are reversed. The other neighboring comparisons are chronological."},{"q":"Master code: PP-08S5-LM2. Which copy is exact?","o":["PP-O8S5-LM2","PP-08S5-LMZ","PP-085S-LM2","PP-08S5-LM2"],"a":3,"e":"The fourth entry matches the master. Others replace 0 with O, 2 with Z, or swap S and 5."},{"q":"Approved packing list: Part QX-41 = 18 units; Part QX-14 = 28 units; Part QX-44 = 12 units. Which recorded row contradicts it?","o":["QX-41 | 18 units","QX-14 | 18 units","QX-14 | 28 units","QX-44 | 12 units"],"a":1,"e":"The approved quantity for QX-14 is 28 units, not 18. The second row is inconsistent; the other rows match the approved quantities."},{"q":"Which invoice row has an incorrect total?","o":["A: 3 × €24 = €72","B: 8 × €7 = €56","C: 6 × €13 = €76","D: 5 × €15 = €75"],"a":2,"e":"6×€13=€78, so row C is wrong. A, B and D calculate correctly."},{"q":"Reference: MX-24-78-305\nCopied:       MX-24-87-305\nWhich difference occurred?","o":["The middle two digits were reversed.","The prefix changed.","The final block lost a digit.","The strings are identical."],"a":0,"e":"The original block is 78 and the copied block is 87. Its digits are transposed, while the prefix and final block match."},{"q":"A manifest should contain each sequential package ID from PK-704 through PK-709. The scanned entries are: PK-704, PK-705, PK-707, PK-708, PK-709. Which ID is missing?","o":["PK-703","PK-710","PK-707","PK-706"],"a":3,"e":"The sequence is 704, 705, 706, 707, 708, 709. The scanned entries skip PK-706."}]}];
const app=document.getElementById('app');
let phase='intro',si=0,qi=0,deadline=0,interval=null;
let answers=sections.map(s=>Array(s.questions.length).fill(null)),completion=['',''];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clockFormat=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
const left=()=>Math.max(0,Math.ceil((deadline-Date.now())/1000));
function stop(){if(interval!==null){clearInterval(interval);interval=null}}
function start(index){stop();si=index;qi=0;deadline=Date.now()+sections[index].seconds*1000;phase='exam';render();interval=setInterval(tick,250)}
function tick(){if(phase!=='exam')return;const t=left();if(!t){complete(true);return;}const el=document.getElementById('timer');if(el){el.textContent=clockFormat(t);el.classList.toggle('warn',t<=120);}}
function complete(expired){if(phase!=='exam')return;stop();completion[si]=expired?'Timer expired':'Submitted';phase=si===0?'intermission':'results';render()}
const answered=i=>answers[i].filter(x=>x!==null).length;
const score=i=>answers[i].reduce((sum,a,n)=>sum+(a===sections[i].questions[n].a?1:0),0);
function intro(){return `<span class="label">New challenge · Medium difficulty</span><h1>38 completely new questions</h1><p>Practice logic, quantitative reasoning, scheduling and precision checking with the same section sizes and time limits as Version 1.</p><div class="statgrid"><div class="stat"><b>26 questions</b><span>Logic and Reasoning · 19 minutes</span></div><div class="stat"><b>12 questions</b><span>Attention to Detail · 13 minutes</span></div></div><div class="note">One question at a time. You can revisit previous questions within the current section. Time runs continuously once a section starts, even if you switch tabs. Unanswered questions count as incorrect. Answers and explanations remain hidden until both sections finish. Reloading resets the attempt. You can pause between sections.</div><div class="controls"><span class="muted">Free practice. No login or score collection.</span><button class="btn" data-action="start">Begin Logic and Reasoning →</button></div><p class="skiplink"><a href="../">Go to Version 1</a></p>`}
function exam(){const section=sections[si],question=section.questions[qi],choice=answers[si][qi];const options=question.o.map((option,i)=>`<button class="answer ${choice===i?'active':''}" aria-pressed="${choice===i}" data-choice="${i}"><span class="key">${'ABCD'[i]}</span><span>${esc(option)}</span></button>`).join('');return `<div class="toprow"><div><div class="label">Section ${si+1} of 2 · ${esc(section.title)}</div><h2>Question ${qi+1} / ${section.questions.length}</h2><div class="muted">${answered(si)} answered · ${section.questions.length-answered(si)} unanswered</div></div><div id="timer" role="timer" aria-label="Section time remaining" class="time ${left()<=120?'warn':''}">${clockFormat(left())}</div></div><div class="track"><div class="fill" style="width:${((qi+1)/section.questions.length)*100}%"></div></div><div class="prompt">${esc(question.q)}</div><div class="answers">${options}</div><div class="controls"><button class="btn secondary" data-action="prev" ${qi===0?'disabled':''}>← Previous</button><button class="btn" data-action="next">${qi===section.questions.length-1?(si===0?'Finish section 1 →':'See results →'):'Next question →'}</button></div><div class="minor">${choice===null?'No answer selected. You can skip and return.':'Your choice is saved for this attempt.'} The answer key is shown only after completion.</div>`}
function intermission(){return `<div class="label">Section 1 finished</div><h1>Attention to Detail comes next</h1><p>Logic and Reasoning is complete. Your answers are locked and your results stay hidden until the end.</p><div class="statgrid"><div class="stat"><b>12 questions</b><span>Attention to Detail</span></div><div class="stat"><b>13 minutes</b><span>Your timer begins when you start this section.</span></div></div><div class="note">Section 1 status: ${completion[0]}. Unanswered questions: ${sections[0].questions.length-answered(0)}.</div><div class="controls"><span class="muted">You may take a break now.</span><button class="btn" data-action="next-section">Start Attention to Detail →</button></div>`}
function resultItem(q,j,k){const answer=answers[j][k],ok=answer===q.a,state=answer===null?'Skipped':ok?'Correct':'Incorrect',clazz=answer===null?'skip':ok?'ok':'bad';return `<details><summary><span>Q${k+1}. ${esc(q.q.replace(/\n/g,' ').slice(0,80))}${q.q.length>80?'…':''}</span><span class="outcome ${clazz}">${state}</span></summary><div class="body"><p><b>Question:</b> ${esc(q.q).replace(/\n/g,'<br>')}</p><p><b>Your answer:</b> ${answer===null?'Unanswered':esc('ABCD'[answer]+'. '+q.o[answer])}</p><p><b>Correct answer:</b> ${esc('ABCD'[q.a]+'. '+q.o[q.a])}</p><p><b>Explanation:</b> ${esc(q.e)}</p></div></details>`}
function results(){const total=score(0)+score(1);return `<div class="label">Version 2 · Assessment finished</div><h1>Your results and explanations</h1><p class="muted">Each question is scored as correct, incorrect or skipped. Expand any item for a worked solution.</p><div class="gridresult"><div class="scorebox"><strong>${total}/38</strong><span>Overall (${Math.round(100*total/38)}%)</span></div><div class="scorebox"><strong>${score(0)}/26</strong><span>Logic and Reasoning</span></div><div class="scorebox"><strong>${score(1)}/12</strong><span>Attention to Detail</span></div></div><p class="muted">Section 1: ${completion[0]} · Section 2: ${completion[1]}</p><div class="controls"><button class="btn secondary" data-action="expand">Expand all explanations</button><button class="btn secondary" data-action="collapse">Collapse all</button><button class="btn" data-action="reset">Restart version 2 ↻</button></div>${sections.map((s,j)=>`<section class="review"><h2>${j+1}. ${esc(s.title)} — ${score(j)}/${s.questions.length}</h2>${s.questions.map((q,k)=>resultItem(q,j,k)).join('')}</section>`).join('')}<p class="skiplink"><a href="../">Try the original Version 1 test</a></p>`}
function render(){app.innerHTML=phase==='intro'?intro():phase==='exam'?exam():phase==='intermission'?intermission():results()}
app.addEventListener('click',ev=>{const button=ev.target.closest('button');if(!button||!app.contains(button)||button.disabled)return;if(button.hasAttribute('data-choice')){if(phase!=='exam')return;if(left()<=0){complete(true);return;}answers[si][qi]=Number(button.dataset.choice);render();return;}switch(button.dataset.action){case 'start':if(phase==='intro')start(0);break;case 'prev':if(phase==='exam'&&qi>0){qi--;render()}break;case 'next':if(phase==='exam'){if(left()<=0){complete(true);break}if(qi===sections[si].questions.length-1)complete(false);else{qi++;render()}}break;case 'next-section':if(phase==='intermission')start(1);break;case 'expand':app.querySelectorAll('details').forEach(d=>d.open=true);break;case 'collapse':app.querySelectorAll('details').forEach(d=>d.open=false);break;case 'reset':stop();phase='intro';si=0;qi=0;completion=['',''];answers=sections.map(s=>Array(s.questions.length).fill(null));render();break}});
render();
})();
</script></body></html>
