<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EXS Practice Assessment — Version 10 (38 new questions)</title><style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f6faf9;color:#253743}
*{box-sizing:border-box}body{margin:0;padding:24px 16px}
main{max-width:860px;margin:auto;background:white;border:1px solid #d9e6e8;border-radius:18px;box-shadow:0 12px 36px #172c3d12;overflow:hidden}
header{background:linear-gradient(110deg,#26394d,#537c8c);color:white;padding:24px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header strong{font-size:20px;letter-spacing:-.03em}header small{display:block;color:#e1f4f6;margin-top:5px;font-size:12px}header .pill{background:#ffffff20;color:white;border:1px solid #ffffff40;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:750}
article{padding:28px 30px 34px;min-height:420px}h1{font-size:26px;line-height:1.22;margin:0 0 12px;letter-spacing:-.025em}h2{font-size:20px;margin:18px 0 12px}p{line-height:1.55;color:#334854}a{color:#3c7586}button{font:inherit;cursor:pointer}
.muted{color:#60747b;font-size:14px}.label{text-transform:uppercase;letter-spacing:.10em;font-size:11px;color:#3c7586;font-weight:800}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.stat{border:1px solid #d4e3e7;background:#f7fcfc;border-radius:12px;padding:18px}.stat b{display:block;font-size:23px;color:#3c7586;margin-bottom:6px}.stat span{font-size:13px;color:#4e6570}
.note{padding:13px 15px;border-radius:10px;background:#f0f6f7;color:#40565c;font-size:14px;line-height:1.55}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:25px}
.btn{border:1px solid #3c7586;background:#47899d;color:white;padding:12px 19px;font-weight:750;border-radius:10px}.btn:hover{background:#295f73}.btn.secondary{background:#fff;color:#316b7d;border-color:#bed2d7}.btn.secondary:hover{background:#ecf7f8}.btn:disabled{opacity:.42;cursor:default}button:focus-visible,summary:focus-visible{outline:3px solid #e6aa30;outline-offset:3px}
.toprow{display:flex;gap:10px;justify-content:space-between;align-items:start}.time{padding:10px 12px;border:1px solid #b4cbd0;background:#edf8f9;color:#175c65;font-variant-numeric:tabular-nums;font-size:18px;font-weight:850;border-radius:9px;white-space:nowrap}.time.warn{background:#fff1eb;border-color:#f4c3af;color:#a3391c}
.track{height:8px;border-radius:20px;background:#e4ecee;overflow:hidden;margin:20px 0 24px}.fill{height:100%;background:#bb6033;transition:width .14s ease}
.prompt{font-size:21px;white-space:pre-line;line-height:1.45;margin:15px 0 22px;font-weight:760;letter-spacing:-.01em}.answers{display:grid;gap:10px}.answer{width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:15px;border:1px solid #cfdde1;background:#fff;color:#153039;border-radius:11px;line-height:1.45}.answer:hover{background:#f4fcfd;border-color:#73aeb8}.answer.active{border:2px solid #a4542c;background:#e8f8fa;padding:14px}.key{flex:0 0 28px;border:1px solid #c4d4d9;background:#f4f8f9;color:#375860;border-radius:7px;height:28px;display:grid;place-items:center;font-size:13px;font-weight:800}.answer.active .key{background:#a4542c;color:#fff;border-color:#a4542c}.minor{font-size:13px;color:#698087;margin-top:16px}
.gridresult{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:22px 0}.scorebox{text-align:center;border:1px solid #dae5e8;border-radius:12px;padding:15px}.scorebox strong{font-size:25px;display:block;color:#3c7586}.scorebox span{font-size:12px;color:#4a626d}.review{margin-top:27px}.review h2{border-bottom:1px solid #d9e5e9;padding-bottom:9px}.review details{border:1px solid #dce6e9;border-radius:10px;margin:9px 0;overflow:hidden}.review summary{padding:13px 15px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:14px;font-weight:650}.body{padding:0 16px 14px;font-size:14px}.body p{margin:8px 0}.ok{color:#087a54}.bad{color:#b33230}.skip{color:#647882}.outcome{font-weight:850;white-space:nowrap}.skiplink{font-size:13px;margin-top:10px}
@media(max-width:550px){body{padding:0;background:white}main{border:0;border-radius:0;box-shadow:none}header{padding:20px}article{padding:21px}.statgrid,.gridresult{grid-template-columns:1fr}.prompt{font-size:19px}.controls>.btn{flex:1}}
</style></head>
<body><main><header><div><strong>EXS Practice Assessment · Version 10</strong><small>Independent practice · Not an official TestGorilla assessment</small></div><div class="pill">38 new questions · 32 minutes</div></header>
<article id="app" aria-live="polite">Loading assessment…</article></main>
<script>
(()=>{'use strict';
const sections=[{"title":"Logic and Reasoning","seconds":1140,"questions":[{"q":"What number comes next?\n5, 8, 14, 23, 35, ?","o":["47","48","50","53"],"a":2,"e":"The gaps are +3, +6, +9 and +12. The next gap is +15, giving 35+15=50."},{"q":"Two patterns are interleaved. Find the next term:\n7, 54, 14, 49, 28, 44, 56, ?","o":["38","39","40","42"],"a":1,"e":"The odd-position terms double (7,14,28,56), while the even-position terms fall by 5 (54,49,44,39)."},{"q":"Which letter comes next?\nZ, Y, W, T, P, ?","o":["J","L","M","K"],"a":3,"e":"The alphabet positions fall by 1, 2, 3 and 4. From P (16), subtract 5 to reach K (11)."},{"q":"Each row uses the same rule:\n2 | 3 → 8\n4 | 5 → 24\n5 | 4 → ?","o":["20","24","25","30"],"a":2,"e":"Multiply the first number by one more than the second: 2×(3+1)=8, 4×(5+1)=24, and 5×(4+1)=25."},{"q":"All external contractors wear orange badges. No orange-badge holder may operate the test bench. Which statement must be true?","o":["Every orange-badge holder is a contractor.","No external contractor may operate the test bench.","Some contractors operate the test bench.","Every test-bench operator has an orange badge."],"a":1,"e":"Every contractor belongs to the orange-badge group, and all orange-badge holders are barred from the bench. So no external contractor may operate it."},{"q":"Everyone who accesses the restricted archive has passed an identity check. Keenan accessed the restricted archive. What follows?","o":["Keenan passed an identity check.","Keenan failed the identity check.","Everyone who passes the check accesses the archive.","Keenan accessed the archive twice."],"a":0,"e":"Archive access requires a completed identity check. Keenan accessed the archive, therefore the check must have been passed."},{"q":"Exactly ONE of two systems, P and Q, is running. P is running. What must be true?","o":["Q is also running.","Neither system runs.","Q is not running.","P will stop next."],"a":2,"e":"Exactly one running system rules out both being on. Since P is running, Q is not running."},{"q":"A task plan has five activities A, B, C, D and E. A comes immediately before D; D before C; B after C; E is last. Which order is valid?","o":["A – C – D – B – E","D – A – C – B – E","A – D – B – C – E","A – D – C – B – E"],"a":3,"e":"A must immediately precede D, and D must come before C, then B, with E last. A–D–C–B–E meets all rules."},{"q":"Resources are shared among three sites in the ratio 2:3:7. If 384 units are distributed, how many go to the THIRD site?","o":["160","192","224","256"],"a":2,"e":"The ratio contains 12 parts. Each part is 384÷12=32. The third site receives 7×32=224."},{"q":"The sizes of two teams are in the ratio 4:9. The larger team has 65 more members. How many members do both teams have together?","o":["156","169","182","195"],"a":1,"e":"The difference is 5 parts, which equal 65 people. One part is 13, and 13 total parts give 13×13=169 members."},{"q":"A €360 item is discounted by 15%. An 8% tax is then added to the reduced price. What is the final price?","o":["€324.00","€328.80","€330.48","€334.80"],"a":2,"e":"After discount, €360×0.85=€306. Tax adds €306×0.08=€24.48, making €330.48."},{"q":"A department has reviewed 84% of its 250 files. How many files remain unreviewed?","o":["36","40","42","46"],"a":1,"e":"Unreviewed means 100%−84%=16%. Multiply 250×0.16=40 files."},{"q":"€42,000 represents 15% of a project's full budget. How much is 35% of that same budget?","o":["€91,000","€94,500","€98,000","€105,000"],"a":2,"e":"The full budget is €42,000÷0.15=€280,000. Thirty-five percent is €280,000×0.35=€98,000."},{"q":"Four identical machines produce 96 units in eight minutes. At the same rate, how many units do seven machines produce in five minutes?","o":["90","96","105","112"],"a":2,"e":"One machine makes 96÷(4×8)=3 units per minute. Seven machines for five minutes produce 7×5×3=105 units."},{"q":"A vehicle covers 90 km at 45 km/h and another 60 km at 60 km/h, without stops. What is the average speed for the whole trip?","o":["45 km/h","50 km/h","52.5 km/h","55 km/h"],"a":1,"e":"The segments take 90÷45=2 hours and 60÷60=1 hour. Total distance is 150 km over 3 hours, so average speed is 50 km/h."},{"q":"Two vans travel in the same direction. The front van is initially 18 km ahead at 29 km/h; the rear van travels at 38 km/h. How long before the rear van catches up?","o":["1.5 hours","2 hours","2.5 hours","3 hours"],"a":1,"e":"The relative closing speed is 38−29=9 km/h. The 18 km gap closes in 18÷9=2 hours."},{"q":"An overnight job begins at 23:20 and lasts 1 hour 55 minutes. At what time does it end?","o":["00:55 next day","01:05 next day","01:15 next day","01:25 next day"],"a":2,"e":"23:20+1 hour=00:20 next day. Adding 55 minutes gives 01:15."},{"q":"Three fifths of a batch has already shipped. One quarter of the REMAINING batch is reserved. What percentage of the ORIGINAL batch is reserved?","o":["10%","15%","20%","25%"],"a":0,"e":"Remaining stock is 2/5 or 40% of the original. A quarter of 40% is 10%."},{"q":"A box contains five purple, four grey and three gold tokens. Two tokens are drawn WITHOUT replacement. What is the chance both are purple?","o":["5/36","5/33","1/6","25/144"],"a":1,"e":"The first purple chance is 5/12; the second is 4/11. Multiply 5/12×4/11=20/132=5/33."},{"q":"A fair six-sided die is rolled once. What is the chance of getting an ODD number OR a number GREATER THAN 4?","o":["1/2","3/5","2/3","5/6"],"a":2,"e":"Odd outcomes are {1,3,5}; greater-than-4 outcomes are {5,6}. The union is {1,3,5,6}: 4 of 6 results, or 2/3."},{"q":"A three-character code starts with one of A, B, C, D; the second character is a digit from 1 to 4; the final character is a letter from A, B, C, D DIFFERENT from the first. How many codes are possible?","o":["24","36","48","64"],"a":2,"e":"Four first letters × four possible digits × three remaining last letters = 4×4×3=48 codes."},{"q":"Seven readings are sorted: 8, 10, 12, 15, 17, 19, 24. The lowest reading is removed. What is the median of the remaining values?","o":["15","15.5","16","17"],"a":2,"e":"After removing 8, six values remain: 10,12,15,17,19,24. Their middle two are 15 and 17; median=(15+17)/2=16."},{"q":"A rectangular box measures 5 cm long, 4 cm wide and 3 cm high. What is its volume?","o":["12 cm³","48 cm³","60 cm³","120 cm³"],"a":2,"e":"Volume of a rectangular prism = length×width×height = 5×4×3 = 60 cubic centimetres."},{"q":"A robot starts at coordinates (5, −1), moves 7 units west, 4 north, and 2 east. Where does it finish?","o":["(0, 3)","(−2, 3)","(0, −5)","(4, 3)"],"a":0,"e":"From (5,−1), west 7 gives (−2,−1), north 4 gives (−2,3), and east 2 gives (0,3)."},{"q":"Five litres of a 10% solution are mixed with 15 litres of a 30% solution. What is the final concentration?","o":["20%","22.5%","25%","27.5%"],"a":2,"e":"The concentrate amount is 5×0.10 + 15×0.30 = 0.5+4.5=5 litres. Divide by 20 total litres to obtain 25%."},{"q":"A warehouse begins with 540 units, ships 30%, then receives 45 new units. It allocates one third of its updated stock. How many units remain unallocated?","o":["272","282","292","302"],"a":1,"e":"After shipping 30%, 540×0.70=378 units remain. After receiving 45, stock is 423. One third is 141, leaving 423−141=282."}]},{"title":"Attention to Detail","seconds":780,"questions":[{"q":"Master identifier: LZ-10O-I6 (after the 1 are numeral zero then capital O; suffix starts with capital I). Which option matches EXACTLY?","o":["LZ-100-I6","LZ-10O-I6","LZ-1OO-I6","LZ-10O-16"],"a":1,"e":"Only LZ-10O-I6 preserves the numeral zero before the capital letter O and the capital letter I before digit 6."},{"q":"Master email: support.ops+qa@polar-labs.io. Which copied address is an EXACT match?","o":["support.ops+qa@polar-labs.io","support-ops+qa@polar-labs.io","support.ops+qa@polar-labs.co","support.ops.qa@polar-labs.io"],"a":0,"e":"Only the first option matches the master address, including the dot, plus sign, hyphen and .io suffix."},{"q":"How many times does the EXACT code QP-8K42 appear?\nQP-8K42 · QP-8K24 · QP-8K42 · QP-8k42 · QP-8K42 · PQ-8K42","o":["2","3","4","5"],"a":1,"e":"Positions 1, 3 and 5 are exact matches. The other entries reverse digits, change case, or swap the prefix letters."},{"q":"Original record: SK-40962\nCopied record:   SK-49062\nWhat changed?","o":["The prefix letters","Two digits were transposed","One digit was deleted","Nothing changed"],"a":1,"e":"The numeric blocks 40962 and 49062 have the second and third digits (0 and 9) interchanged."},{"q":"A scan must include serial numbers PR-091 through PR-097 inclusive. It lists PR-091, PR-092, PR-093, PR-094, PR-096, PR-097. What is missing?","o":["PR-090","PR-095","PR-096","PR-098"],"a":1,"e":"The sequential range 091–097 includes PR-095 between PR-094 and PR-096. It is the only missing identifier."},{"q":"Timestamps must be strictly increasing:\n1. 14:06\n2. 14:19\n3. 14:28\n4. 14:27\n5. 14:40\nWhich entry FIRST breaks the ordering rule?","o":["Entry 2","Entry 3","Entry 4","Entry 5"],"a":2,"e":"The times rise through 14:28, but the fourth timestamp 14:27 is earlier. Therefore entry 4 first violates ascending order."},{"q":"Which line has an INCORRECT calculation?\nA: 7 × €14 = €98\nB: 9 × €8 = €72\nC: 6 × €13 = €78\nD: 5 × €17 = €80","o":["A","B","C","D"],"a":3,"e":"Line D is wrong because 5×€17=€85, not €80. All other lines calculate correctly."},{"q":"An invoice lists 4 items at €12.35, 3 items at €5.20, and a €6.50 shipping charge. What is the EXACT total?","o":["€70.50","€71.00","€71.50","€72.50"],"a":2,"e":"Items cost 4×12.35=€49.40 and 3×5.20=€15.60. Add €6.50 shipping to obtain €71.50."},{"q":"Which of these is NOT a valid 24-hour clock time?","o":["23:59","00:00","18:60","12:15"],"a":2,"e":"Minutes are numbered 00 through 59, so 18:60 is not a valid time; it would roll over to 19:00."},{"q":"A process starts at 17:38 and ends at 19:04 the same day. How long does it last?","o":["76 minutes","86 minutes","96 minutes","106 minutes"],"a":1,"e":"From 17:38 to 18:38 is 60 minutes; from 18:38 to 19:04 adds 26 minutes, total 86."},{"q":"The required format is TWO uppercase letters, THREE digits, '/', then TWO lowercase letters. Which code matches?","o":["QD582/ab","Qd582/ab","QD58B/ab","QD582/aB"],"a":0,"e":"Only QD582/ab has exactly two capital letters, three digits, a slash and two lowercase letters."},{"q":"Approved: Site P4 | Quantity 46 | Shelf D8. Which copied row has the WRONG quantity, not site or shelf?","o":["P4 | 46 | D8","P4 | 64 | D8","P9 | 46 | D8","P4 | 46 | D6"],"a":1,"e":"The second entry swaps the quantity from 46 to 64. Other incorrect rows alter the site or shelf instead."}]}];
const app=document.getElementById('app');
let phase='intro',si=0,qi=0,deadline=0,interval=null;
let answers=sections.map(s=>Array(s.questions.length).fill(null)),completion=['',''];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clockFormat=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
const left=()=>Math.max(0,Math.ceil((deadline-Date.now())/1000));
function stop(){if(interval!==null){clearInterval(interval);interval=null}}
function start(index){stop();si=index;qi=0;deadline=Date.now()+sections[index].seconds*1000;phase='exam';render();interval=setInterval(tick,250)}
function tick(){if(phase!=='exam')return;const t=left();if(!t){complete(true);return;}const el=document.getElementById('timer');if(el){el.textContent=clockFormat(t);el.classList.toggle('warn',t<=120);}}
function complete(expired){if(phase!=='exam')return;stop();completion[si]=expired?'Timer expired':'Submitted';phase=si===0?'intermission':'results';render()}
const answered=i=>answers[i].filter(x=>x!==null).length;
const score=i=>answers[i].reduce((sum,a,n)=>sum+(a===sections[i].questions[n].a?1:0),0);
function intro(){return `<span class="label">New challenge · Medium difficulty</span><h1>38 completely new questions · Fourth edition</h1><p>Practice logic, quantitative reasoning, scheduling and precision checking with the same section sizes and time limits as previous versions.</p><div class="statgrid"><div class="stat"><b>26 questions</b><span>Logic and Reasoning · 19 minutes</span></div><div class="stat"><b>12 questions</b><span>Attention to Detail · 13 minutes</span></div></div><div class="note">One question at a time. You can revisit previous questions within the current section. Time runs continuously once a section starts, even if you switch tabs. Unanswered questions count as incorrect. Answers and explanations remain hidden until both sections finish. Reloading resets the attempt. You can pause between sections.</div><div class="controls"><span class="muted">Free practice. No login or score collection.</span><button class="btn" data-action="start">Begin Logic and Reasoning →</button></div><p class="skiplink"><a href="../">Version 1</a> · <a href="../version-2/">Version 2</a> · <a href="../version-3/">Version 3</a> · <a href="../version-4/">Version 4</a></p>`}
function exam(){const section=sections[si],question=section.questions[qi],choice=answers[si][qi];const options=question.o.map((option,i)=>`<button class="answer ${choice===i?'active':''}" aria-pressed="${choice===i}" data-choice="${i}"><span class="key">${'ABCD'[i]}</span><span>${esc(option)}</span></button>`).join('');return `<div class="toprow"><div><div class="label">Section ${si+1} of 2 · ${esc(section.title)}</div><h2>Question ${qi+1} / ${section.questions.length}</h2><div class="muted">${answered(si)} answered · ${section.questions.length-answered(si)} unanswered</div></div><div id="timer" role="timer" aria-label="Section time remaining" class="time ${left()<=120?'warn':''}">${clockFormat(left())}</div></div><div class="track"><div class="fill" style="width:${((qi+1)/section.questions.length)*100}%"></div></div><div class="prompt">${esc(question.q)}</div><div class="answers">${options}</div><div class="controls"><button class="btn secondary" data-action="prev" ${qi===0?'disabled':''}>← Previous</button><button class="btn" data-action="next">${qi===section.questions.length-1?(si===0?'Finish section 1 →':'See results →'):'Next question →'}</button></div><div class="minor">${choice===null?'No answer selected. You can skip and return.':'Your choice is saved for this attempt.'} The answer key is shown only after completion.</div>`}
function intermission(){return `<div class="label">Section 1 finished</div><h1>Attention to Detail comes next</h1><p>Logic and Reasoning is complete. Your answers are locked and your results stay hidden until the end.</p><div class="statgrid"><div class="stat"><b>12 questions</b><span>Attention to Detail</span></div><div class="stat"><b>13 minutes</b><span>Your timer begins when you start this section.</span></div></div><div class="note">Section 1 status: ${completion[0]}. Unanswered questions: ${sections[0].questions.length-answered(0)}.</div><div class="controls"><span class="muted">You may take a break now.</span><button class="btn" data-action="next-section">Start Attention to Detail →</button></div>`}
function resultItem(q,j,k){const answer=answers[j][k],ok=answer===q.a,state=answer===null?'Skipped':ok?'Correct':'Incorrect',clazz=answer===null?'skip':ok?'ok':'bad';return `<details><summary><span>Q${k+1}. ${esc(q.q.replace(/\n/g,' ').slice(0,80))}${q.q.length>80?'…':''}</span><span class="outcome ${clazz}">${state}</span></summary><div class="body"><p><b>Question:</b> ${esc(q.q).replace(/\n/g,'<br>')}</p><p><b>Your answer:</b> ${answer===null?'Unanswered':esc('ABCD'[answer]+'. '+q.o[answer])}</p><p><b>Correct answer:</b> ${esc('ABCD'[q.a]+'. '+q.o[q.a])}</p><p><b>Explanation:</b> ${esc(q.e)}</p></div></details>`}
function results(){const total=score(0)+score(1);return `<div class="label">Version 10 · Assessment finished</div><h1>Your results and explanations</h1><p class="muted">Each question is scored as correct, incorrect or skipped. Expand any item for a worked solution.</p><div class="gridresult"><div class="scorebox"><strong>${total}/38</strong><span>Overall (${Math.round(100*total/38)}%)</span></div><div class="scorebox"><strong>${score(0)}/26</strong><span>Logic and Reasoning</span></div><div class="scorebox"><strong>${score(1)}/12</strong><span>Attention to Detail</span></div></div><p class="muted">Section 1: ${completion[0]} · Section 2: ${completion[1]}</p><div class="controls"><button class="btn secondary" data-action="expand">Expand all explanations</button><button class="btn secondary" data-action="collapse">Collapse all</button><button class="btn" data-action="reset">Restart version 10 ↻</button></div>${sections.map((s,j)=>`<section class="review"><h2>${j+1}. ${esc(s.title)} — ${score(j)}/${s.questions.length}</h2>${s.questions.map((q,k)=>resultItem(q,j,k)).join('')}</section>`).join('')}<p class="skiplink"><a href="../">Version 1</a> · <a href="../version-2/">Version 2</a> · <a href="../version-3/">Version 3</a> · <a href="../version-4/">Version 4</a> · <a href="../version-5/">Version 5</a> · <a href="../version-6/">Version 6</a> · <a href="../version-7/">Version 7</a> · <a href="../version-8/">Version 8</a> · <a href="../version-9/">Version 9</a></p>`}
function render(){app.innerHTML=phase==='intro'?intro():phase==='exam'?exam():phase==='intermission'?intermission():results()}
app.addEventListener('click',ev=>{const button=ev.target.closest('button');if(!button||!app.contains(button)||button.disabled)return;if(button.hasAttribute('data-choice')){if(phase!=='exam')return;if(left()<=0){complete(true);return;}answers[si][qi]=Number(button.dataset.choice);render();return;}switch(button.dataset.action){case 'start':if(phase==='intro')start(0);break;case 'prev':if(phase==='exam'&&qi>0){qi--;render()}break;case 'next':if(phase==='exam'){if(left()<=0){complete(true);break}if(qi===sections[si].questions.length-1)complete(false);else{qi++;render()}}break;case 'next-section':if(phase==='intermission')start(1);break;case 'expand':app.querySelectorAll('details').forEach(d=>d.open=true);break;case 'collapse':app.querySelectorAll('details').forEach(d=>d.open=false);break;case 'reset':stop();phase='intro';si=0;qi=0;completion=['',''];answers=sections.map(s=>Array(s.questions.length).fill(null));render();break}});
render();
})();
</script></body></html>
