<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EXS Practice Assessment — Version 3 (38 new questions)</title><style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f7f4fb;color:#281d40}
*{box-sizing:border-box}body{margin:0;padding:24px 16px}
main{max-width:860px;margin:auto;background:white;border:1px solid #e0d6ee;border-radius:18px;box-shadow:0 12px 36px #172c3d12;overflow:hidden}
header{background:linear-gradient(110deg,#35245c,#654b91);color:white;padding:24px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header strong{font-size:20px;letter-spacing:-.03em}header small{display:block;color:#ece1ff;margin-top:5px;font-size:12px}header .pill{background:#ffffff20;color:white;border:1px solid #ffffff40;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:750}
article{padding:28px 30px 34px;min-height:420px}h1{font-size:26px;line-height:1.22;margin:0 0 12px;letter-spacing:-.025em}h2{font-size:20px;margin:18px 0 12px}p{line-height:1.55;color:#334854}a{color:#6843a9}button{font:inherit;cursor:pointer}
.muted{color:#60747b;font-size:14px}.label{text-transform:uppercase;letter-spacing:.10em;font-size:11px;color:#7c51b9;font-weight:800}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.stat{border:1px solid #d4e3e7;background:#f7fcfc;border-radius:12px;padding:18px}.stat b{display:block;font-size:23px;color:#6542a2;margin-bottom:6px}.stat span{font-size:13px;color:#4e6570}
.note{padding:13px 15px;border-radius:10px;background:#f0f6f7;color:#40565c;font-size:14px;line-height:1.55}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:25px}
.btn{border:1px solid #6542a2;background:#7149ae;color:white;padding:12px 19px;font-weight:750;border-radius:10px}.btn:hover{background:#51317f}.btn.secondary{background:#fff;color:#493273;border-color:#bed2d7}.btn.secondary:hover{background:#ecf7f8}.btn:disabled{opacity:.42;cursor:default}button:focus-visible,summary:focus-visible{outline:3px solid #e6aa30;outline-offset:3px}
.toprow{display:flex;gap:10px;justify-content:space-between;align-items:start}.time{padding:10px 12px;border:1px solid #b4cbd0;background:#edf8f9;color:#175c65;font-variant-numeric:tabular-nums;font-size:18px;font-weight:850;border-radius:9px;white-space:nowrap}.time.warn{background:#fff1eb;border-color:#f4c3af;color:#a3391c}
.track{height:8px;border-radius:20px;background:#e4ecee;overflow:hidden;margin:20px 0 24px}.fill{height:100%;background:#8b66c3;transition:width .14s ease}
.prompt{font-size:21px;white-space:pre-line;line-height:1.45;margin:15px 0 22px;font-weight:760;letter-spacing:-.01em}.answers{display:grid;gap:10px}.answer{width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:15px;border:1px solid #cfdde1;background:#fff;color:#153039;border-radius:11px;line-height:1.45}.answer:hover{background:#f4fcfd;border-color:#73aeb8}.answer.active{border:2px solid #7048ab;background:#e8f8fa;padding:14px}.key{flex:0 0 28px;border:1px solid #c4d4d9;background:#f4f8f9;color:#375860;border-radius:7px;height:28px;display:grid;place-items:center;font-size:13px;font-weight:800}.answer.active .key{background:#7048ab;color:#fff;border-color:#7048ab}.minor{font-size:13px;color:#698087;margin-top:16px}
.gridresult{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:22px 0}.scorebox{text-align:center;border:1px solid #dae5e8;border-radius:12px;padding:15px}.scorebox strong{font-size:25px;display:block;color:#6542a2}.scorebox span{font-size:12px;color:#4a626d}.review{margin-top:27px}.review h2{border-bottom:1px solid #d9e5e9;padding-bottom:9px}.review details{border:1px solid #dce6e9;border-radius:10px;margin:9px 0;overflow:hidden}.review summary{padding:13px 15px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:14px;font-weight:650}.body{padding:0 16px 14px;font-size:14px}.body p{margin:8px 0}.ok{color:#087a54}.bad{color:#b33230}.skip{color:#647882}.outcome{font-weight:850;white-space:nowrap}.skiplink{font-size:13px;margin-top:10px}
@media(max-width:550px){body{padding:0;background:white}main{border:0;border-radius:0;box-shadow:none}header{padding:20px}article{padding:21px}.statgrid,.gridresult{grid-template-columns:1fr}.prompt{font-size:19px}.controls>.btn{flex:1}}
</style></head>
<body><main><header><div><strong>EXS Practice Assessment · Version 3</strong><small>Independent practice · Not an official TestGorilla assessment</small></div><div class="pill">38 new questions · 32 minutes</div></header>
<article id="app" aria-live="polite">Loading assessment…</article></main>
<script>
(()=>{'use strict';
const sections=[{"title":"Logic and Reasoning","seconds":1140,"questions":[{"q":"Find the next number in the sequence:\n6, 13, 27, 55, 111, ?","o":["222","223","225","221"],"a":1,"e":"Every term is twice the previous number plus 1: 6×2+1=13, then 27, 55, and 111. The next is 111×2+1=223."},{"q":"A warehouse has 63 employees on day and night shifts in the ratio 4:5. How many are on the night shift?","o":["42","36","28","35"],"a":3,"e":"There are 4+5=9 ratio parts. One part equals 63÷9=7. Night shift has 5×7=35 employees."},{"q":"The price of a sensor rises from €240 to €276. What is the percentage increase?","o":["14%","12%","18%","15%"],"a":3,"e":"The increase is €276−€240=€36. Divide by the ORIGINAL price: 36÷240=0.15=15%."},{"q":"Two departments use 35% and 25% of an annual fund. The remaining balance is €24,000. What was the original fund?","o":["€60,000","€48,000","€80,000","€72,000"],"a":0,"e":"The departments use 60%, leaving 40%. Thus €24,000÷0.40=€60,000."},{"q":"A batch of 750 devices has an 8% initial failure rate. Half of the failed devices are repaired successfully. How many remain faulty?","o":["24","60","45","30"],"a":3,"e":"Initially 750×0.08=60 fail. Half (30) are successfully repaired, so 30 remain faulty."},{"q":"Every report in Archive A has been approved. Some reports have NOT been approved. Which statement must be true?","o":["No approved report is archived anywhere.","Every approved report is in Archive A.","All unapproved reports are deleted.","Some reports are not in Archive A."],"a":3,"e":"If Archive A contains only approved reports, an unapproved report cannot be in Archive A. Since at least one unapproved report exists, some reports are not in Archive A."},{"q":"Exactly two of three systems—Alpha, Beta and Gamma—are active. Alpha and Gamma are active. What must be true?","o":["All three are active.","Gamma is not active.","Beta is active.","Beta is not active."],"a":3,"e":"Exactly two systems can be active. Alpha and Gamma already account for both, so Beta must be inactive."},{"q":"Five jobs A, B, C, D and E must be scheduled. A precedes C, B follows C immediately, D follows B, and E is last. Which sequence meets every rule?","o":["A – C – B – D – E","C – B – A – D – E","A – C – D – B – E","A – B – C – D – E"],"a":0,"e":"A must be before C; C and B must be consecutive as C–B; D must be after B; and E must end the order. Only A–C–B–D–E satisfies all constraints."},{"q":"Five measurements have a mean of 14. After the largest measurement, 18, is removed, what is the mean of the four remaining measurements?","o":["12.5","13.5","12","13"],"a":3,"e":"Total of five values is 5×14=70. Removing 18 leaves 52. Mean of the four remaining values =52÷4=13."},{"q":"Machine P produces 18 parts per hour and Machine Q produces 12 parts per hour. How many parts do they make together in 2½ hours?","o":["72","60","75","90"],"a":2,"e":"Together they make 18+12=30 parts/hour. In 2.5 hours they make 30×2.5=75 parts."},{"q":"Out of 200 parcels, 12% are rejected. One quarter of the accepted parcels are marked urgent. How many urgent parcels are there?","o":["56","50","44","47"],"a":2,"e":"Rejected=200×0.12=24; accepted=176. Urgent=176×0.25=44."},{"q":"A bag contains 5 green and 3 orange tokens. Two are drawn without replacement. What is the probability that BOTH are orange?","o":["3/16","3/28","9/64","1/4"],"a":1,"e":"First orange: 3/8. After removing one orange, second orange: 2/7. Multiply: (3/8)×(2/7)=6/56=3/28."},{"q":"A tool costs €84 after a 30% discount. What was its price BEFORE the discount?","o":["€120","€126","€112","€109.20"],"a":0,"e":"The discounted €84 equals 70% of the original price. Divide by 0.70: €84÷0.70=€120."},{"q":"A code swaps the order of letters in each adjacent PAIR. For instance, PLANT becomes LPNAT (the final unpaired letter stays unchanged). How is SILVER encoded?","o":["ISVLER","ISVLRE","SLIVRE","ISLVRE"],"a":1,"e":"Split SILVER into SI | LV | ER. Reverse each pair to IS | VL | RE, giving ISVLRE."},{"q":"A repair begins at 22:45 and takes 2 hours 35 minutes. At what time does it finish?","o":["01:10 the next day","01:30 the next day","00:55 the next day","01:20 the next day"],"a":3,"e":"22:45 plus 2 hours is 00:45 the next day. Add 35 minutes to reach 01:20."},{"q":"What is the next letter?\nA, C, F, J, O, ?","o":["U","T","V","W"],"a":0,"e":"Using alphabet positions, advances are +2, +3, +4, +5. The next advance is +6: O (15) + 6 = U (21)."},{"q":"Only certified operators are permitted to reset the control panel. Hana has permission to reset it. Which statement follows?","o":["Uncertified operators can reset the panel too.","Every certified operator has reset the panel.","Hana is certified.","Hana has already reset it."],"a":2,"e":"“Only certified operators are permitted” means anyone permitted to reset the panel must be certified. Permission does not imply she actually performed the reset."},{"q":"A shop offers “buy three, pay for two” on identical €18 notebooks. What is the price for NINE notebooks if the promotion applies to all nine?","o":["€90","€144","€108","€126"],"a":2,"e":"Nine notebooks form three groups of three. You pay for two in each group: 3×2=6 notebooks, at €18 each, totaling €108."},{"q":"Five consecutive inspections each take 40 minutes. They begin at 08:15 with no breaks. When will the LAST inspection finish?","o":["11:25","11:45","11:35","11:15"],"a":2,"e":"Five inspections take 5×40=200 minutes=3 hours 20 minutes. 08:15+3:20=11:35."},{"q":"The average rating of TWO devices is 40 and the average rating of THREE other devices is 60. What is the combined average for all five?","o":["48","52","54","50"],"a":1,"e":"The total rating is 2×40+3×60=260. Divide by 5 devices to get an average of 52. A simple average of 40 and 60 would ignore group sizes."},{"q":"A rectangle measures 8 m by 5 m. Its length increases to 12 m while its width stays 5 m. By what percentage does its area increase?","o":["25%","50%","40%","60%"],"a":1,"e":"Original area=8×5=40 m². New area=12×5=60 m². Increase=20 m²; 20÷40=50%."},{"q":"Which pair has the SAME relationship as “thermometer : temperature”?","o":["Scale : mass","Battery : height","Compass : speed","Clock : distance"],"a":0,"e":"A thermometer measures temperature. A scale measures mass. The other pairs mismatch the instrument and the quantity."},{"q":"An express train leaves at 09:30 at 90 km/h. A slower train left the same station and route at 09:00 at 60 km/h. When does the express catch up?","o":["10:00","10:30","11:00","10:15"],"a":1,"e":"The slow train has a 30-minute head start, traveling 30 km. Relative speed=90−60=30 km/h, so catching up takes one hour after 09:30: at 10:30."},{"q":"Five unique digits—1, 2, 3, 4, 5—are available. How many TWO-digit codes can be made if digits cannot repeat?","o":["20","25","15","10"],"a":0,"e":"There are five choices for the first digit and four remaining choices for the second, giving 5×4=20 codes."},{"q":"A list alternates multiplying by 3 and subtracting 4:\n2, 6, 2, 6, 2, ?","o":["6","−2","4","8"],"a":0,"e":"The rule alternates ×3 and −4. From the fifth value 2, the next operation is ×3, so the answer is 6."},{"q":"From a 120-page manual, Alex reviews 30% on Monday and one quarter of the REMAINING pages on Tuesday. How many pages remain unread?","o":["66","63","60","72"],"a":1,"e":"Monday: 120×0.30=36 pages, leaving 84. Tuesday: 84×1/4=21 pages. Unread=84−21=63 pages."}]},{"title":"Attention to Detail","seconds":780,"questions":[{"q":"Master asset ID: HN-608Q-M4\nWhich transcription is an EXACT match?","o":["HN-680Q-M4","HN-608Q-M4","HN-608O-M4","HN-608Q-MA"],"a":1,"e":"Only HN-608Q-M4 preserves every character. The alternatives replace Q with O, 4 with A, or transpose 0 and 8."},{"q":"Which exact identifier occurs TWICE?\nFD-4907  ·  FD-4079  ·  FD-4907  ·  DF-4907","o":["None of them","FD-4079","FD-4907","DF-4907"],"a":2,"e":"FD-4907 is present in positions 1 and 3. FD-4079 and DF-4907 each appear only once."},{"q":"Original dispatch code: TKS-140-26\nEntered dispatch code: TKS-104-26\nWhat is the discrepancy?","o":["Two digits in the middle block have swapped places.","The two codes are identical.","The final suffix differs.","The initial letters differ."],"a":0,"e":"The original middle block is 140, but the entered block is 104. The 4 and 0 in that block have been transposed."},{"q":"Which line contains an arithmetic error?\nA: 7 × €16 = €112\nB: 9 × €8 = €72\nC: 4 × €25 = €100\nD: 6 × €14 = €86","o":["Line C","Line B","Line A","Line D"],"a":3,"e":"Line D is incorrect because 6×€14=€84, not €86. The other three products are correct."},{"q":"An overnight task begins at 23:42 and ends at 00:17 the next day. The log reports a duration of 25 minutes. What needs correction?","o":["The stated duration","The end hour","The start hour","Nothing: the duration is correct"],"a":0,"e":"There are 18 minutes from 23:42 to midnight and 17 minutes to 00:17, totaling 35 minutes. The recorded 25-minute duration is incorrect."},{"q":"Master name: Eleni Marin\nEntered name: Eleni Martin\nWhich is accurate?","o":["Only the given name differs.","Only the surname differs.","Both names differ.","Both fields match."],"a":1,"e":"The given name Eleni is identical. The surnames Marin and Martin differ: Martin has an additional “t”."},{"q":"Using the format DD/MM/YYYY, which entry represents 11 August 2026?","o":["08/11/2026","11/06/2028","11/08/2026","08/01/2026"],"a":2,"e":"With day/month/year order, 11/08/2026 is 11 August 2026. 08/11/2026 instead means 8 November 2026."},{"q":"A shipment should include consecutive items RS-381 through RS-386. The scan lists RS-381, RS-382, RS-383, RS-385, RS-386. Which item is missing?","o":["RS-380","RS-383","RS-384","RS-387"],"a":2,"e":"The expected sequence is 381, 382, 383, 384, 385, 386. RS-384 is absent from the scanned list."},{"q":"How many times is the EXACT string AB-77M present?\nAB-77M · AB-7TM · AB-77M · BA-77M · AB-77N · AB-77M","o":["4","5","2","3"],"a":3,"e":"AB-77M appears at positions 1, 3 and 6. AB-7TM, BA-77M and AB-77N are different strings."},{"q":"Reference: Invoice 5087; client WX-14; quantity 27. Which record contains an incorrect quantity but the correct invoice and client?","o":["5087 | WX-41 | 27","5087 | WX-14 | 27","5087 | WX-14 | 72","5807 | WX-14 | 27"],"a":2,"e":"The record with quantity 72 retains invoice 5087 and client WX-14, but the approved quantity is 27. Other records match or contain a different field error."},{"q":"A receipt has €12.45, €8.70 and €3.85 listed as separate items. What is the EXACT sum?","o":["€25.00","€25.10","€24.90","€24.00"],"a":0,"e":"€12.45+€8.70=€21.15, and €21.15+€3.85=€25.00."},{"q":"The serial label reads RH-2I5 (the middle character is the CAPITAL LETTER I). Which copy is identical?","o":["RH-215","RH-2I5","RH-2l5","RH-2J5"],"a":1,"e":"The matching code contains capital I: RH-2I5. The other copies use numeral 1, lowercase l, or capital J in its place."}]}];
const app=document.getElementById('app');
let phase='intro',si=0,qi=0,deadline=0,interval=null;
let answers=sections.map(s=>Array(s.questions.length).fill(null)),completion=['',''];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clockFormat=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
const left=()=>Math.max(0,Math.ceil((deadline-Date.now())/1000));
function stop(){if(interval!==null){clearInterval(interval);interval=null}}
function start(index){stop();si=index;qi=0;deadline=Date.now()+sections[index].seconds*1000;phase='exam';render();interval=setInterval(tick,250)}
function tick(){if(phase!=='exam')return;const t=left();if(!t){complete(true);return;}const el=document.getElementById('timer');if(el){el.textContent=clockFormat(t);el.classList.toggle('warn',t<=120);}}
function complete(expired){if(phase!=='exam')return;stop();completion[si]=expired?'Timer expired':'Submitted';phase=si===0?'intermission':'results';render()}
const answered=i=>answers[i].filter(x=>x!==null).length;
const score=i=>answers[i].reduce((sum,a,n)=>sum+(a===sections[i].questions[n].a?1:0),0);
function intro(){return `<span class="label">New challenge · Medium difficulty</span><h1>38 completely new questions · Third edition</h1><p>Practice logic, quantitative reasoning, scheduling and precision checking with the same section sizes and time limits as previous versions.</p><div class="statgrid"><div class="stat"><b>26 questions</b><span>Logic and Reasoning · 19 minutes</span></div><div class="stat"><b>12 questions</b><span>Attention to Detail · 13 minutes</span></div></div><div class="note">One question at a time. You can revisit previous questions within the current section. Time runs continuously once a section starts, even if you switch tabs. Unanswered questions count as incorrect. Answers and explanations remain hidden until both sections finish. Reloading resets the attempt. You can pause between sections.</div><div class="controls"><span class="muted">Free practice. No login or score collection.</span><button class="btn" data-action="start">Begin Logic and Reasoning →</button></div><p class="skiplink"><a href="../">Version 1</a> · <a href="../version-2/">Version 2</a></p>`}
function exam(){const section=sections[si],question=section.questions[qi],choice=answers[si][qi];const options=question.o.map((option,i)=>`<button class="answer ${choice===i?'active':''}" aria-pressed="${choice===i}" data-choice="${i}"><span class="key">${'ABCD'[i]}</span><span>${esc(option)}</span></button>`).join('');return `<div class="toprow"><div><div class="label">Section ${si+1} of 2 · ${esc(section.title)}</div><h2>Question ${qi+1} / ${section.questions.length}</h2><div class="muted">${answered(si)} answered · ${section.questions.length-answered(si)} unanswered</div></div><div id="timer" role="timer" aria-label="Section time remaining" class="time ${left()<=120?'warn':''}">${clockFormat(left())}</div></div><div class="track"><div class="fill" style="width:${((qi+1)/section.questions.length)*100}%"></div></div><div class="prompt">${esc(question.q)}</div><div class="answers">${options}</div><div class="controls"><button class="btn secondary" data-action="prev" ${qi===0?'disabled':''}>← Previous</button><button class="btn" data-action="next">${qi===section.questions.length-1?(si===0?'Finish section 1 →':'See results →'):'Next question →'}</button></div><div class="minor">${choice===null?'No answer selected. You can skip and return.':'Your choice is saved for this attempt.'} The answer key is shown only after completion.</div>`}
function intermission(){return `<div class="label">Section 1 finished</div><h1>Attention to Detail comes next</h1><p>Logic and Reasoning is complete. Your answers are locked and your results stay hidden until the end.</p><div class="statgrid"><div class="stat"><b>12 questions</b><span>Attention to Detail</span></div><div class="stat"><b>13 minutes</b><span>Your timer begins when you start this section.</span></div></div><div class="note">Section 1 status: ${completion[0]}. Unanswered questions: ${sections[0].questions.length-answered(0)}.</div><div class="controls"><span class="muted">You may take a break now.</span><button class="btn" data-action="next-section">Start Attention to Detail →</button></div>`}
function resultItem(q,j,k){const answer=answers[j][k],ok=answer===q.a,state=answer===null?'Skipped':ok?'Correct':'Incorrect',clazz=answer===null?'skip':ok?'ok':'bad';return `<details><summary><span>Q${k+1}. ${esc(q.q.replace(/\n/g,' ').slice(0,80))}${q.q.length>80?'…':''}</span><span class="outcome ${clazz}">${state}</span></summary><div class="body"><p><b>Question:</b> ${esc(q.q).replace(/\n/g,'<br>')}</p><p><b>Your answer:</b> ${answer===null?'Unanswered':esc('ABCD'[answer]+'. '+q.o[answer])}</p><p><b>Correct answer:</b> ${esc('ABCD'[q.a]+'. '+q.o[q.a])}</p><p><b>Explanation:</b> ${esc(q.e)}</p></div></details>`}
function results(){const total=score(0)+score(1);return `<div class="label">Version 3 · Assessment finished</div><h1>Your results and explanations</h1><p class="muted">Each question is scored as correct, incorrect or skipped. Expand any item for a worked solution.</p><div class="gridresult"><div class="scorebox"><strong>${total}/38</strong><span>Overall (${Math.round(100*total/38)}%)</span></div><div class="scorebox"><strong>${score(0)}/26</strong><span>Logic and Reasoning</span></div><div class="scorebox"><strong>${score(1)}/12</strong><span>Attention to Detail</span></div></div><p class="muted">Section 1: ${completion[0]} · Section 2: ${completion[1]}</p><div class="controls"><button class="btn secondary" data-action="expand">Expand all explanations</button><button class="btn secondary" data-action="collapse">Collapse all</button><button class="btn" data-action="reset">Restart version 3 ↻</button></div>${sections.map((s,j)=>`<section class="review"><h2>${j+1}. ${esc(s.title)} — ${score(j)}/${s.questions.length}</h2>${s.questions.map((q,k)=>resultItem(q,j,k)).join('')}</section>`).join('')}<p class="skiplink"><a href="../">Version 1</a> · <a href="../version-2/">Version 2</a></p>`}
function render(){app.innerHTML=phase==='intro'?intro():phase==='exam'?exam():phase==='intermission'?intermission():results()}
app.addEventListener('click',ev=>{const button=ev.target.closest('button');if(!button||!app.contains(button)||button.disabled)return;if(button.hasAttribute('data-choice')){if(phase!=='exam')return;if(left()<=0){complete(true);return;}answers[si][qi]=Number(button.dataset.choice);render();return;}switch(button.dataset.action){case 'start':if(phase==='intro')start(0);break;case 'prev':if(phase==='exam'&&qi>0){qi--;render()}break;case 'next':if(phase==='exam'){if(left()<=0){complete(true);break}if(qi===sections[si].questions.length-1)complete(false);else{qi++;render()}}break;case 'next-section':if(phase==='intermission')start(1);break;case 'expand':app.querySelectorAll('details').forEach(d=>d.open=true);break;case 'collapse':app.querySelectorAll('details').forEach(d=>d.open=false);break;case 'reset':stop();phase='intro';si=0;qi=0;completion=['',''];answers=sections.map(s=>Array(s.questions.length).fill(null));render();break}});
render();
})();
</script></body></html>
