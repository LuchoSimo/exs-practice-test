<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EXS Practice Assessment — Version 4 (38 new questions)</title><style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#fbf7f2;color:#34231b}
*{box-sizing:border-box}body{margin:0;padding:24px 16px}
main{max-width:860px;margin:auto;background:white;border:1px solid #eadbd1;border-radius:18px;box-shadow:0 12px 36px #172c3d12;overflow:hidden}
header{background:linear-gradient(110deg,#65341c,#a34f2d);color:white;padding:24px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header strong{font-size:20px;letter-spacing:-.03em}header small{display:block;color:#fce7d6;margin-top:5px;font-size:12px}header .pill{background:#ffffff20;color:white;border:1px solid #ffffff40;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:750}
article{padding:28px 30px 34px;min-height:420px}h1{font-size:26px;line-height:1.22;margin:0 0 12px;letter-spacing:-.025em}h2{font-size:20px;margin:18px 0 12px}p{line-height:1.55;color:#334854}a{color:#a64c24}button{font:inherit;cursor:pointer}
.muted{color:#60747b;font-size:14px}.label{text-transform:uppercase;letter-spacing:.10em;font-size:11px;color:#9e512e;font-weight:800}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.stat{border:1px solid #d4e3e7;background:#f7fcfc;border-radius:12px;padding:18px}.stat b{display:block;font-size:23px;color:#9a4c28;margin-bottom:6px}.stat span{font-size:13px;color:#4e6570}
.note{padding:13px 15px;border-radius:10px;background:#f0f6f7;color:#40565c;font-size:14px;line-height:1.55}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:25px}
.btn{border:1px solid #9a4c28;background:#b7582b;color:white;padding:12px 19px;font-weight:750;border-radius:10px}.btn:hover{background:#884020}.btn.secondary{background:#fff;color:#754022;border-color:#bed2d7}.btn.secondary:hover{background:#ecf7f8}.btn:disabled{opacity:.42;cursor:default}button:focus-visible,summary:focus-visible{outline:3px solid #e6aa30;outline-offset:3px}
.toprow{display:flex;gap:10px;justify-content:space-between;align-items:start}.time{padding:10px 12px;border:1px solid #b4cbd0;background:#edf8f9;color:#175c65;font-variant-numeric:tabular-nums;font-size:18px;font-weight:850;border-radius:9px;white-space:nowrap}.time.warn{background:#fff1eb;border-color:#f4c3af;color:#a3391c}
.track{height:8px;border-radius:20px;background:#e4ecee;overflow:hidden;margin:20px 0 24px}.fill{height:100%;background:#bb6033;transition:width .14s ease}
.prompt{font-size:21px;white-space:pre-line;line-height:1.45;margin:15px 0 22px;font-weight:760;letter-spacing:-.01em}.answers{display:grid;gap:10px}.answer{width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:15px;border:1px solid #cfdde1;background:#fff;color:#153039;border-radius:11px;line-height:1.45}.answer:hover{background:#f4fcfd;border-color:#73aeb8}.answer.active{border:2px solid #a4542c;background:#e8f8fa;padding:14px}.key{flex:0 0 28px;border:1px solid #c4d4d9;background:#f4f8f9;color:#375860;border-radius:7px;height:28px;display:grid;place-items:center;font-size:13px;font-weight:800}.answer.active .key{background:#a4542c;color:#fff;border-color:#a4542c}.minor{font-size:13px;color:#698087;margin-top:16px}
.gridresult{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:22px 0}.scorebox{text-align:center;border:1px solid #dae5e8;border-radius:12px;padding:15px}.scorebox strong{font-size:25px;display:block;color:#9a4c28}.scorebox span{font-size:12px;color:#4a626d}.review{margin-top:27px}.review h2{border-bottom:1px solid #d9e5e9;padding-bottom:9px}.review details{border:1px solid #dce6e9;border-radius:10px;margin:9px 0;overflow:hidden}.review summary{padding:13px 15px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:14px;font-weight:650}.body{padding:0 16px 14px;font-size:14px}.body p{margin:8px 0}.ok{color:#087a54}.bad{color:#b33230}.skip{color:#647882}.outcome{font-weight:850;white-space:nowrap}.skiplink{font-size:13px;margin-top:10px}
@media(max-width:550px){body{padding:0;background:white}main{border:0;border-radius:0;box-shadow:none}header{padding:20px}article{padding:21px}.statgrid,.gridresult{grid-template-columns:1fr}.prompt{font-size:19px}.controls>.btn{flex:1}}
</style></head>
<body><main><header><div><strong>EXS Practice Assessment · Version 4</strong><small>Independent practice · Not an official TestGorilla assessment</small></div><div class="pill">38 new questions · 32 minutes</div></header>
<article id="app" aria-live="polite">Loading assessment…</article></main>
<script>
(()=>{'use strict';
const sections=[{"title":"Logic and Reasoning","seconds":1140,"questions":[{"q":"An indicator follows two alternating steps: add 3, then double. What comes next?\n4, 7, 14, 17, 34, 37, ?","o":["74","70","80","77"],"a":0,"e":"The alternating steps are +3, ×2, +3, ×2, +3, so next is ×2. Therefore 37 × 2 = 74."},{"q":"Each row uses the same input-output rule:\n2 | 5 → 12\n3 | 7 → 24\n4 | 6 → ?","o":["26","30","28","24"],"a":2,"e":"Multiply the first number by the second, then add the first number. For row three: (4 × 6) + 4 = 28. This also gives 2×5+2=12 and 3×7+3=24."},{"q":"A repeating alert cycle is RED, BLUE, BLUE, GREEN. What is the 19th alert?","o":["BLUE","RED","GREEN","Cannot determine"],"a":0,"e":"The cycle has four alerts. 19 ÷ 4 leaves remainder 3, so the 19th alert is the third item in a cycle: BLUE."},{"q":"Starting at C, move five letters forward, then two letters backward, repeating. What letter comes next?\nC, H, F, K, I, ?","o":["O","L","N","M"],"a":2,"e":"C+5=H; H−2=F; F+5=K; K−2=I. Next use +5: I→N."},{"q":"A robot starts at grid position (2, 4). It moves 3 steps east, 2 steps south, then 1 step west. East increases x and north increases y. Where does it finish?","o":["(5, 3)","(4, 2)","(6, 2)","(4, 6)"],"a":1,"e":"Start (2,4). Three east gives (5,4); two south gives (5,2); one west gives (4,2)."},{"q":"Five colleagues stand in a line. Bina is before Farah; Farah before Dina; Dina before Ebrahim; Ebrahim before Amin. Who is THIRD?","o":["Amin","Farah","Dina","Ebrahim"],"a":2,"e":"The rules form a single chain: Bina, Farah, Dina, Ebrahim, Amin. Dina occupies third place."},{"q":"Exactly ONE of these three statements is false.\nM: “N caused the error.”\nN: “O caused the error.”\nO: “N is not telling the truth.”\nExactly one of M, N and O caused the error. Who was it?","o":["N","M","O","Cannot be determined"],"a":0,"e":"If N caused the error: M is true, N is false and O is true—exactly one false statement. If M or O caused it, two statements are false. Therefore N caused the error."},{"q":"Policy: If a parcel is marked PRIORITY, it receives an extra inspection. A parcel received an extra inspection. What can you conclude?","o":["It must be PRIORITY.","It cannot be PRIORITY.","No parcel was inspected.","Its priority status is unknown."],"a":3,"e":"PRIORITY implies inspection, but inspection does not imply PRIORITY. Other reasons for inspections may exist; inferring the converse would be a reasoning error."},{"q":"Every shipment is either temperature-controlled or oversized, but never both. Shipment X is NOT oversized. What follows?","o":["Nothing can be determined.","It is temperature-controlled.","It belongs to neither category.","It is both categories."],"a":1,"e":"The rule puts every shipment in exactly one of the two categories. Since X is not oversized, it must be temperature-controlled."},{"q":"Only badge holders are permitted to enter Lab A. Jamie has a badge. Which conclusion is justified?","o":["Having a badge alone does not establish that Jamie is permitted.","Jamie does not have permission.","Jamie definitely entered Lab A.","Jamie is automatically permitted to enter Lab A."],"a":0,"e":"Being a badge holder is a NECESSARY condition, not a sufficient condition. The rule does not say that every badge holder is authorized."},{"q":"Rule: A reviewer must NEVER approve a report that they wrote. Which situation definitely violates the rule?","o":["Nora writes a report, and Kai approves it.","Nora reviews but declines to approve her own report.","Nora writes a report and approves that same report.","Kai approves a report whose author is unknown."],"a":2,"e":"The prohibition is specifically on approving your own report. Writing and approving the identical report breaks the rule."},{"q":"A 2 kg alloy contains 30% copper; another 3 kg alloy contains 50% copper. If mixed with no losses, what percentage of the 5 kg mixture is copper?","o":["44%","38%","42%","40%"],"a":2,"e":"Copper mass is 2×0.30 + 3×0.50 = 0.6+1.5=2.1 kg. Divide by total 5 kg: 2.1/5=42%. Do not average 30% and 50% without weighting."},{"q":"A battery starts with 240 charge units. It supplies 18 units per hour for 6 hours, followed by 12 units per hour for 5 hours. How many units remain?","o":["84","96","72","60"],"a":2,"e":"First phase uses 18×6=108 units; second uses 12×5=60 units. Remaining charge =240−108−60=72."},{"q":"An item has a list price of €280. A 10% discount applies first; then 20% VAT is charged on the discounted price. What is the total?","o":["€308.00","€302.40","€300.00","€336.00"],"a":1,"e":"After discount: €280×0.90=€252. Add VAT: €252×1.20=€302.40. The order of operations matters."},{"q":"A driver covers 84 km at 42 km/h, then 63 km at 63 km/h. With no stops, what is the AVERAGE speed for the whole journey?","o":["49 km/h","52.5 km/h","50 km/h","54 km/h"],"a":0,"e":"The first leg takes 84/42=2 hours; the second takes 63/63=1 hour. Total distance 147 km in 3 hours yields 147/3=49 km/h."},{"q":"On-call duty repeats in this order: Maya, Leon, Sora, Ivo. Maya is on call on November 1. Who is on call on November 19?","o":["Ivo","Leon","Sora","Maya"],"a":2,"e":"November 19 is 18 days after November 1. Each four-day cycle repeats, and 18 modulo 4 = 2, meaning two places after Maya: Sora."},{"q":"Printer A produces 18 pages in 3 minutes. Printer B produces 15 pages in 5 minutes. If both print continuously for 8 minutes, how many pages do they produce together?","o":["72","80","68","64"],"a":0,"e":"Printer A makes 18/3=6 pages/minute, and B makes 15/5=3 pages/minute. Together they produce 9×8=72 pages."},{"q":"A team targets 160 completed cases. It finishes 35% of the target in the morning and another 48 cases in the afternoon. How many remain?","o":["48","60","64","56"],"a":3,"e":"Morning: 160×0.35=56 cases. Total completed =56+48=104. Remaining=160−104=56."},{"q":"What is the MEDIAN of these seven values?\n4, 9, 12, 8, 11, 7, 10","o":["10","8","9","11"],"a":2,"e":"Sort the values: 4,7,8,9,10,11,12. With seven values, the median is the fourth value: 9."},{"q":"A storage tank is 3/8 full. After adding 150 litres, it is 3/4 full. What is the tank’s total capacity?","o":["360 L","300 L","450 L","400 L"],"a":3,"e":"The change from 3/8 to 3/4 = 6/8 is 3/8 of the tank. Therefore (3/8)×capacity=150; capacity=150×8/3=400 L."},{"q":"On a map with scale 1:50,000, two stations are 3.6 cm apart. How far apart are they in reality?","o":["1.8 km","18 km","180 km","0.18 km"],"a":0,"e":"Every map centimetre represents 50,000 cm = 0.5 km in reality. Therefore 3.6×0.5=1.8 km."},{"q":"Six interviews each take 20 minutes, with a 10-minute gap BETWEEN consecutive interviews. The first begins at 09:15. When does the last interview END?","o":["11:45","11:55","12:15","12:05"],"a":3,"e":"Six interviews take 6×20=120 minutes. Five gaps take 5×10=50 minutes. Total=170 minutes=2h50m, so 09:15→12:05."},{"q":"A fair coin is tossed three times. What is the probability of getting EXACTLY two tails?","o":["1/2","3/8","1/4","1/8"],"a":1,"e":"There are 2³=8 equally likely sequences. Exactly two tails occur as TTH, THT or HTT: 3 sequences out of 8."},{"q":"In a mixture, the quantities of A and B have ratio 3:2. If A exceeds B by 14 kg, what is their COMBINED mass?","o":["70 kg","84 kg","63 kg","56 kg"],"a":0,"e":"The ratio parts differ by one. That one part equals 14 kg. A=42 kg and B=28 kg, together 70 kg."},{"q":"Forty percent of a number equals 56. What is FIFTEEN percent of that same number?","o":["35","21","18","24"],"a":1,"e":"The original number is 56÷0.40=140. Fifteen percent is 140×0.15=21."},{"q":"You must order 10 identical devices from one supplier. The total includes the listed shipping fee. Which supplier is CHEAPEST?\nA: €11.20 each + €8 shipping\nB: €10.90 each + €12 shipping\nC: €11.40 each + €5 shipping","o":["Supplier C","Supplier A","Supplier B","A and B tie"],"a":0,"e":"A totals 10×11.20+8=€120; B totals 10×10.90+12=€121; C totals 10×11.40+5=€119. Supplier C is cheapest."}]},{"title":"Attention to Detail","seconds":780,"questions":[{"q":"Master: ZP-308 | K5 | 012\nWhich record is an EXACT character-by-character match?","o":["ZP-308 | K5 | 021","ZP-380 | K5 | 012","ZP-308 | KS | 012","ZP-308 | K5 | 012"],"a":3,"e":"The first option exactly matches all three fields. The others transpose 308, replace the digit 5 with letter S, or transpose 012."},{"q":"Transaction times should be STRICTLY increasing. Which listed entry is the FIRST one that breaks chronological order?\n10:02, 10:07, 10:05, 10:11","o":["10:07","10:05","10:02","10:11"],"a":1,"e":"10:05 is earlier than the immediately preceding entry, 10:07. It is the first violation of increasing order."},{"q":"Ignore spaces only, but preserve letter case and character order. Which option matches the reference P7R2A?","o":["P7r2A","P7R2 4","P7R 2A","P7R A2"],"a":2,"e":"Removing the single space from P7R 2A yields P7R2A. The other options reorder characters or change their case/value."},{"q":"Required code format: exactly THREE capital letters, a hyphen, FOUR digits, a hyphen, and TWO capital letters. Which entry satisfies it?","o":["QTR-6018-Vp","QTR-6018-VP","QT-6018-VPP","QTR-60I8-VP"],"a":1,"e":"QTR contains three capitals, 6018 contains four digits, and VP contains two capitals. Other options have wrong lengths, an I instead of a digit, or lowercase p."},{"q":"Which invoice line has the WRONG calculated line total?\nA: 2.5 × €4.00 = €10.00\nB: 3 × €5.20 = €15.60\nC: 1.5 × €8.00 = €13.00\nD: 4 × €2.10 = €8.40","o":["Line D","Line B","Line C","Line A"],"a":2,"e":"Line C should be 1.5×€8.00=€12.00, not €13.00. The other three stated totals are correct."},{"q":"Approved quantities:\nOX-24: 36 | JQ-08: 19 | BT-61: 42 | CN-90: 27\nCopied quantities:\nOX-24: 36 | JQ-08: 19 | BT-61: 24 | CN-90: 27\nWhich product has an incorrect quantity?","o":["CN-90","JQ-08","OX-24","BT-61"],"a":3,"e":"BT-61 should have quantity 42, but the copied list shows 24. The digits are transposed; the other quantities match."},{"q":"Count how many of the following codes match the format ABC-123: exactly 3 capital letters, hyphen, 3 digits.\nFEX-204 · FE-204 · ABc-312 · TMP-008 · QRS-7O2 · ZED-300","o":["5","3","4","2"],"a":1,"e":"The valid entries are FEX-204, TMP-008 and ZED-300. FE has too few letters, ABc uses lowercase, and QRS-7O2 includes letter O among the digits."},{"q":"Inventory rows should be sorted in ASCENDING serial order:\n1. 0049\n2. 0052\n3. 0058\n4. 0057\n5. 0063\nWhich row FIRST violates the order?","o":["Row 5","Row 3","Row 2","Row 4"],"a":3,"e":"After serial 0058, the next serial must be greater than 0058. Row 4 is 0057, which is smaller, so row 4 first breaks the ascending order."},{"q":"An employee’s shift runs from 07:45 to 16:15, including a 30-minute UNPAID break. What is the correct paid working time?","o":["7 h 30 m","8 h 30 m","8 h 15 m","8 h"],"a":3,"e":"The elapsed time is 8h30m (07:45→16:15). Subtract the unpaid 30-minute break to get exactly 8 paid hours."},{"q":"A receipt lists €17.35, €24.80 and €8.45. The printed total is €50.50. By how much is the printed total incorrect?","o":["€0.10","€0.20","€1.00","€0.05"],"a":0,"e":"Actual total=17.35+24.80+8.45=€50.60. The printed €50.50 is €0.10 too low."},{"q":"Date format is YYYY-MM-DD. Which is NOT a valid calendar date?","o":["2026-04-30","2026-02-29","2026-11-30","2026-12-01"],"a":1,"e":"2026 is not a leap year, so February has 28 days. The other dates exist and respect YYYY-MM-DD formatting."},{"q":"Master delivery location: Dock 6, Hall C, Bay 14\nTransferred location: Dock 6, Hall G, Bay 14\nWhich field is different?","o":["Dock number","Hall letter","No difference","Bay number"],"a":1,"e":"The master states Hall C; the transferred copy says Hall G. Dock 6 and Bay 14 match exactly."}]}];
const app=document.getElementById('app');
let phase='intro',si=0,qi=0,deadline=0,interval=null;
let answers=sections.map(s=>Array(s.questions.length).fill(null)),completion=['',''];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clockFormat=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
const left=()=>Math.max(0,Math.ceil((deadline-Date.now())/1000));
function stop(){if(interval!==null){clearInterval(interval);interval=null}}
function start(index){stop();si=index;qi=0;deadline=Date.now()+sections[index].seconds*1000;phase='exam';render();interval=setInterval(tick,250)}
function tick(){if(phase!=='exam')return;const t=left();if(!t){complete(true);return;}const el=document.getElementById('timer');if(el){el.textContent=clockFormat(t);el.classList.toggle('warn',t<=120);}}
function complete(expired){if(phase!=='exam')return;stop();completion[si]=expired?'Timer expired':'Submitted';phase=si===0?'intermission':'results';render()}
const answered=i=>answers[i].filter(x=>x!==null).length;
const score=i=>answers[i].reduce((sum,a,n)=>sum+(a===sections[i].questions[n].a?1:0),0);
function intro(){return `<span class="label">New challenge · Medium difficulty</span><h1>38 completely new questions · Fourth edition</h1><p>Practice logic, quantitative reasoning, scheduling and precision checking with the same section sizes and time limits as previous versions.</p><div class="statgrid"><div class="stat"><b>26 questions</b><span>Logic and Reasoning · 19 minutes</span></div><div class="stat"><b>12 questions</b><span>Attention to Detail · 13 minutes</span></div></div><div class="note">One question at a time. You can revisit previous questions within the current section. Time runs continuously once a section starts, even if you switch tabs. Unanswered questions count as incorrect. Answers and explanations remain hidden until both sections finish. Reloading resets the attempt. You can pause between sections.</div><div class="controls"><span class="muted">Free practice. No login or score collection.</span><button class="btn" data-action="start">Begin Logic and Reasoning →</button></div><p class="skiplink"><a href="../">Version 1</a> · <a href="../version-2/">Version 2</a> · <a href="../version-3/">Version 3</a></p>`}
function exam(){const section=sections[si],question=section.questions[qi],choice=answers[si][qi];const options=question.o.map((option,i)=>`<button class="answer ${choice===i?'active':''}" aria-pressed="${choice===i}" data-choice="${i}"><span class="key">${'ABCD'[i]}</span><span>${esc(option)}</span></button>`).join('');return `<div class="toprow"><div><div class="label">Section ${si+1} of 2 · ${esc(section.title)}</div><h2>Question ${qi+1} / ${section.questions.length}</h2><div class="muted">${answered(si)} answered · ${section.questions.length-answered(si)} unanswered</div></div><div id="timer" role="timer" aria-label="Section time remaining" class="time ${left()<=120?'warn':''}">${clockFormat(left())}</div></div><div class="track"><div class="fill" style="width:${((qi+1)/section.questions.length)*100}%"></div></div><div class="prompt">${esc(question.q)}</div><div class="answers">${options}</div><div class="controls"><button class="btn secondary" data-action="prev" ${qi===0?'disabled':''}>← Previous</button><button class="btn" data-action="next">${qi===section.questions.length-1?(si===0?'Finish section 1 →':'See results →'):'Next question →'}</button></div><div class="minor">${choice===null?'No answer selected. You can skip and return.':'Your choice is saved for this attempt.'} The answer key is shown only after completion.</div>`}
function intermission(){return `<div class="label">Section 1 finished</div><h1>Attention to Detail comes next</h1><p>Logic and Reasoning is complete. Your answers are locked and your results stay hidden until the end.</p><div class="statgrid"><div class="stat"><b>12 questions</b><span>Attention to Detail</span></div><div class="stat"><b>13 minutes</b><span>Your timer begins when you start this section.</span></div></div><div class="note">Section 1 status: ${completion[0]}. Unanswered questions: ${sections[0].questions.length-answered(0)}.</div><div class="controls"><span class="muted">You may take a break now.</span><button class="btn" data-action="next-section">Start Attention to Detail →</button></div>`}
function resultItem(q,j,k){const answer=answers[j][k],ok=answer===q.a,state=answer===null?'Skipped':ok?'Correct':'Incorrect',clazz=answer===null?'skip':ok?'ok':'bad';return `<details><summary><span>Q${k+1}. ${esc(q.q.replace(/\n/g,' ').slice(0,80))}${q.q.length>80?'…':''}</span><span class="outcome ${clazz}">${state}</span></summary><div class="body"><p><b>Question:</b> ${esc(q.q).replace(/\n/g,'<br>')}</p><p><b>Your answer:</b> ${answer===null?'Unanswered':esc('ABCD'[answer]+'. '+q.o[answer])}</p><p><b>Correct answer:</b> ${esc('ABCD'[q.a]+'. '+q.o[q.a])}</p><p><b>Explanation:</b> ${esc(q.e)}</p></div></details>`}
function results(){const total=score(0)+score(1);return `<div class="label">Version 4 · Assessment finished</div><h1>Your results and explanations</h1><p class="muted">Each question is scored as correct, incorrect or skipped. Expand any item for a worked solution.</p><div class="gridresult"><div class="scorebox"><strong>${total}/38</strong><span>Overall (${Math.round(100*total/38)}%)</span></div><div class="scorebox"><strong>${score(0)}/26</strong><span>Logic and Reasoning</span></div><div class="scorebox"><strong>${score(1)}/12</strong><span>Attention to Detail</span></div></div><p class="muted">Section 1: ${completion[0]} · Section 2: ${completion[1]}</p><div class="controls"><button class="btn secondary" data-action="expand">Expand all explanations</button><button class="btn secondary" data-action="collapse">Collapse all</button><button class="btn" data-action="reset">Restart version 4 ↻</button></div>${sections.map((s,j)=>`<section class="review"><h2>${j+1}. ${esc(s.title)} — ${score(j)}/${s.questions.length}</h2>${s.questions.map((q,k)=>resultItem(q,j,k)).join('')}</section>`).join('')}<p class="skiplink"><a href="../">Version 1</a> · <a href="../version-2/">Version 2</a> · <a href="../version-3/">Version 3</a></p>`}
function render(){app.innerHTML=phase==='intro'?intro():phase==='exam'?exam():phase==='intermission'?intermission():results()}
app.addEventListener('click',ev=>{const button=ev.target.closest('button');if(!button||!app.contains(button)||button.disabled)return;if(button.hasAttribute('data-choice')){if(phase!=='exam')return;if(left()<=0){complete(true);return;}answers[si][qi]=Number(button.dataset.choice);render();return;}switch(button.dataset.action){case 'start':if(phase==='intro')start(0);break;case 'prev':if(phase==='exam'&&qi>0){qi--;render()}break;case 'next':if(phase==='exam'){if(left()<=0){complete(true);break}if(qi===sections[si].questions.length-1)complete(false);else{qi++;render()}}break;case 'next-section':if(phase==='intermission')start(1);break;case 'expand':app.querySelectorAll('details').forEach(d=>d.open=true);break;case 'collapse':app.querySelectorAll('details').forEach(d=>d.open=false);break;case 'reset':stop();phase='intro';si=0;qi=0;completion=['',''];answers=sections.map(s=>Array(s.questions.length).fill(null));render();break}});
render();
})();
</script></body></html>
