<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EXS Practice Assessment — Version 6 (38 new questions)</title><style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f2f8f5;color:#163a33}
*{box-sizing:border-box}body{margin:0;padding:24px 16px}
main{max-width:860px;margin:auto;background:white;border:1px solid #cce2db;border-radius:18px;box-shadow:0 12px 36px #172c3d12;overflow:hidden}
header{background:linear-gradient(110deg,#234d43,#218b77);color:white;padding:24px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header strong{font-size:20px;letter-spacing:-.03em}header small{display:block;color:#d9fff3;margin-top:5px;font-size:12px}header .pill{background:#ffffff20;color:white;border:1px solid #ffffff40;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:750}
article{padding:28px 30px 34px;min-height:420px}h1{font-size:26px;line-height:1.22;margin:0 0 12px;letter-spacing:-.025em}h2{font-size:20px;margin:18px 0 12px}p{line-height:1.55;color:#334854}a{color:#16715f}button{font:inherit;cursor:pointer}
.muted{color:#60747b;font-size:14px}.label{text-transform:uppercase;letter-spacing:.10em;font-size:11px;color:#16715f;font-weight:800}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.stat{border:1px solid #d4e3e7;background:#f7fcfc;border-radius:12px;padding:18px}.stat b{display:block;font-size:23px;color:#16715f;margin-bottom:6px}.stat span{font-size:13px;color:#4e6570}
.note{padding:13px 15px;border-radius:10px;background:#f0f6f7;color:#40565c;font-size:14px;line-height:1.55}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:25px}
.btn{border:1px solid #16715f;background:#218c77;color:white;padding:12px 19px;font-weight:750;border-radius:10px}.btn:hover{background:#0e6353}.btn.secondary{background:#fff;color:#125d51;border-color:#bed2d7}.btn.secondary:hover{background:#ecf7f8}.btn:disabled{opacity:.42;cursor:default}button:focus-visible,summary:focus-visible{outline:3px solid #e6aa30;outline-offset:3px}
.toprow{display:flex;gap:10px;justify-content:space-between;align-items:start}.time{padding:10px 12px;border:1px solid #b4cbd0;background:#edf8f9;color:#175c65;font-variant-numeric:tabular-nums;font-size:18px;font-weight:850;border-radius:9px;white-space:nowrap}.time.warn{background:#fff1eb;border-color:#f4c3af;color:#a3391c}
.track{height:8px;border-radius:20px;background:#e4ecee;overflow:hidden;margin:20px 0 24px}.fill{height:100%;background:#bb6033;transition:width .14s ease}
.prompt{font-size:21px;white-space:pre-line;line-height:1.45;margin:15px 0 22px;font-weight:760;letter-spacing:-.01em}.answers{display:grid;gap:10px}.answer{width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:15px;border:1px solid #cfdde1;background:#fff;color:#153039;border-radius:11px;line-height:1.45}.answer:hover{background:#f4fcfd;border-color:#73aeb8}.answer.active{border:2px solid #a4542c;background:#e8f8fa;padding:14px}.key{flex:0 0 28px;border:1px solid #c4d4d9;background:#f4f8f9;color:#375860;border-radius:7px;height:28px;display:grid;place-items:center;font-size:13px;font-weight:800}.answer.active .key{background:#a4542c;color:#fff;border-color:#a4542c}.minor{font-size:13px;color:#698087;margin-top:16px}
.gridresult{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:22px 0}.scorebox{text-align:center;border:1px solid #dae5e8;border-radius:12px;padding:15px}.scorebox strong{font-size:25px;display:block;color:#16715f}.scorebox span{font-size:12px;color:#4a626d}.review{margin-top:27px}.review h2{border-bottom:1px solid #d9e5e9;padding-bottom:9px}.review details{border:1px solid #dce6e9;border-radius:10px;margin:9px 0;overflow:hidden}.review summary{padding:13px 15px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:14px;font-weight:650}.body{padding:0 16px 14px;font-size:14px}.body p{margin:8px 0}.ok{color:#087a54}.bad{color:#b33230}.skip{color:#647882}.outcome{font-weight:850;white-space:nowrap}.skiplink{font-size:13px;margin-top:10px}
@media(max-width:550px){body{padding:0;background:white}main{border:0;border-radius:0;box-shadow:none}header{padding:20px}article{padding:21px}.statgrid,.gridresult{grid-template-columns:1fr}.prompt{font-size:19px}.controls>.btn{flex:1}}
</style></head>
<body><main><header><div><strong>EXS Practice Assessment · Version 6</strong><small>Independent practice · Not an official TestGorilla assessment</small></div><div class="pill">38 new questions · 32 minutes</div></header>
<article id="app" aria-live="polite">Loading assessment…</article></main>
<script>
(()=>{'use strict';
const sections=[{"title":"Logic and Reasoning","seconds":1140,"questions":[{"q":"Find the next term.\n3, 8, 17, 30, 47, ?","o":["64","66","68","70"],"a":2,"e":"The differences are 5, 9, 13, 17, increasing by 4 each time. The next difference is 21, so 47 + 21 = 68."},{"q":"Two patterns are interleaved. What is missing?\n5, 30, 10, 27, 20, 24, 40, ?","o":["18","21","22","23"],"a":1,"e":"Odd-positioned terms double: 5, 10, 20, 40. Even-positioned terms decrease by 3: 30, 27, 24, 21."},{"q":"Which letter follows?\nA, D, H, M, S, ?","o":["X","Y","Z","A"],"a":2,"e":"The jumps are +3, +4, +5 and +6 letters, so the next jump is +7. S is position 19 and 19+7=26, which is Z."},{"q":"All rows use the same rule.\n3 | 4 → 13\n5 | 2 → 27\n4 | 6 → ?","o":["20","22","24","26"],"a":1,"e":"Square the first number and add the second: 3²+4=13, 5²+2=27, 4²+6=22."},{"q":"All inspectors are certified. Some inspectors specialize in robotics. What must be true?","o":["Every certified person is an inspector.","Some robotics specialists are certified.","No robotics specialist is an inspector.","Every inspector is a robotics specialist."],"a":1,"e":"At least some inspectors specialize in robotics, and all inspectors are certified. Consequently some robotics specialists are certified."},{"q":"If an order is dispatched, its barcode has already been scanned. Order F-18 has NOT had its barcode scanned. What follows?","o":["It has already been dispatched.","The barcode was lost.","It has not been dispatched.","It can never be dispatched."],"a":2,"e":"Dispatch implies a previous scan. Since the scan has not happened, the order cannot yet have been dispatched under the stated rule."},{"q":"Tasks A, B, C, D and E must follow these constraints: A immediately before B; D before A; C after B; E after C. Which order is valid?","o":["D – A – B – C – E","A – B – D – C – E","D – A – C – B – E","D – A – B – E – C"],"a":0,"e":"Only D–A–B–C–E respects D before A, the adjacency of A and B, and C before E."},{"q":"Two teams share materials in the ratio 7:5. The larger team receives 84 more units. How many units are shared in total?","o":["336","420","504","588"],"a":2,"e":"The difference is 2 ratio parts = 84, so one part is 42. Total parts are 7+5=12, giving 12×42=504."},{"q":"Eight analysts process an average of 75 records each; four others average 90 records each. What is the overall average per analyst?","o":["78","80","82","82.5"],"a":1,"e":"Total records are 8×75+4×90=960. Across 12 analysts, the weighted mean is 960÷12=80."},{"q":"A delivery company completes 289 jobs, equal to 85% of its monthly target. What is the original target?","o":["325","330","340","350"],"a":2,"e":"The target is 289÷0.85=340 jobs. Dividing by 0.85 reverses the percentage."},{"q":"A product costing €180 falls in price by 10%, then rises by 10%. What is the new price?","o":["€178.20","€180.00","€181.80","€198.00"],"a":0,"e":"€180×0.90×1.10=€178.20. The changes do not cancel because the second percentage applies to the reduced price."},{"q":"A store offers 20% off, followed by another 5% off the discounted price. What percent of the ORIGINAL price is saved?","o":["23%","24%","25%","26%"],"a":1,"e":"Remaining price is 0.80×0.95=0.76 of the original, so the discount is 24% overall."},{"q":"A service costs €96 after a 20% reduction. What was its original price?","o":["€112","€115.20","€120","€125"],"a":2,"e":"€96 is 80% of the initial price. Original=96÷0.80=€120."},{"q":"Pipe X fills a tank in 9 hours; Pipe Y fills it in 18 hours. How long do they take together at constant rates?","o":["4.5 hours","5 hours","6 hours","7 hours"],"a":2,"e":"Their rate is 1/9+1/18=1/6 of a tank per hour. One full tank therefore takes 6 hours."},{"q":"A machine makes 27 pieces/hour during an 8-hour shift but stops for 40 minutes. How many pieces can it make at a constant operating rate?","o":["180","189","192","198"],"a":3,"e":"The machine runs for 8−2/3=7⅓ hours. At 27 pieces/hour, that produces 27×7⅓=198 pieces."},{"q":"A vehicle travels 40 km at 20 km/h, then 40 km at 40 km/h. With no stops, what is the average speed?","o":["25 km/h","26⅔ km/h","30 km/h","32 km/h"],"a":1,"e":"The first leg takes 2 hours and the second 1 hour. The vehicle covers 80 km in 3 hours: 80÷3=26⅔ km/h."},{"q":"A diagnostic begins on Monday at 21:35 and lasts 3 hours 50 minutes. When does it finish?","o":["Tuesday 00:25","Tuesday 01:15","Tuesday 01:25","Tuesday 02:25"],"a":2,"e":"21:35+3 hours=00:35 Tuesday; adding 50 minutes gives Tuesday 01:25."},{"q":"A container holds 4 yellow and 6 green tokens. Two are drawn WITHOUT replacement. What is the probability both are yellow?","o":["2/15","1/5","4/25","1/3"],"a":0,"e":"The probabilities are 4/10 then 3/9. Their product is 12/90=2/15."},{"q":"A final digit is randomly selected from 0–9. What is the probability it is EVEN or GREATER THAN 7?","o":["1/2","3/5","7/10","4/5"],"a":1,"e":"Even digits are 0,2,4,6,8. Greater-than-7 digits are 8 and 9. Counting 8 only once gives 6 favorable digits out of 10: 3/5."},{"q":"A rectangle has perimeter 54 m and length 16 m. What is its area?","o":["160 m²","168 m²","176 m²","192 m²"],"a":2,"e":"Half the perimeter is length + width = 27. The width is 27−16=11 m. Area=16×11=176 m²."},{"q":"A robot starts at (−2,3), moves 3 units east, then 5 units south, then 2 units west. Where does it finish?","o":["(−1,−2)","(3,−2)","(−1,8)","(1,−2)"],"a":0,"e":"Start (−2,3). East gives (1,3); south gives (1,−2); west gives (−1,−2)."},{"q":"Every approved badge is active, but some active badges are not approved. Badge X is active. What can we conclude?","o":["It must be approved.","It cannot be approved.","It might or might not be approved.","No approved badges are active."],"a":2,"e":"Being active is required for approval, but active status alone does not establish approval. Both possibilities remain."},{"q":"A file is marked COMPLETE if and only if both managers have signed it. The file is not marked COMPLETE. What must be true?","o":["Both managers refused to sign.","At least one manager has not signed.","Exactly one manager signed.","The file was canceled."],"a":1,"e":"COMPLETE occurs precisely when both signatures are present. Not COMPLETE means at least one signature is missing."},{"q":"An alert always sounds if a cooling fan fails. The alert is silent. Under this rule, what follows?","o":["The fan did not fail.","The fan failed.","The alert device is broken.","Nothing can be inferred."],"a":0,"e":"If failure always causes an alert, then a silent alert implies the fan did not fail, assuming the rule is true."},{"q":"Out of 500 requests, 30% are urgent. Of the NON-urgent requests, 20% need review. How many non-urgent requests need review?","o":["55","60","70","100"],"a":2,"e":"There are 500×0.70=350 non-urgent requests, and 350×0.20=70 need review."},{"q":"Vendor A charges €8.50 per part plus €25 delivery. Vendor B charges €10 per part plus €8 delivery. For 20 parts, which is cheaper and by how much?","o":["A by €8","A by €13","B by €8","B by €13"],"a":1,"e":"A charges 20×€8.50+€25=€195. B charges 20×€10+€8=€208. A is €13 cheaper."}]},{"title":"Attention to Detail","seconds":780,"questions":[{"q":"Master code: JK-6O8-I51 (characters after 6 and after the hyphen are capital O and capital I). Which copy matches EXACTLY?","o":["JK-608-I51","JK-6O8-151","JK-6O8-I51","JK-6O8-I5I"],"a":2,"e":"Only JK-6O8-I51 preserves the capital O and capital I in their correct positions, rather than resembling numbers."},{"q":"Master email: dispatch.unit+west@relayhub.net. Which copy is EXACT?","o":["dispatch.unit+west@relayhub.net","dispatch.unit-west@relayhub.net","dispatch.unit+west@relayhub.com","dispatch.unit+west@relayhub,net"],"a":0,"e":"The first option preserves the dot, plus sign, recipient, domain, and .net suffix."},{"q":"How many times does the EXACT code BP-502K appear?\nBP-502K · BP-520K · BP-502K · BP-502X · BP-502K · PB-502K","o":["2","3","4","5"],"a":1,"e":"The exact code occurs in positions 1, 3, and 5: three occurrences."},{"q":"An inventory must contain every serial from KM-207 to KM-212, inclusive. The scanner lists KM-207, KM-208, KM-209, KM-211, KM-212. What is missing?","o":["KM-206","KM-210","KM-211","KM-213"],"a":1,"e":"The consecutive range includes KM-210 between KM-209 and KM-211; it is the only missing serial."},{"q":"Which line contains a calculation error?\nA: 6 × €17 = €102\nB: 8 × €12 = €96\nC: 9 × €11 = €98\nD: 4 × €21 = €84","o":["A","B","C","D"],"a":2,"e":"C is incorrect: 9×11=99, not 98. The remaining calculations are correct."},{"q":"Original: Facility Q, Floor 4, Room 218\nCopied: Facility Q, Floor 4, Room 281\nWhich field differs?","o":["Facility","Floor","Room","No field"],"a":2,"e":"The room numbers 218 and 281 differ. Facility and floor match."},{"q":"A receipt has 4 units at €9.85, 2 units at €6.40, and a €4.30 delivery charge. What is the exact total?","o":["€55.50","€56.50","€57.50","€58.50"],"a":1,"e":"4×€9.85=€39.40; 2×€6.40=€12.80; add €4.30 to obtain €56.50."},{"q":"A process starts at 10:47 and finishes at 12:06 on the same day. What is the duration?","o":["69 minutes","74 minutes","79 minutes","89 minutes"],"a":2,"e":"60 minutes pass by 11:47, followed by 19 minutes to 12:06. Total is 79 minutes."},{"q":"Dates use DD/MM/YYYY. Which date is INVALID?","o":["30/09/2026","31/10/2026","31/11/2026","28/02/2026"],"a":2,"e":"November has only 30 days, so November 31 is not a valid date."},{"q":"Reference numbers should be STRICTLY increasing:\n1: 0078\n2: 0081\n3: 0085\n4: 0084\n5: 0089\nWhich entry first violates the rule?","o":["Entry 2","Entry 3","Entry 4","Entry 5"],"a":2,"e":"The sequence first decreases from 0085 to 0084, so entry 4 violates increasing order."},{"q":"Master filename: estimate_26B_final.pdf\nWhich entry matches EXACTLY?","o":["estimate_26B_final.pdf","estimate_26b_final.pdf","estimate-26B_final.pdf","estimate_26B_final.pfd"],"a":0,"e":"Only the first option reproduces the underscores, uppercase B, and .pdf extension."},{"q":"Approved: Batch NQ-34, quantity 76, shelf D7. Which copied row has an incorrect QUANTITY?","o":["NQ-34 | 76 | D7","NQ-34 | 67 | D7","NQ-43 | 76 | D7","NQ-34 | 76 | D8"],"a":1,"e":"Only the second row has a wrong quantity: 67 instead of 76. The other incorrect rows alter the batch or shelf rather than the quantity."}]}];
const app=document.getElementById('app');
let phase='intro',si=0,qi=0,deadline=0,interval=null;
let answers=sections.map(s=>Array(s.questions.length).fill(null)),completion=['',''];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clockFormat=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
const left=()=>Math.max(0,Math.ceil((deadline-Date.now())/1000));
function stop(){if(interval!==null){clearInterval(interval);interval=null}}
function start(index){stop();si=index;qi=0;deadline=Date.now()+sections[index].seconds*1000;phase='exam';render();interval=setInterval(tick,250)}
function tick(){if(phase!=='exam')return;const t=left();if(!t){complete(true);return;}const el=document.getElementById('timer');if(el){el.textContent=clockFormat(t);el.classList.toggle('warn',t<=120);}}
function complete(expired){if(phase!=='exam')return;stop();completion[si]=expired?'Timer expired':'Submitted';phase=si===0?'intermission':'results';render()}
const answered=i=>answers[i].filter(x=>x!==null).length;
const score=i=>answers[i].reduce((sum,a,n)=>sum+(a===sections[i].questions[n].a?1:0),0);
function intro(){return `<span class="label">New challenge · Medium difficulty</span><h1>38 completely new questions · Fourth edition</h1><p>Practice logic, quantitative reasoning, scheduling and precision checking with the same section sizes and time limits as previous versions.</p><div class="statgrid"><div class="stat"><b>26 questions</b><span>Logic and Reasoning · 19 minutes</span></div><div class="stat"><b>12 questions</b><span>Attention to Detail · 13 minutes</span></div></div><div class="note">One question at a time. You can revisit previous questions within the current section. Time runs continuously once a section starts, even if you switch tabs. Unanswered questions count as incorrect. Answers and explanations remain hidden until both sections finish. Reloading resets the attempt. You can pause between sections.</div><div class="controls"><span class="muted">Free practice. No login or score collection.</span><button class="btn" data-action="start">Begin Logic and Reasoning →</button></div><p class="skiplink"><a href="../">Version 1</a> · <a href="../version-2/">Version 2</a> · <a href="../version-3/">Version 3</a> · <a href="../version-4/">Version 4</a></p>`}
function exam(){const section=sections[si],question=section.questions[qi],choice=answers[si][qi];const options=question.o.map((option,i)=>`<button class="answer ${choice===i?'active':''}" aria-pressed="${choice===i}" data-choice="${i}"><span class="key">${'ABCD'[i]}</span><span>${esc(option)}</span></button>`).join('');return `<div class="toprow"><div><div class="label">Section ${si+1} of 2 · ${esc(section.title)}</div><h2>Question ${qi+1} / ${section.questions.length}</h2><div class="muted">${answered(si)} answered · ${section.questions.length-answered(si)} unanswered</div></div><div id="timer" role="timer" aria-label="Section time remaining" class="time ${left()<=120?'warn':''}">${clockFormat(left())}</div></div><div class="track"><div class="fill" style="width:${((qi+1)/section.questions.length)*100}%"></div></div><div class="prompt">${esc(question.q)}</div><div class="answers">${options}</div><div class="controls"><button class="btn secondary" data-action="prev" ${qi===0?'disabled':''}>← Previous</button><button class="btn" data-action="next">${qi===section.questions.length-1?(si===0?'Finish section 1 →':'See results →'):'Next question →'}</button></div><div class="minor">${choice===null?'No answer selected. You can skip and return.':'Your choice is saved for this attempt.'} The answer key is shown only after completion.</div>`}
function intermission(){return `<div class="label">Section 1 finished</div><h1>Attention to Detail comes next</h1><p>Logic and Reasoning is complete. Your answers are locked and your results stay hidden until the end.</p><div class="statgrid"><div class="stat"><b>12 questions</b><span>Attention to Detail</span></div><div class="stat"><b>13 minutes</b><span>Your timer begins when you start this section.</span></div></div><div class="note">Section 1 status: ${completion[0]}. Unanswered questions: ${sections[0].questions.length-answered(0)}.</div><div class="controls"><span class="muted">You may take a break now.</span><button class="btn" data-action="next-section">Start Attention to Detail →</button></div>`}
function resultItem(q,j,k){const answer=answers[j][k],ok=answer===q.a,state=answer===null?'Skipped':ok?'Correct':'Incorrect',clazz=answer===null?'skip':ok?'ok':'bad';return `<details><summary><span>Q${k+1}. ${esc(q.q.replace(/\n/g,' ').slice(0,80))}${q.q.length>80?'…':''}</span><span class="outcome ${clazz}">${state}</span></summary><div class="body"><p><b>Question:</b> ${esc(q.q).replace(/\n/g,'<br>')}</p><p><b>Your answer:</b> ${answer===null?'Unanswered':esc('ABCD'[answer]+'. '+q.o[answer])}</p><p><b>Correct answer:</b> ${esc('ABCD'[q.a]+'. '+q.o[q.a])}</p><p><b>Explanation:</b> ${esc(q.e)}</p></div></details>`}
function results(){const total=score(0)+score(1);return `<div class="label">Version 6 · Assessment finished</div><h1>Your results and explanations</h1><p class="muted">Each question is scored as correct, incorrect or skipped. Expand any item for a worked solution.</p><div class="gridresult"><div class="scorebox"><strong>${total}/38</strong><span>Overall (${Math.round(100*total/38)}%)</span></div><div class="scorebox"><strong>${score(0)}/26</strong><span>Logic and Reasoning</span></div><div class="scorebox"><strong>${score(1)}/12</strong><span>Attention to Detail</span></div></div><p class="muted">Section 1: ${completion[0]} · Section 2: ${completion[1]}</p><div class="controls"><button class="btn secondary" data-action="expand">Expand all explanations</button><button class="btn secondary" data-action="collapse">Collapse all</button><button class="btn" data-action="reset">Restart version 6 ↻</button></div>${sections.map((s,j)=>`<section class="review"><h2>${j+1}. ${esc(s.title)} — ${score(j)}/${s.questions.length}</h2>${s.questions.map((q,k)=>resultItem(q,j,k)).join('')}</section>`).join('')}<p class="skiplink"><a href="../">Version 1</a> · <a href="../version-2/">Version 2</a> · <a href="../version-3/">Version 3</a> · <a href="../version-4/">Version 4</a> · <a href="../version-5/">Version 5</a></p>`}
function render(){app.innerHTML=phase==='intro'?intro():phase==='exam'?exam():phase==='intermission'?intermission():results()}
app.addEventListener('click',ev=>{const button=ev.target.closest('button');if(!button||!app.contains(button)||button.disabled)return;if(button.hasAttribute('data-choice')){if(phase!=='exam')return;if(left()<=0){complete(true);return;}answers[si][qi]=Number(button.dataset.choice);render();return;}switch(button.dataset.action){case 'start':if(phase==='intro')start(0);break;case 'prev':if(phase==='exam'&&qi>0){qi--;render()}break;case 'next':if(phase==='exam'){if(left()<=0){complete(true);break}if(qi===sections[si].questions.length-1)complete(false);else{qi++;render()}}break;case 'next-section':if(phase==='intermission')start(1);break;case 'expand':app.querySelectorAll('details').forEach(d=>d.open=true);break;case 'collapse':app.querySelectorAll('details').forEach(d=>d.open=false);break;case 'reset':stop();phase='intro';si=0;qi=0;completion=['',''];answers=sections.map(s=>Array(s.questions.length).fill(null));render();break}});
render();
})();
</script></body></html>
